          @Composable
          fun VoiceWaveformBar(
              bars: List<Int>,
              progress: Float,
              activeColor: Color = Color.White,
              inactiveColor: Color = Color(0x55FFFFFF),
              onSeek: ((Float) -> Unit)? = null,
              modifier: Modifier = Modifier
          ) {
              val safeBars = if (bars.isEmpty()) List(22) { 30 } else bars
              val gestureMod = if (onSeek != null) {
                  modifier
                      .pointerInput(safeBars.size) {
                          detectTapGestures { offset ->
                              val w = size.width.toFloat().coerceAtLeast(1f)
                              onSeek((offset.x / w).coerceIn(0f, 1f))
                          }
                      }
                      .pointerInput(Unit) {
                          detectHorizontalDragGestures { change, _ ->
                              change.consume()
                              val w = size.width.toFloat().coerceAtLeast(1f)
                              onSeek((change.position.x / w).coerceIn(0f, 1f))
                          }
                      }
              } else {
                  modifier
              }

              Row(
                  modifier = gestureMod.height(30.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(2.dp)
              ) {
                  safeBars.forEachIndexed { idx, amp ->
                      val barFrac = (idx.toFloat() + 0.5f) / safeBars.size.toFloat()
                      val filled = barFrac <= progress
                      val barHeight = (4f + (amp.coerceIn(8, 100) / 100f) * 22f).dp
                      Box(
                          modifier = Modifier
                              .weight(1f)
                              .height(barHeight)
                              .clip(RoundedCornerShape(3.dp))
                              .background(if (filled) activeColor else inactiveColor)
                      )
                  }
              }
          }

          @Composable
          fun DeviceLoginScreen(acc: UserAccount) {
              val ctx = LocalContext.current
              val clip = LocalClipboardManager.current
              var name by remember { mutableStateOf(acc.displayName) }
