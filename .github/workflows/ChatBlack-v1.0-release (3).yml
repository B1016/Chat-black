          @Composable
          fun QrCodeCanvas(url: String, sizeDp: Dp = 188.dp) {
              val matrix = remember(url) { QrCodeEncoder.encodeVersion2L(url) }
              Surface(
                  color = Color.White,
                  shape = RoundedCornerShape(16.dp),
                  modifier = Modifier.size(sizeDp)
              ) {
                  Canvas(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                      val n = matrix.size
                      val cell = size.width / n.toFloat()
                      for (r in 0 until n) {
                          for (c in 0 until n) {
                              if (matrix[r][c]) {
                                  drawRect(
                                      color = Color.Black,
                                      topLeft = Offset(c * cell, r * cell),
                                      size = Size(cell + 0.6f, cell + 0.6f)
                                  )
                              }
                          }
                      }
                  }
              }
          }

