              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null
          }

          object MediaHelper {
              private const val WAVE_BAR_COUNT = 22
              private var recorder: MediaRecorder? = null
              private var outFile: File? = null
              private var startMs: Long = 0L
              private var player: MediaPlayer? = null
              private val rawAmps = mutableListOf<Int>()

              private val bitmapCache = LruCache<String, Bitmap>(28)

              val isCurrentlyRecording = MutableStateFlow(false)
              val recordingSec = MutableStateFlow(0)
              val liveRecordingAmps = MutableStateFlow<List<Int>>(emptyList())

              val playingMsgId = MutableStateFlow<String?>(null)
              val voicePlaying = MutableStateFlow(false)
              val progressFraction = MutableStateFlow(0f)
              val currentSec = MutableStateFlow(0)

              fun startRecording(ctx: Context): Boolean {
                  return try {
                      cancelRecording()
                      val f = File(ctx.cacheDir, "voice_${System.currentTimeMillis()}.m4a")
                      outFile = f
                      val r = MediaRecorder()
                      r.setAudioSource(MediaRecorder.AudioSource.MIC)
                      r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      r.setAudioSamplingRate(16000)
                      r.setAudioEncodingBitRate(28000)
                      r.setOutputFile(f.absolutePath)
                      r.prepare()
                      r.start()
                      recorder = r
                      startMs = System.currentTimeMillis()
                      synchronized(rawAmps) { rawAmps.clear() }
                      liveRecordingAmps.value = List(WAVE_BAR_COUNT) { 12 }
                      recordingSec.value = 0
                      isCurrentlyRecording.value = true
                      startAmplitudeSampler()
                      true
                  } catch (e: Throwable) {
                      isCurrentlyRecording.value = false
                      false
                  }
              }

              private fun startAmplitudeSampler() {
                  BgramHub.scope.launch {
                      while (isActive && isCurrentlyRecording.value) {
                          try {
                              val r = recorder
                              if (r != null) {
                                  val amp = r.maxAmplitude
                                  val norm = ((amp.toFloat() / 16000f).coerceIn(0.08f, 1f) * 100f).toInt()
                                  synchronized(rawAmps) {
                                      rawAmps.add(norm)
                                      val tail = rawAmps.takeLast(WAVE_BAR_COUNT)
                                      val padded = if (tail.size < WAVE_BAR_COUNT) List(WAVE_BAR_COUNT - tail.size) { 10 } + tail else tail
                                      liveRecordingAmps.value = padded
                                  }
                                  recordingSec.value = ((System.currentTimeMillis() - startMs) / 1000L).toInt()
                              }
                          } catch (e: Throwable) {}
                          delay(130)
                      }
                  }
              }

              fun cancelRecording() {
                  isCurrentlyRecording.value = false
                  val r = recorder
                  recorder = null
                  try { r?.stop() } catch (e: Throwable) {}
                  try { r?.release() } catch (e: Throwable) {}
                  try { outFile?.delete() } catch (e: Throwable) {}
                  outFile = null
              }

              fun stopRecording(): VoiceClip? {
                  isCurrentlyRecording.value = false
                  val r = recorder ?: return null
                  recorder = null
                  return try {
                      r.stop()
                      r.release()
                      val sec = ((System.currentTimeMillis() - startMs) / 1000L).toInt().coerceAtLeast(1)
                      val f = outFile
                      outFile = null
                      val waveCsv = buildNormalizedWaveformCsv()
                      if (f != null && f.exists()) {
                          val bytes = f.readBytes()
                          f.delete()
                          VoiceClip(Base64.encodeToString(bytes, Base64.NO_WRAP), sec, waveCsv)
                      } else {
                          null
                      }
                  } catch (e: Throwable) {
                      null
                  }
              }

              private fun buildNormalizedWaveformCsv(): String {
                  val snapshot = synchronized(rawAmps) { rawAmps.toList() }
                  if (snapshot.isEmpty()) {
                      return List(WAVE_BAR_COUNT) { 25 }.joinToString(",")
                  }
                  val bars = mutableListOf<Int>()
                  for (i in 0 until WAVE_BAR_COUNT) {
                      val idx = ((i.toFloat() / WAVE_BAR_COUNT.toFloat()) * snapshot.size).toInt().coerceIn(0, snapshot.size - 1)
                      bars.add(snapshot[idx].coerceIn(10, 100))
                  }
                  return bars.joinToString(",")
              }

              fun parseWaveformBars(csv: String): List<Int> {
                  val parsed = csv.split(",").mapNotNull { it.trim().toIntOrNull()?.coerceIn(10, 100) }
                  if (parsed.size >= 8) return parsed
                  return listOf(22, 40, 68, 35, 85, 54, 30, 75, 92, 48, 25, 62, 80, 44, 32, 70, 88, 52, 28, 60, 45, 34)
              }

              fun toggleVoicePlayback(ctx: Context, msgId: String, b64: String) {
                  try {
                      if (playingMsgId.value == msgId && player != null) {
                          val p = player!!
                          if (p.isPlaying) {
                              p.pause()
                              MediaHelper.voicePlaying.value = false
                          } else {
                              p.start()
                              MediaHelper.voicePlaying.value = true
                              startProgressTracker(msgId)
                          }
                          return
                      }

                      player?.release()
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      val tmp = File(ctx.cacheDir, "play_${System.currentTimeMillis()}.m4a")
                      tmp.writeBytes(bytes)
                      val mp = MediaPlayer().apply {
                          setDataSource(tmp.absolutePath)
                          prepare()
                          start()
                          setOnCompletionListener {
                              it.release()
                              tmp.delete()
                              if (playingMsgId.value == msgId) {
                                  MediaHelper.voicePlaying.value = false
                                  progressFraction.value = 0f
                                  currentSec.value = 0
                                  playingMsgId.value = null
                              }
                          }
                      }
                      player = mp
                      playingMsgId.value = msgId
                      MediaHelper.voicePlaying.value = true
                      progressFraction.value = 0f
                      currentSec.value = 0
                      startProgressTracker(msgId)
                  } catch (e: Throwable) {}
              }

              fun seekVoice(msgId: String, fraction: Float) {
                  val clamped = fraction.coerceIn(0f, 1f)
                  if (playingMsgId.value == msgId && player != null) {
                      try {
                          val p = player!!
                          val dur = p.duration.coerceAtLeast(1)
                          val targetMs = (dur * clamped).toInt()
                          p.seekTo(targetMs)
                          progressFraction.value = clamped
                          currentSec.value = targetMs / 1000
                      } catch (e: Throwable) {}
                  }
              }

              private fun startProgressTracker(msgId: String) {
                  BgramHub.scope.launch {
                      while (isActive && playingMsgId.value == msgId && MediaHelper.voicePlaying.value) {
                          try {
                              val p = player
                              if (p != null && p.isPlaying) {
                                  val dur = p.duration.coerceAtLeast(1)
                                  val pos = p.currentPosition.coerceAtLeast(0)
                                  progressFraction.value = (pos.toFloat() / dur.toFloat()).coerceIn(0f, 1f)
                                  currentSec.value = pos / 1000
                              }
                          } catch (e: Throwable) {}
                          delay(120)
                      }
                  }
              }

              fun encodeUriToAvatarB64(ctx: Context, uri: Uri): String {
                  return encodeScaledImageB64(ctx, uri, maxDim = 80, quality = 70)
              }

              fun encodeUriToChatImageB64(ctx: Context, uri: Uri): String {
                  return encodeScaledImageB64(ctx, uri, maxDim = 420, quality = 65)
              }

              private fun encodeScaledImageB64(ctx: Context, uri: Uri, maxDim: Int, quality: Int): String {
                  return try {
                      val boundsOpts = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      ctx.contentResolver.openInputStream(uri)?.use { s ->
                          BitmapFactory.decodeStream(s, null, boundsOpts)
                      }
                      val rawW = boundsOpts.outWidth
                      val rawH = boundsOpts.outHeight
                      if (rawW <= 0 || rawH <= 0) return ""

                      var sampleSize = 1
                      while (rawW / sampleSize > maxDim * 2 || rawH / sampleSize > maxDim * 2) {
                          sampleSize *= 2
                      }

                      val decodeOpts = BitmapFactory.Options().apply {
                          inSampleSize = sampleSize
                          inPreferredConfig = Bitmap.Config.RGB_565
                      }
                      val subsampled = ctx.contentResolver.openInputStream(uri)?.use { s ->
                          BitmapFactory.decodeStream(s, null, decodeOpts)
                      } ?: return ""

                      val w = subsampled.width.coerceAtLeast(1)
                      val h = subsampled.height.coerceAtLeast(1)
                      val scale = (maxDim.toFloat() / maxOf(w, h).toFloat()).coerceAtMost(1f)
                      val nw = (w * scale).toInt().coerceAtLeast(1)
                      val nh = (h * scale).toInt().coerceAtLeast(1)
                      val scaled = if (nw != w || nh != h) {
                          Bitmap.createScaledBitmap(subsampled, nw, nh, true)
                      } else {
                          subsampled
                      }
                      val bos = ByteArrayOutputStream()
                      scaled.compress(Bitmap.CompressFormat.JPEG, quality, bos)
                      if (scaled !== subsampled) {
                          subsampled.recycle()
                      }
                      Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)
                  } catch (e: Throwable) {
                      ""
                  }
              }

              fun decodeBitmap(b64: String): Bitmap? {
                  if (b64.isBlank()) return null
                  val cacheKey = "${b64.hashCode()}_${b64.length}"
                  bitmapCache.get(cacheKey)?.let { cached ->
                      if (!cached.isRecycled) return cached
                  }
                  return try {
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      val opts = BitmapFactory.Options().apply {
                          inPreferredConfig = Bitmap.Config.RGB_565
                      }
                      val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts)
                      if (bmp != null) {
                          bitmapCache.put(cacheKey, bmp)
                      }
                      bmp
                  } catch (e: Throwable) {
                      null
                  }
              }
          }

