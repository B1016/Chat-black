          @Composable
          fun ChatRoomScreen(cid: String) {
              val ctx = LocalContext.current
              val convs by BgramHub.conversations.collectAsState()
              val allMsgs by BgramHub.messages.collectAsState()
              val conv = convs.firstOrNull { it.convId == cid } ?: ConversationMeta(cid, cid)
              val list = allMsgs.filter { it.convId == cid }

              val isRecording by MediaHelper.isCurrentlyRecording.collectAsState()
              val recSec by MediaHelper.recordingSec.collectAsState()
              val liveAmps by MediaHelper.liveRecordingAmps.collectAsState()

              val playingMsgId by MediaHelper.playingMsgId.collectAsState()
              val isPlayingAudio by MediaHelper.voicePlaying.collectAsState()
              val audioProgress by MediaHelper.progressFraction.collectAsState()
              val audioCurSec by MediaHelper.currentSec.collectAsState()

              var textIn by remember { mutableStateOf("") }
              var stagedVoice by remember { mutableStateOf<VoiceClip?>(null) }
              var replyingTo by remember { mutableStateOf<ChatItem?>(null) }
              var reactionTargetId by remember { mutableStateOf<String?>(null) }
              var expandedBitmap by remember { mutableStateOf<Bitmap?>(null) }
              val listState = rememberLazyListState()
              val timeFmt = remember { SimpleDateFormat("h:mm a", Locale.getDefault()) }

              val imagePicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      val imgB64 = MediaHelper.encodeUriToChatImageB64(ctx, uri)
                      if (imgB64.isNotBlank()) {
                          BgramHub.sendChat(
                              cid = cid,
                              text = textIn.trim(),
                              imageB64 = imgB64,
                              replyTo = replyingTo
                          )
                          textIn = ""
                          replyingTo = null
                      }
                  }
              }

              BackHandler {
                  if (expandedBitmap != null) {
                      expandedBitmap = null
                  } else {
                      BgramHub.activeConvId.value = null
                  }
              }

              LaunchedEffect(cid) {
                  BgramHub.markConversationReadAndNotify(cid)
              }

              LaunchedEffect(list.size) {
                  if (list.isNotEmpty()) listState.animateScrollToItem(list.size - 1)
              }

              Scaffold(
                  containerColor = Color.Black,
                  topBar = {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xFF161618))
                              .statusBarsPadding()
                              .padding(horizontal = 8.dp, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier
                                  .clickable { BgramHub.activeConvId.value = null }
                                  .padding(4.dp)
                          ) {
                              Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Back", tint = Color(0xFF007AFF))
                              Text("ChatBlack", color = Color(0xFF007AFF), fontSize = 15.sp, fontWeight = FontWeight.Bold)
                          }
                          Column(modifier = Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally) {
                              AvatarCircle(conv.title, conv.avatarB64, 28.dp, isGroup = conv.isGroup)
                              Text(conv.title, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold, maxLines = 1)
                              Text(
                                  text = if (conv.isGroup) "Group (${conv.membersCsv})" else "@${conv.convId}",
                                  color = Color.Gray,
                                  fontSize = 10.sp,
                                  maxLines = 1
                              )
                          }
                          Spacer(Modifier.width(72.dp))
                      }
                  }
              ) { pad ->
                  Column(modifier = Modifier.fillMaxSize().padding(pad).background(Color.Black)) {
                      LazyColumn(
                          state = listState,
                          modifier = Modifier.weight(1f).fillMaxWidth(),
                          contentPadding = PaddingValues(14.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          items(list, key = { it.id }) { m ->
                              val msgImg: Bitmap? = remember(m.imageB64) { MediaHelper.decodeBitmap(m.imageB64) }
                              val reactions = remember(m.reactionsCsv) { m.reactionsCsv.split("|").filter { it.isNotBlank() } }
                              val waveBars = remember(m.waveformCsv) { MediaHelper.parseWaveformBars(m.waveformCsv) }

                              Column(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalAlignment = if (m.mine) Alignment.End else Alignment.Start
                              ) {
                                  Text(
                                      text = "${m.senderName.ifBlank { m.senderId }} (@${m.senderId}) - ${timeFmt.format(Date(m.ts))}",
                                      fontSize = 10.sp,
                                      color = Color.Gray,
                                      modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp)
                                  )

                                  Surface(
                                      color = if (m.mine) Color(0xFF007AFF) else Color(0xFF26252A),
                                      shape = RoundedCornerShape(18.dp),
                                      modifier = Modifier
                                          .widthIn(min = 130.dp, max = 295.dp)
                                          .clickable {
                                              reactionTargetId = if (reactionTargetId == m.id) null else m.id
                                          }
                                  ) {
                                      Column(modifier = Modifier.padding(horizontal = 12.dp, vertical = 9.dp)) {
                                          if (m.replyToId.isNotBlank() || m.replyToText.isNotBlank()) {
                                              Surface(
                                                  color = Color(0x33000000),
                                                  shape = RoundedCornerShape(10.dp),
                                                  modifier = Modifier.fillMaxWidth().padding(bottom = 6.dp)
                                              ) {
                                                  Column(modifier = Modifier.padding(8.dp)) {
                                                      Text(
                                                          text = m.replyToSender.ifBlank { "Reply" },
                                                          color = Color.White,
                                                          fontWeight = FontWeight.Bold,
                                                          fontSize = 11.sp
                                                      )
                                                      Text(
                                                          text = m.replyToText,
                                                          color = Color(0xFFE5E5EA),
                                                          fontSize = 12.sp,
                                                          maxLines = 2,
                                                          overflow = TextOverflow.Ellipsis
                                                      )
                                                  }
                                              }
                                          }

                                          if (msgImg != null) {
                                              Image(
                                                  bitmap = msgImg.asImageBitmap(),
                                                  contentDescription = "Shared Image (Tap to Expand)",
                                                  contentScale = ContentScale.Crop,
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .heightIn(min = 120.dp, max = 220.dp)
                                                      .clip(RoundedCornerShape(12.dp))
                                                      .clickable {
                                                          expandedBitmap = msgImg
                                                      }
                                              )
                                              if (m.text.isNotBlank()) Spacer(Modifier.height(6.dp))
                                          }

                                          if (m.voiceB64.isNotBlank()) {
                                              val isThisPlaying = (playingMsgId == m.id && isPlayingAudio)
                                              val curFrac = if (playingMsgId == m.id) audioProgress else 0f
                                              val shownSec = if (playingMsgId == m.id) audioCurSec else m.voiceSec

                                              Row(
                                                  verticalAlignment = Alignment.CenterVertically,
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .padding(vertical = 2.dp)
                                              ) {
                                                  IconButton(
                                                      onClick = { MediaHelper.toggleVoicePlayback(ctx, m.id, m.voiceB64) },
                                                      modifier = Modifier
                                                          .size(36.dp)
                                                          .clip(CircleShape)
                                                          .background(Color(0x33000000))
                                                  ) {
                                                      Icon(
                                                          imageVector = if (isThisPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                                          contentDescription = "Play/Pause Voice",
                                                          tint = Color.White
                                                      )
                                                  }
                                                  Spacer(Modifier.width(10.dp))
                                                  Column(modifier = Modifier.weight(1f)) {
                                                      VoiceWaveformBar(
                                                          bars = waveBars,
                                                          progress = curFrac,
                                                          activeColor = Color.White,
                                                          inactiveColor = Color(0x55FFFFFF),
                                                          onSeek = { newFrac ->
                                                              if (playingMsgId != m.id) {
                                                                  MediaHelper.toggleVoicePlayback(ctx, m.id, m.voiceB64)
                                                              }
                                                              MediaHelper.seekVoice(m.id, newFrac)
                                                          },
                                                          modifier = Modifier.fillMaxWidth()
                                                      )
                                                      Spacer(Modifier.height(3.dp))
                                                      Text(
                                                          text = "${shownSec}s / ${m.voiceSec}s",
                                                          color = Color(0xFFE5E5EA),
                                                          fontSize = 10.sp
                                                      )
                                                  }
                                              }
                                          }

                                          if (m.text.isNotBlank()) {
                                              Text(
                                                  text = m.text,
                                                  color = Color.White,
                                                  fontSize = 15.sp
                                              )
                                          }
                                      }
                                  }

                                  if (reactions.isNotEmpty()) {
                                      Row(
                                          horizontalArrangement = Arrangement.spacedBy(4.dp),
                                          modifier = Modifier.padding(top = 3.dp, start = 4.dp, end = 4.dp)
                                      ) {
                                          reactions.forEach { r ->
                                              Surface(
                                                  color = Color(0xFF1C1C1E),
                                                  shape = RoundedCornerShape(10.dp),
                                                  modifier = Modifier.clickable {
                                                      val em = r.substringBefore(" ")
                                                      if (em.isNotBlank()) BgramHub.sendReaction(cid, m.id, em)
                                                  }
                                              ) {
                                                  Text(
                                                      text = r,
                                                      color = Color.White,
                                                      fontSize = 11.sp,
                                                      modifier = Modifier.padding(horizontal = 7.dp, vertical = 3.dp)
                                                  )
                                              }
                                          }
                                      }
                                  }

                                  if (reactionTargetId == m.id) {
                                      Surface(
                                          color = Color(0xFF1C1C1E),
                                          shape = RoundedCornerShape(16.dp),
                                          modifier = Modifier.padding(top = 4.dp)
                                      ) {
                                          Row(
                                              verticalAlignment = Alignment.CenterVertically,
                                              horizontalArrangement = Arrangement.spacedBy(6.dp),
                                              modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp)
                                          ) {
                                              listOf("👍", "❤️", "😂", "🔥", "😮", "👏").forEach { emoji ->
                                                  Text(
                                                      text = emoji,
                                                      fontSize = 18.sp,
                                                      modifier = Modifier
                                                          .clickable {
                                                              BgramHub.sendReaction(cid, m.id, emoji)
                                                              reactionTargetId = null
                                                          }
                                                          .padding(horizontal = 3.dp)
                                                  )
                                              }
                                              Text(
                                                  text = "Reply",
                                                  color = Color(0xFF007AFF),
                                                  fontWeight = FontWeight.Bold,
                                                  fontSize = 12.sp,
                                                  modifier = Modifier
                                                      .clickable {
                                                          replyingTo = m
                                                          reactionTargetId = null
                                                      }
                                                      .padding(start = 6.dp)
                                              )
                                          }
                                      }
                                  }

                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                                      modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp)
                                  ) {
                                      Text(
                                          text = "Reply",
                                          fontSize = 10.sp,
                                          color = Color(0xFF007AFF),
                                          modifier = Modifier.clickable { replyingTo = m }
                                      )
                                      Text(
                                          text = "React",
                                          fontSize = 10.sp,
                                          color = Color.Gray,
                                          modifier = Modifier.clickable {
                                              reactionTargetId = if (reactionTargetId == m.id) null else m.id
                                          }
                                      )
                                      if (m.mine) {
                                          val receiptText = when {
                                              m.readByPeer -> "Read ✓✓"
                                              m.ack -> "Delivered ✓"
                                              else -> "Sent"
                                          }
                                          Text(
                                              text = receiptText,
                                              fontSize = 10.sp,
                                              fontWeight = if (m.readByPeer) FontWeight.Bold else FontWeight.Normal,
                                              color = if (m.readByPeer) Color(0xFF007AFF) else Color.Gray
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      if (replyingTo != null) {
                          val r = replyingTo!!
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(Color(0xFF1C1C1E))
                                  .padding(horizontal = 14.dp, vertical = 8.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = "Replying to ${r.senderName.ifBlank { r.senderId }}",
                                      color = Color(0xFF007AFF),
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 12.sp
                                  )
                                  val rSub = when {
                                      r.voiceB64.isNotBlank() -> "Voice Note (${r.voiceSec}s)"
                                      r.imageB64.isNotBlank() -> "Photo"
                                      else -> r.text
                                  }
                                  Text(
                                      text = rSub,
                                      color = Color.LightGray,
                                      fontSize = 12.sp,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }
                              IconButton(onClick = { replyingTo = null }, modifier = Modifier.size(28.dp)) {
                                  Icon(Icons.Default.Close, contentDescription = "Cancel Reply", tint = Color.Gray)
                              }
                          }
                      }

                      Surface(
                          color = Color(0xFF161618),
                          modifier = Modifier
                              .fillMaxWidth()
                              .navigationBarsPadding()
                              .imePadding()
                      ) {
                          if (isRecording) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 12.dp, vertical = 12.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(10.dp)
                              ) {
                                  IconButton(
                                      onClick = {
                                          MediaHelper.cancelRecording()
                                          stagedVoice = null
                                      },
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFF2C2C2E))
                                  ) {
                                      Icon(Icons.Default.Delete, contentDescription = "Discard Recording", tint = Color(0xFFFF453A))
                                  }

                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                                      modifier = Modifier
                                          .weight(1f)
                                          .clip(RoundedCornerShape(20.dp))
                                          .background(Color(0xFF26252A))
                                          .padding(horizontal = 12.dp, vertical = 8.dp)
                                  ) {
                                      Box(
                                          modifier = Modifier
                                              .size(10.dp)
                                              .clip(CircleShape)
                                              .background(Color(0xFFFF3B30))
                                      )
                                      Text(
                                          text = String.format(Locale.US, "%d:%02d", recSec / 60, recSec % 60),
                                          color = Color.White,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.Bold,
                                          fontFamily = FontFamily.Monospace
                                      )
                                      VoiceWaveformBar(
                                          bars = liveAmps,
                                          progress = 1f,
                                          activeColor = Color(0xFF007AFF),
                                          inactiveColor = Color(0x55FFFFFF),
                                          modifier = Modifier.weight(1f)
                                      )
                                  }

                                  IconButton(
                                      onClick = {
                                          stagedVoice = MediaHelper.stopRecording()
                                      },
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFF2C2C2E))
                                  ) {
                                      Icon(Icons.Default.Stop, contentDescription = "Stop to Review", tint = Color.White)
                                  }

                                  IconButton(
                                      onClick = {
                                          val clip = MediaHelper.stopRecording()
                                          if (clip != null) {
                                              BgramHub.sendChat(
                                                  cid = cid,
                                                  text = "",
                                                  voiceB64 = clip.b64,
                                                  voiceSec = clip.sec,
                                                  waveformCsv = clip.waveformCsv,
                                                  replyTo = replyingTo
                                              )
                                              replyingTo = null
                                          }
                                      },
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFF007AFF))
                                  ) {
                                      Icon(Icons.Default.ArrowUpward, contentDescription = "Send Voice Note Directly", tint = Color.White)
                                  }
                              }
                          } else if (stagedVoice != null) {
                              val clip = stagedVoice!!
                              val previewId = "staged_preview_voice"
                              val isPreviewPlaying = (playingMsgId == previewId && isPlayingAudio)
                              val previewProg = if (playingMsgId == previewId) audioProgress else 0f
                              val previewBars = remember(clip.waveformCsv) { MediaHelper.parseWaveformBars(clip.waveformCsv) }

                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 12.dp, vertical = 12.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(10.dp)
                              ) {
                                  IconButton(
                                      onClick = { stagedVoice = null },
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFF2C2C2E))
                                  ) {
                                      Icon(Icons.Default.Delete, contentDescription = "Delete Staged Voice", tint = Color(0xFFFF453A))
                                  }

                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                                      modifier = Modifier
                                          .weight(1f)
                                          .clip(RoundedCornerShape(20.dp))
                                          .background(Color(0xFF26252A))
                                          .padding(horizontal = 10.dp, vertical = 6.dp)
                                  ) {
                                      IconButton(
                                          onClick = { MediaHelper.toggleVoicePlayback(ctx, previewId, clip.b64) },
                                          modifier = Modifier
                                              .size(32.dp)
                                              .clip(CircleShape)
                                              .background(Color(0xFF007AFF))
                                      ) {
                                          Icon(
                                              imageVector = if (isPreviewPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                              contentDescription = "Preview Voice",
                                              tint = Color.White,
                                              modifier = Modifier.size(18.dp)
                                          )
                                      }
                                      VoiceWaveformBar(
                                          bars = previewBars,
                                          progress = previewProg,
                                          activeColor = Color(0xFF007AFF),
                                          inactiveColor = Color(0x55FFFFFF),
                                          onSeek = { frac ->
                                              if (playingMsgId != previewId) {
                                                  MediaHelper.toggleVoicePlayback(ctx, previewId, clip.b64)
                                              }
                                              MediaHelper.seekVoice(previewId, frac)
                                          },
                                          modifier = Modifier.weight(1f)
                                      )
                                      Text(
                                          text = "${clip.sec}s",
                                          color = Color.LightGray,
                                          fontSize = 11.sp,
                                          fontFamily = FontFamily.Monospace
                                      )
                                  }

                                  IconButton(
                                      onClick = {
                                          BgramHub.sendChat(
                                              cid = cid,
                                              text = "",
                                              voiceB64 = clip.b64,
                                              voiceSec = clip.sec,
                                              waveformCsv = clip.waveformCsv,
                                              replyTo = replyingTo
                                          )
                                          stagedVoice = null
                                          replyingTo = null
                                      },
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFF007AFF))
                                  ) {
                                      Icon(Icons.Default.ArrowUpward, contentDescription = "Send Reviewed Voice Note", tint = Color.White)
                                  }
                              }
                          } else {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(horizontal = 12.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(10.dp)
                              ) {
                                  IconButton(
                                      onClick = { imagePicker.launch("image/*") },
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFF2C2C2E))
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.Image,
                                          contentDescription = "Send Photo",
                                          tint = Color(0xFF007AFF),
                                          modifier = Modifier.size(19.dp)
                                      )
                                  }

                                  IconButton(
                                      onClick = {
                                          MediaHelper.startRecording(ctx)
                                      },
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFF2C2C2E))
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.Mic,
                                          contentDescription = "Record Voice Note",
                                          tint = Color.White,
                                          modifier = Modifier.size(19.dp)
                                      )
                                  }

                                  OutlinedTextField(
                                      value = textIn,
                                      onValueChange = { textIn = it },
                                      placeholder = {
                                          Text(
                                              text = "ChatBlack",
                                              color = Color.Gray,
                                              fontSize = 14.sp
                                          )
                                      },
                                      singleLine = true,
                                      shape = RoundedCornerShape(24.dp),
                                      modifier = Modifier.weight(1f)
                                  )

                                  Box(
                                      modifier = Modifier
                                          .size(40.dp)
                                          .clip(CircleShape)
                                          .background(if (textIn.isNotBlank()) Color(0xFF007AFF) else Color(0xFF3A3A3C))
                                          .clickable(enabled = textIn.isNotBlank()) {
                                              BgramHub.sendChat(
                                                  cid = cid,
                                                  text = textIn.trim(),
                                                  replyTo = replyingTo
                                              )
                                              textIn = ""
                                              replyingTo = null
                                          },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Icon(Icons.Default.ArrowUpward, contentDescription = "Send", tint = Color.White, modifier = Modifier.size(19.dp))
                                  }
                              }
                          }
                      }
                  }
              }

              if (expandedBitmap != null) {
                  Dialog(
                      onDismissRequest = { expandedBitmap = null },
                      properties = DialogProperties(usePlatformDefaultWidth = false)
                  ) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color(0xF2000000))
                              .clickable { expandedBitmap = null },
                          contentAlignment = Alignment.Center
                      ) {
                          Image(
                              bitmap = expandedBitmap!!.asImageBitmap(),
                              contentDescription = "Expanded Photo",
                              contentScale = ContentScale.Fit,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .fillMaxHeight(0.88f)
                                  .padding(12.dp)
                          )
                          IconButton(
                              onClick = { expandedBitmap = null },
                              modifier = Modifier
                                  .align(Alignment.TopEnd)
                                  .statusBarsPadding()
                                  .padding(16.dp)
                                  .size(42.dp)
                                  .clip(CircleShape)
                                  .background(Color(0xFF2C2C2E))
                          ) {
                              Icon(Icons.Default.Close, contentDescription = "Close Full Photo", tint = Color.White)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile ChatBlack Debug APK
        run: |
          gradle assembleDebug --no-daemon > build.log 2>&1 || (grep "^e: " build.log | head -n 20 && exit 1)
          cp app/build/outputs/apk/debug/app-debug.apk ChatBlack-v1.0-release.apk

      - name: Upload ChatBlack APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatBlack-v1.0-release
          path: ChatBlack-v1.0-release.apk
          if-no-files-found: error
