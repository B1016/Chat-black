          // ============================================================================
          // 2. SELF-CONTAINED ISO/IEC 18004 QR CODE GENERATOR (Version 2-L, 25x25)
          // ============================================================================

          object QrCodeEncoder {
              fun encodeVersion2L(text: String): Array<BooleanArray> {
                  val data = text.toByteArray(Charsets.UTF_8).take(32)
                  val bits = mutableListOf(0, 1, 0, 0)
                  val n = data.size
                  for (i in 7 downTo 0) bits.add((n shr i) and 1)
                  for (b in data) {
                      val v = b.toInt() and 0xFF
                      for (i in 7 downTo 0) bits.add((v shr i) and 1)
                  }
                  val termCount = minOf(4, 34 * 8 - bits.size)
                  repeat(termCount) { bits.add(0) }
                  while (bits.size % 8 != 0) bits.add(0)

                  val codewords = mutableListOf<Int>()
                  for (i in bits.indices step 8) {
                      var cw = 0
                      for (j in 0 until 8) cw = (cw shl 1) or bits[i + j]
                      codewords.add(cw)
                  }
                  val pads = intArrayOf(0xEC, 0x11)
                  var pIdx = 0
                  while (codewords.size < 34) {
                      codewords.add(pads[pIdx % 2])
                      pIdx++
                  }

                  val exp = IntArray(512)
                  val log = IntArray(256)
                  var x = 1
                  for (i in 0 until 255) {
                      exp[i] = x
                      log[x] = i
                      x = x shl 1
                      if ((x and 0x100) != 0) x = x xor 0x11D
                  }
                  for (i in 255 until 512) exp[i] = exp[i - 255]

                  var gen = intArrayOf(1)
                  for (i in 0 until 10) {
                      val nxt = IntArray(gen.size + 1)
                      for (j in gen.indices) {
                          val c = gen[j]
                          nxt[j] = nxt[j] xor c
                          if (c != 0) nxt[j + 1] = nxt[j + 1] xor exp[log[c] + i]
                      }
                      gen = nxt
                  }

                  val ecc = IntArray(10)
                  for (cw in codewords) {
                      val factor = cw xor ecc[0]
                      for (k in 0 until 9) ecc[k] = ecc[k + 1]
                      ecc[9] = 0
                      if (factor != 0) {
                          for (j in 0 until 10) {
                              val g = gen[j + 1]
                              if (g != 0) ecc[j] = ecc[j] xor exp[log[factor] + log[g]]
                          }
                      }
                  }

                  val allCw = codewords + ecc.toList()
                  val size = 25
                  val mat = Array(size) { BooleanArray(size) }
                  val used = Array(size) { BooleanArray(size) }

                  fun setMod(r: Int, c: Int, v: Boolean) {
                      if (r in 0 until size && c in 0 until size) {
                          mat[r][c] = v
                          used[r][c] = true
                      }
                  }

                  fun placeFinder(r0: Int, c0: Int) {
                      for (dr in -1..7) {
                          for (dc in -1..7) {
                              val r = r0 + dr
                              val c = c0 + dc
                              if (r in 0 until size && c in 0 until size) {
                                  val outer = (dr in 0..6 && (dc == 0 || dc == 6)) || (dc in 0..6 && (dr == 0 || dr == 6))
                                  val inner = (dr in 2..4 && dc in 2..4)
                                  setMod(r, c, outer || inner)
                              }
                          }
                      }
                  }

                  placeFinder(0, 0)
                  placeFinder(0, size - 7)
                  placeFinder(size - 7, 0)

                  for (dr in -2..2) {
                      for (dc in -2..2) {
                          val v = (kotlin.math.abs(dr) == 2 || kotlin.math.abs(dc) == 2 || (dr == 0 && dc == 0))
                          setMod(18 + dr, 18 + dc, v)
                      }
                  }

                  for (i in 8 until size - 8) {
                      if (!used[6][i]) setMod(6, i, i % 2 == 0)
                      if (!used[i][6]) setMod(i, 6, i % 2 == 0)
                  }

                  setMod(size - 8, 8, true)
                  for (i in 0 until 9) {
                      if (!used[8][i]) used[8][i] = true
                      if (!used[i][8]) used[i][8] = true
                  }
                  for (i in 0 until 8) {
                      if (!used[8][size - 1 - i]) used[8][size - 1 - i] = true
                      if (!used[size - 1 - i][8]) used[size - 1 - i][8] = true
                  }

                  val dataBits = mutableListOf<Int>()
                  for (cw in allCw) {
                      for (i in 7 downTo 0) dataBits.add((cw shr i) and 1)
                  }
                  while (dataBits.size < 359) dataBits.add(0)

                  var bitIdx = 0
                  var up = true
                  var col = size - 1
                  while (col > 0) {
                      if (col == 6) col--
                      val rows = if (up) (size - 1 downTo 0) else (0 until size)
                      for (r in rows) {
                          for (dc in 0 downTo -1) {
                              val c = col + dc
                              if (!used[r][c]) {
                                  var b = if (bitIdx < dataBits.size) dataBits[bitIdx] else 0
                                  bitIdx++
                                  if ((r + c) % 2 == 0) b = b xor 1
                                  mat[r][c] = (b == 1)
                                  used[r][c] = true
                              }
                          }
                      }
                      up = !up
                      col -= 2
                  }

                  val fmt = 0x77C4
                  val fmtBits = BooleanArray(15) { i -> ((fmt shr i) and 1) == 1 }
                  val tl = arrayOf(
                      8 to 0, 8 to 1, 8 to 2, 8 to 3, 8 to 4, 8 to 5, 8 to 7, 8 to 8,
                      7 to 8, 5 to 8, 4 to 8, 3 to 8, 2 to 8, 1 to 8, 0 to 8
                  )
                  for (i in tl.indices) {
                      val (r, c) = tl[i]
                      mat[r][c] = fmtBits[14 - i]
                  }
                  for (i in 0 until 7) mat[size - 1 - i][8] = fmtBits[14 - i]
                  for (i in 0 until 8) mat[8][size - 8 + i] = fmtBits[14 - (7 + i)]

                  return mat
              }
          }

          // ============================================================================
          // 3. CORE LAN HUB, PRIVACY ENGINE & WEB CHATTING HOST SERVER
          // ============================================================================

          object BgramHub {
              private const val UDP_PORT = 45454
              private const val TCP_PORT = 45455
              const val HTTP_PORT = 8080
              private const val MCAST = "239.255.45.45"

              lateinit var prefs: SharedPreferences
              val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              val account = MutableStateFlow(UserAccount("", ""))
              val peers = MutableStateFlow<List<PeerNode>>(emptyList())
              val conversations = MutableStateFlow<List<ConversationMeta>>(emptyList())
              val messages = MutableStateFlow<List<ChatItem>>(emptyList())
              val activeConvId = MutableStateFlow<String?>(null)
              val currentTab = MutableStateFlow("INBOX")
              val localIp = MutableStateFlow("0.0.0.0")

              // Both Web Chatting and APK Server are off by default
              val webChatEnabled = MutableStateFlow(false)
              val apkServerEnabled = MutableStateFlow(false)
              val activeWebCount = MutableStateFlow(0)

              private val peerCache = ConcurrentHashMap<String, PeerNode>()
              private val directIpMap = ConcurrentHashMap<String, String>()
              private val webVaults = ConcurrentHashMap<String, WebUserVault>()
              private val activeWebSessions = ConcurrentHashMap<String, Long>()

              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null
              private var initialized = false

              fun init(ctx: Context) {
                  if (initialized) return
                  initialized = true
                  prefs = ctx.applicationContext.getSharedPreferences("bgram_store", Context.MODE_PRIVATE)
                  loadState(ctx.applicationContext)
                  startNetworking(ctx.applicationContext)
              }

              private fun resolveDeviceBoundId(ctx: Context): String {
                  val saved = prefs.getString("device_uid", null)
                  if (!saved.isNullOrBlank()) return saved
                  val androidId = try {
                      Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ANDROID_ID) ?: ""
                  } catch (e: Throwable) {
                      ""
                  }
                  val clean = androidId.filter { it.isLetterOrDigit() }.lowercase()
                  val bound = if (clean.length >= 6) {
                      "bg_" + clean.takeLast(6)
                  } else {
                      "bg_" + Random.nextInt(100000, 999999)
                  }
                  prefs.edit().putString("device_uid", bound).apply()
                  return bound
              }

              private fun loadState(ctx: Context) {
                  try {
                      val uid = resolveDeviceBoundId(ctx)
                      account.value = UserAccount(
                          uid = uid,
                          displayName = prefs.getString("name", "") ?: "",
                          avatarB64 = prefs.getString("avatar", "") ?: "",
                          isPrivate = prefs.getBoolean("is_private", false),
                          loggedIn = prefs.getBoolean("logged_in", false)
                      )
                      // Web chatting is off by default unless turned on
                      webChatEnabled.value = prefs.getBoolean("web_chat_enabled", false)
                      apkServerEnabled.value = prefs.getBoolean("apk_server_enabled", false)

                      val convArr = JSONArray(prefs.getString("convs", "[]") ?: "[]")
                      val convList = mutableListOf<ConversationMeta>()
                      val msgList = mutableListOf<ChatItem>()
                      for (i in 0 until convArr.length()) {
                          val o = convArr.getJSONObject(i)
                          val cid = o.getString("convId")
                          val pIp = o.optString("peerIp", "")
                          if (pIp.isNotBlank()) directIpMap[cid.lowercase()] = pIp
                          convList.add(
                              ConversationMeta(
                                  convId = cid,
                                  title = o.optString("title", cid),
                                  isGroup = o.optBoolean("isGroup", false),
                                  membersCsv = o.optString("membersCsv", ""),
                                  peerIp = pIp,
                                  avatarB64 = o.optString("avatarB64", ""),
                                  snippet = o.optString("snippet", ""),
                                  updatedAt = o.optLong("updatedAt", 0L),
                                  unread = o.optInt("unread", 0)
                              )
                          )
                          msgList.addAll(loadConvMessages("msg_$cid").map { it.copy(convId = cid) })
                      }
                      conversations.value = convList.sortedByDescending { it.updatedAt }
                      messages.value = msgList
                      loadWebVaults()
                  } catch (e: Throwable) {}
              }

              fun setWebChatEnabled(ctx: Context, enabled: Boolean) {
                  webChatEnabled.value = enabled
                  prefs.edit().putBoolean("web_chat_enabled", enabled).apply()
                  updateKeepAliveLocks(ctx.applicationContext)
              }

              fun setApkServerEnabled(enabled: Boolean) {
                  apkServerEnabled.value = enabled
                  prefs.edit().putBoolean("apk_server_enabled", enabled).apply()
              }

              fun setProfilePrivacy(isPrivate: Boolean) {
                  val updated = account.value.copy(isPrivate = isPrivate)
                  account.value = updated
                  prefs.edit().putBoolean("is_private", isPrivate).apply()
                  if (isPrivate) {
                      scope.launch {
                          val ip = localIp.value
                          if (ip != "0.0.0.0") {
                              val pkt = JSONObject().apply {
                                  put("pktType", "HIDE")
                                  put("uid", updated.uid.lowercase())
                              }
                              resolveDiscoveryTargets(ip).forEach { addr ->
                                  sendRawUdpJson(addr, pkt)
                              }
                          }
                      }
                  }
              }

              private fun updateKeepAliveLocks(ctx: Context) {
                  try {
                      val shouldHold = webChatEnabled.value || activeWebCount.value > 0
                      if (shouldHold) {
                          if (wakeLock == null) {
                              val pm = ctx.getSystemService(Context.POWER_SERVICE) as? PowerManager
                              wakeLock = pm?.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ChatBlack::WebHostWakeLock")?.apply {
                                  setReferenceCounted(false)
                              }
                          }
                          if (wakeLock?.isHeld == false) {
                              wakeLock?.acquire()
                          }
                          if (wifiLock == null) {
                              val wm = ctx.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                              wifiLock = wm?.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "ChatBlack::WebHostWifiLock")?.apply {
                                  setReferenceCounted(false)
                              }
                          }
                          if (wifiLock?.isHeld == false) {
                              wifiLock?.acquire()
                          }
                      } else {
                          if (wakeLock?.isHeld == true) wakeLock?.release()
                          if (wifiLock?.isHeld == true) wifiLock?.release()
                      }
                  } catch (e: Throwable) {}
              }

              private fun loadConvMessages(storageKey: String): List<ChatItem> {
                  return try {
                      val arr = JSONArray(prefs.getString(storageKey, "[]") ?: "[]")
                      val list = mutableListOf<ChatItem>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(parseChatItemJson(o))
                      }
                      list.takeLast(50)
                  } catch (e: Throwable) {
                      emptyList()
                  }
              }

              private fun parseChatItemJson(o: JSONObject): ChatItem {
                  return ChatItem(
                      id = o.optString("id", UUID.randomUUID().toString()),
                      convId = o.optString("convId", ""),
                      senderId = o.optString("senderId", ""),
                      senderName = o.optString("senderName", ""),
                      text = o.optString("text", ""),
                      imageB64 = o.optString("imageB64", ""),
                      voiceB64 = o.optString("voiceB64", ""),
                      voiceSec = o.optInt("voiceSec", 0),
                      waveformCsv = o.optString("waveformCsv", ""),
                      replyToId = o.optString("replyToId", ""),
                      replyToSender = o.optString("replyToSender", ""),
                      replyToText = o.optString("replyToText", ""),
                      reactionsCsv = o.optString("reactionsCsv", ""),
                      ts = o.optLong("ts", System.currentTimeMillis()),
                      mine = o.optBoolean("mine", false),
                      ack = o.optBoolean("ack", true),
                      readByPeer = o.optBoolean("readByPeer", false)
                  )
              }

              private fun chatItemToJson(m: ChatItem): JSONObject {
                  return JSONObject().apply {
                      put("id", m.id)
                      put("convId", m.convId)
                      put("senderId", m.senderId)
                      put("senderName", m.senderName)
                      put("text", m.text)
                      put("imageB64", m.imageB64)
                      put("voiceB64", m.voiceB64)
                      put("voiceSec", m.voiceSec)
                      put("waveformCsv", m.waveformCsv)
                      put("replyToId", m.replyToId)
                      put("replyToSender", m.replyToSender)
                      put("replyToText", m.replyToText)
                      put("reactionsCsv", m.reactionsCsv)
                      put("ts", m.ts)
                      put("mine", m.mine)
                      put("ack", m.ack)
                      put("readByPeer", m.readByPeer)
                  }
              }

              private fun persistConvs() {
                  try {
                      val arr = JSONArray()
                      conversations.value.forEach { c ->
                          arr.put(JSONObject().apply {
                              put("convId", c.convId)
                              put("title", c.title)
                              put("isGroup", c.isGroup)
                              put("membersCsv", c.membersCsv)
                              put("peerIp", c.peerIp)
                              put("avatarB64", c.avatarB64)
                              put("snippet", c.snippet)
                              put("updatedAt", c.updatedAt)
                              put("unread", c.unread)
                          })
                      }
                      prefs.edit().putString("convs", arr.toString()).apply()
                  } catch (e: Throwable) {}
              }

              private fun persistMessages(storageKey: String, list: List<ChatItem>) {
                  try {
                      val arr = JSONArray()
                      list.takeLast(50).forEach { m ->
                          arr.put(chatItemToJson(m))
                      }
                      prefs.edit().putString(storageKey, arr.toString()).apply()
                  } catch (e: Throwable) {}
              }

              private fun persistWebVaults() {
                  try {
                      val root = JSONArray()
                      webVaults.values.forEach { v ->
                          root.put(vaultToJson(v))
                      }
                      prefs.edit().putString("web_vaults_json", root.toString()).apply()
                  } catch (e: Throwable) {}
              }

              private fun loadWebVaults() {
                  try {
                      val arr = JSONArray(prefs.getString("web_vaults_json", "[]") ?: "[]")
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          mergeVaultJsonIntoMemory(o, broadcastToLan = false)
                      }
                  } catch (e: Throwable) {}
              }

              private fun vaultToJson(v: WebUserVault): JSONObject {
                  val cArr = JSONArray()
                  synchronized(v.conversations) {
                      v.conversations.forEach { c ->
                          cArr.put(JSONObject().apply {
                              put("convId", c.convId)
                              put("title", c.title)
                              put("isGroup", c.isGroup)
                              put("membersCsv", c.membersCsv)
                              put("peerIp", c.peerIp)
                              put("avatarB64", c.avatarB64)
                              put("snippet", c.snippet)
                              put("updatedAt", c.updatedAt)
                              put("unread", c.unread)
                          })
                      }
                  }
                  val msgObj = JSONObject()
                  synchronized(v.messages) {
                      val grouped = v.messages.groupBy { it.convId }
                      for ((cid, list) in grouped) {
                          val mArr = JSONArray()
                          list.takeLast(50).forEach { mArr.put(chatItemToJson(it)) }
                          msgObj.put(cid, mArr)
                      }
                  }
                  return JSONObject().apply {
                      put("profile", JSONObject().apply {
                          put("uid", v.uid)
                          put("displayName", v.displayName)
                          put("avatarB64", v.avatarB64)
                          put("isPrivate", v.isPrivate)
                      })
                      put("conversations", cArr)
                      put("messages", msgObj)
                      put("updatedAt", v.updatedAt)
                  }
              }

              private fun mergeVaultJsonIntoMemory(j: JSONObject, broadcastToLan: Boolean): WebUserVault? {
                  return try {
                      val prof = j.optJSONObject("profile") ?: return null
                      val uid = prof.optString("uid", "").trim().removePrefix("@").lowercase()
                      if (uid.isBlank()) return null
                      val vault = webVaults.getOrPut(uid) {
                          WebUserVault(
                              uid = uid,
                              displayName = prof.optString("displayName", uid),
                              avatarB64 = prof.optString("avatarB64", ""),
                              isPrivate = prof.optBoolean("isPrivate", false)
                          )
                      }
                      val name = prof.optString("displayName", "")
                      if (name.isNotBlank()) vault.displayName = name
                      val av = prof.optString("avatarB64", "")
                      if (av.isNotBlank()) vault.avatarB64 = av
                      vault.isPrivate = prof.optBoolean("isPrivate", vault.isPrivate)
                      vault.updatedAt = System.currentTimeMillis()

                      val cArr = j.optJSONArray("conversations")
                      if (cArr != null) {
                          synchronized(vault.conversations) {
                              for (i in 0 until cArr.length()) {
                                  val co = cArr.getJSONObject(i)
                                  val cid = co.optString("convId", "")
                                  if (cid.isBlank()) continue
                                  val meta = ConversationMeta(
                                      convId = cid,
                                      title = co.optString("title", cid),
                                      isGroup = co.optBoolean("isGroup", false),
                                      membersCsv = co.optString("membersCsv", ""),
                                      peerIp = co.optString("peerIp", ""),
                                      avatarB64 = co.optString("avatarB64", ""),
                                      snippet = co.optString("snippet", ""),
                                      updatedAt = co.optLong("updatedAt", 0L),
                                      unread = co.optInt("unread", 0)
                                  )
                                  val idx = vault.conversations.indexOfFirst { it.convId == cid }
                                  if (idx == -1) vault.conversations.add(meta)
                                  else if (meta.updatedAt >= vault.conversations[idx].updatedAt) {
                                      vault.conversations[idx] = meta
                                  }
                              }
                          }
                      }

                      val msgObj = j.optJSONObject("messages")
                      if (msgObj != null) {
                          synchronized(vault.messages) {
                              val keys = msgObj.keys()
                              while (keys.hasNext()) {
                                  val cid = keys.next()
                                  val mArr = msgObj.optJSONArray(cid) ?: continue
                                  for (k in 0 until mArr.length()) {
                                      val mo = mArr.getJSONObject(k)
                                      val item = parseChatItemJson(mo).copy(convId = cid)
                                      val existingIdx = vault.messages.indexOfFirst { it.id == item.id && it.convId == cid }
                                      if (existingIdx == -1) {
                                          vault.messages.add(item)
                                      } else {
                                          val cur = vault.messages[existingIdx]
                                          vault.messages[existingIdx] = cur.copy(
                                              reactionsCsv = item.reactionsCsv.ifBlank { cur.reactionsCsv },
                                              ack = cur.ack || item.ack,
                                              readByPeer = cur.readByPeer || item.readByPeer
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      val myIp = localIp.value
                      if (!vault.isPrivate && vault.displayName.isNotBlank() && myIp != "0.0.0.0") {
                          peerCache[uid] = PeerNode(uid, "${vault.displayName} (Web)", myIp, vault.avatarB64, webHost = false)
                          peers.value = peerCache.values.sortedBy { it.name.lowercase() }
                      } else if (vault.isPrivate) {
                          peerCache.remove(uid)
                          peers.value = peerCache.values.sortedBy { it.name.lowercase() }
                      }

                      persistWebVaults()
                      if (broadcastToLan) {
                          replicateVaultToLanPeers(vault)
                      }
                      vault
                  } catch (e: Throwable) {
                      null
                  }
              }

              private fun replicateVaultToLanPeers(vault: WebUserVault) {
                  scope.launch {
                      val pkt = JSONObject().apply {
                          put("pktType", "WEB_VAULT_SYNC")
                          put("vault", vaultToJson(vault))
                      }
                      val myIp = localIp.value
                      peerCache.values.map { it.ip }.distinct().filter { it.isNotBlank() && it != myIp }.forEach { ip ->
                          transmitRawJson(ip, pkt)
                      }
                  }
              }

              fun login(name: String, avatarB64: String, isPrivate: Boolean = account.value.isPrivate) {
                  val updated = account.value.copy(
                      displayName = name.trim(),
                      avatarB64 = avatarB64,
                      isPrivate = isPrivate,
                      loggedIn = true
                  )
                  account.value = updated
                  prefs.edit()
                      .putString("name", updated.displayName)
                      .putString("avatar", updated.avatarB64)
                      .putBoolean("is_private", updated.isPrivate)
                      .putBoolean("logged_in", true)
                      .apply()
              }

              fun logout() {
                  activeConvId.value = null
                  currentTab.value = "INBOX"
                  val updated = account.value.copy(loggedIn = false)
                  account.value = updated
                  prefs.edit().putBoolean("logged_in", false).apply()
              }

              fun connectByIdOrIp(uidInput: String, ipInput: String) {
                  val rawUid = uidInput.trim().removePrefix("@").lowercase()
                  val rawIp = ipInput.trim()
                  val looksLikeIp = rawUid.matches(Regex("^\\d+\\.\\d+\\.\\d+\\.\\d+$"))
                  val targetIp = if (rawIp.isNotBlank()) rawIp else if (looksLikeIp) rawUid else ""
                  val explicitUid = if (looksLikeIp) "" else rawUid

                  if (targetIp.isNotBlank() && explicitUid.isBlank()) {
                      scope.launch {
                          val who = queryWhoisByIp(targetIp)
                          if (who != null) {
                              val pUid = who.optString("uid", "").lowercase()
                              val pName = who.optString("name", pUid)
                              val pAv = who.optString("avatar", "")
                              if (pUid.isNotBlank()) {
                                  directIpMap[pUid] = targetIp
                                  openOrCreateDirect(pUid, pName, targetIp, pAv)
                                  return@launch
                              }
                          }
                          val fallbackId = "ip_" + targetIp.replace(".", "_")
                          directIpMap[fallbackId] = targetIp
                          openOrCreateDirect(fallbackId, targetIp, targetIp, "")
                      }
                  } else if (explicitUid.isNotBlank()) {
                      if (targetIp.isNotBlank()) directIpMap[explicitUid] = targetIp
                      openOrCreateDirect(explicitUid, null, targetIp.ifBlank { null }, null)
                  }
              }

              private fun queryWhoisByIp(ip: String): JSONObject? {
                  return try {
                      Socket().use { s ->
                          s.connect(InetSocketAddress(ip, TCP_PORT), 3500)
                          s.soTimeout = 4000
                          val out = PrintWriter(OutputStreamWriter(s.getOutputStream(), Charsets.UTF_8), true)
                          val inp = BufferedReader(InputStreamReader(s.getInputStream(), Charsets.UTF_8))
                          out.println(JSONObject().apply { put("pktType", "WHOIS") }.toString())
                          val line = inp.readLine() ?: return null
                          JSONObject(line)
                      }
                  } catch (e: Throwable) {
                      null
                  }
              }

              fun openOrCreateDirect(peerUid: String, nameHint: String?, ipHint: String?, avatarHint: String? = null) {
                  val id = peerUid.trim().removePrefix("@").lowercase()
                  if (id.isBlank()) return
                  val known = peerCache[id]
                  val resolvedIp = ipHint ?: known?.ip ?: directIpMap[id] ?: ""
                  if (resolvedIp.isNotBlank()) directIpMap[id] = resolvedIp
                  val cur = conversations.value.toMutableList()
                  val idx = cur.indexOfFirst { it.convId == id }
                  if (idx == -1) {
                      cur.add(0, ConversationMeta(
                          convId = id,
                          title = nameHint ?: known?.name ?: id,
                          isGroup = false,
                          membersCsv = id,
                          peerIp = resolvedIp,
                          avatarB64 = avatarHint ?: known?.avatarB64 ?: ""
                      ))
                  } else {
                      val existing = cur[idx]
                      cur[idx] = existing.copy(
                          unread = 0,
                          peerIp = resolvedIp.ifBlank { existing.peerIp },
                          title = if (existing.title == existing.convId && !nameHint.isNullOrBlank()) nameHint else existing.title
                      )
                  }
                  conversations.value = cur
                  persistConvs()
                  activeConvId.value = id
                  markConversationReadAndNotify(id)
              }

              fun createGroup(title: String, memberIds: List<String>) {
                  val cleanMembers = (memberIds.map { it.trim().removePrefix("@").lowercase() } + account.value.uid.lowercase())
                      .filter { it.isNotBlank() }.distinct()
                  val gid = "grp_" + Random.nextInt(10000, 99999)
                  val meta = ConversationMeta(
                      convId = gid,
                      title = title.trim().ifBlank { "Group Chat" },
                      isGroup = true,
                      membersCsv = cleanMembers.joinToString(",")
                  )
                  conversations.value = listOf(meta) + conversations.value
                  persistConvs()
                  activeConvId.value = gid
              }

              private fun resolveConversationTargetIps(conv: ConversationMeta, senderUid: String): List<String> {
                  val cleanSender = senderUid.lowercase()
                  return if (conv.isGroup) {
                      conv.membersCsv.split(",").map { it.trim().lowercase() }
                          .filter { it != cleanSender }
                          .mapNotNull { peerCache[it]?.ip ?: directIpMap[it] }
                          .distinct()
                  } else {
                      val id = conv.convId.lowercase()
                      listOfNotNull(peerCache[id]?.ip ?: directIpMap[id] ?: conv.peerIp.takeIf { it.isNotBlank() }).distinct()
                  }
              }

              fun sendChat(
                  cid: String,
                  text: String,
                  imageB64: String = "",
                  voiceB64: String = "",
                  voiceSec: Int = 0,
                  waveformCsv: String = "",
                  replyTo: ChatItem? = null
              ) {
                  val conv = conversations.value.firstOrNull { it.convId == cid } ?: return
                  val me = account.value
                  val rPreview = when {
                      replyTo == null -> ""
                      replyTo.voiceB64.isNotBlank() -> "Voice Note (${replyTo.voiceSec}s)"
                      replyTo.imageB64.isNotBlank() -> "Photo"
                      else -> replyTo.text.take(60)
                  }
                  val msg = ChatItem(
                      convId = cid,
                      senderId = me.uid,
                      senderName = me.displayName,
                      text = text,
                      imageB64 = imageB64,
                      voiceB64 = voiceB64,
                      voiceSec = voiceSec,
                      waveformCsv = waveformCsv,
                      replyToId = replyTo?.id ?: "",
                      replyToSender = replyTo?.senderName ?: "",
                      replyToText = rPreview,
                      mine = true,
                      ack = false,
                      readByPeer = false
                  )
                  appendMessage(cid, msg, isIncoming = false)

                  scope.launch {
                      var anyAck = false
                      // Deliver to any hosted Web Users first
                      if (deliverToLocalWebVaults(conv, msg, me.uid, me.displayName, me.avatarB64)) {
                          anyAck = true
                      }
                      val myIp = localIp.value
                      val targets = resolveConversationTargetIps(conv, me.uid).filter { it != myIp }
                      targets.forEach { ip ->
                          val ok = transmitChatPacket(ip, conv, msg, me.uid, me.displayName, me.avatarB64)
                          if (ok) anyAck = true
                      }
                      if (anyAck) markAck(cid, msg.id)
                  }
              }

              private fun deliverToLocalWebVaults(
                  conv: ConversationMeta,
                  msg: ChatItem,
                  senderId: String,
                  senderName: String,
                  senderAvatar: String
              ): Boolean {
                  var delivered = false
                  val targetWebUids = if (conv.isGroup) {
                      conv.membersCsv.split(",").map { it.trim().lowercase() }.filter { it != senderId.lowercase() && webVaults.containsKey(it) }
                  } else {
                      listOf(conv.convId.lowercase()).filter { webVaults.containsKey(it) }
                  }
                  targetWebUids.forEach { wUid ->
                      val vault = webVaults[wUid] ?: return@forEach
                      val vConvId = if (conv.isGroup) conv.convId else senderId.lowercase()
                      val vTitle = if (conv.isGroup) conv.title else senderName
                      val incoming = msg.copy(
                          convId = vConvId,
                          mine = false,
                          ack = true,
                          readByPeer = false
                      )
                      appendToWebVault(vault, vConvId, vTitle, conv.isGroup, conv.membersCsv, senderAvatar, incoming, isIncoming = true)
                      delivered = true
                  }
                  if (delivered) persistWebVaults()
                  return delivered
              }

              private fun appendToWebVault(
                  vault: WebUserVault,
                  cid: String,
                  title: String,
                  isGroup: Boolean,
                  membersCsv: String,
                  avatarB64: String,
                  item: ChatItem,
                  isIncoming: Boolean
              ) {
                  val preview = when {
                      item.voiceB64.isNotBlank() -> "Voice message (${item.voiceSec}s)"
                      item.imageB64.isNotBlank() -> if (item.text.isNotBlank()) "Photo: ${item.text}" else "Sent a photo"
                      else -> item.text
                  }
                  synchronized(vault.conversations) {
                      val idx = vault.conversations.indexOfFirst { it.convId == cid }
                      if (idx == -1) {
                          vault.conversations.add(0, ConversationMeta(
                              convId = cid,
                              title = title.ifBlank { cid },
                              isGroup = isGroup,
                              membersCsv = membersCsv.ifBlank { cid },
                              peerIp = localIp.value,
                              avatarB64 = avatarB64,
                              snippet = preview,
                              updatedAt = item.ts,
                              unread = if (isIncoming) 1 else 0
                          ))
                      } else {
                          val c = vault.conversations[idx]
                          vault.conversations[idx] = c.copy(
                              title = if (c.title == c.convId && title.isNotBlank()) title else c.title,
                              snippet = preview,
                              updatedAt = item.ts,
                              unread = if (isIncoming) c.unread + 1 else c.unread
                          )
                      }
                  }
                  synchronized(vault.messages) {
                      if (vault.messages.none { it.convId == cid && it.id == item.id }) {
                          vault.messages.add(item.copy(convId = cid))
                      }
                  }
                  vault.updatedAt = System.currentTimeMillis()
              }

              fun sendReaction(cid: String, targetMsgId: String, emoji: String) {
                  val conv = conversations.value.firstOrNull { it.convId == cid } ?: return
                  val me = account.value
                  applyReactionLocal(cid, targetMsgId, me.displayName.ifBlank { me.uid }, emoji)

                  scope.launch {
                      val targetConvIdForPeer = if (conv.isGroup) conv.convId else me.uid.lowercase()
                      // Apply to local web vaults if applicable
                      webVaults.values.forEach { v ->
                          applyReactionInVault(v, targetConvIdForPeer, targetMsgId, me.displayName.ifBlank { me.uid }, emoji)
                      }
                      persistWebVaults()

                      val pkt = JSONObject().apply {
                          put("pktType", "REACTION")
                          put("convId", targetConvIdForPeer)
                          put("targetUid", conv.convId.lowercase())
                          put("isGroup", conv.isGroup)
                          put("senderId", me.uid)
                          put("senderName", me.displayName)
                          put("targetMsgId", targetMsgId)
                          put("emoji", emoji)
                      }
                      resolveConversationTargetIps(conv, me.uid).forEach { ip ->
                          transmitRawJson(ip, pkt)
                      }
                  }
              }

              private fun applyReactionInVault(vault: WebUserVault, cid: String, targetMsgId: String, actor: String, emoji: String) {
                  val entry = "$emoji $actor"
                  synchronized(vault.messages) {
                      for (i in vault.messages.indices) {
                          val m = vault.messages[i]
                          if (m.convId == cid && m.id == targetMsgId) {
                              val existing = m.reactionsCsv.split("|").filter { it.isNotBlank() }.toMutableList()
                              if (existing.contains(entry)) existing.remove(entry) else existing.add(entry)
                              vault.messages[i] = m.copy(reactionsCsv = existing.joinToString("|"))
                          }
                      }
                  }
              }

              fun markConversationReadAndNotify(cid: String) {
                  val conv = conversations.value.firstOrNull { it.convId == cid } ?: return
                  val updatedConvs = conversations.value.map {
                      if (it.convId == cid && it.unread > 0) it.copy(unread = 0) else it
                  }
                  if (updatedConvs != conversations.value) {
                      conversations.value = updatedConvs
                      persistConvs()
                  }
                  val me = account.value
                  scope.launch {
                      val peerCid = if (conv.isGroup) conv.convId else me.uid.lowercase()
                      webVaults[conv.convId.lowercase()]?.let { v ->
                          synchronized(v.messages) {
                              for (i in v.messages.indices) {
                                  val m = v.messages[i]
                                  if (m.convId == peerCid && m.mine) {
                                      v.messages[i] = m.copy(ack = true, readByPeer = true)
                                  }
                              }
                          }
                          persistWebVaults()
                      }
                      val pkt = JSONObject().apply {
                          put("pktType", "READ")
                          put("convId", peerCid)
                          put("targetUid", conv.convId.lowercase())
                          put("isGroup", conv.isGroup)
                          put("senderId", me.uid)
                      }
                      resolveConversationTargetIps(conv, me.uid).forEach { ip ->
                          transmitRawJson(ip, pkt)
                      }
                  }
              }

              private fun applyReactionLocal(cid: String, targetMsgId: String, actor: String, emoji: String) {
                  val entry = "$emoji $actor"
                  val nextAll = messages.value.map { m ->
                      if (m.convId == cid && m.id == targetMsgId) {
                          val existing = m.reactionsCsv.split("|").filter { it.isNotBlank() }.toMutableList()
                          if (existing.contains(entry)) existing.remove(entry) else existing.add(entry)
                          m.copy(reactionsCsv = existing.joinToString("|"))
                      } else m
                  }
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })
              }

              private fun markPeerReadLocal(cid: String) {
                  val nextAll = messages.value.map { m ->
                      if (m.convId == cid && m.mine && !m.readByPeer) {
                          m.copy(ack = true, readByPeer = true)
                      } else m
                  }
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })
              }

              private fun appendMessage(cid: String, item: ChatItem, isIncoming: Boolean) {
                  val curAll = messages.value
                  if (curAll.any { it.convId == cid && it.id == item.id }) return
                  val nextAll = curAll + item.copy(convId = cid)
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })

                  val preview = when {
                      item.voiceB64.isNotBlank() -> "Voice message (${item.voiceSec}s)"
                      item.imageB64.isNotBlank() -> if (item.text.isNotBlank()) "Photo: ${item.text}" else "Sent a photo"
                      else -> item.text
                  }
                  val isOpen = activeConvId.value == cid
                  val updatedConvs = conversations.value.map { c ->
                      if (c.convId == cid) {
                          c.copy(
                              snippet = preview,
                              updatedAt = item.ts,
                              unread = if (isIncoming && !isOpen) c.unread + 1 else 0
                          )
                      } else c
                  }.sortedByDescending { it.updatedAt }
                  conversations.value = updatedConvs
                  persistConvs()
              }

              private fun markAck(cid: String, msgId: String) {
                  val nextAll = messages.value.map {
                      if (it.convId == cid && it.id == msgId) it.copy(ack = true) else it
                  }
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })
              }

              private fun transmitChatPacket(
                  ip: String,
                  conv: ConversationMeta,
                  item: ChatItem,
                  senderId: String,
                  senderName: String,
                  senderAvatar: String
              ): Boolean {
                  val pkt = JSONObject().apply {
                      put("pktType", "CHAT")
                      put("id", item.id)
                      put("convId", if (conv.isGroup) conv.convId else senderId.lowercase())
                      put("targetUid", conv.convId.lowercase())
                      put("convTitle", if (conv.isGroup) conv.title else senderName)
                      put("isGroup", conv.isGroup)
                      put("membersCsv", conv.membersCsv)
                      put("senderId", senderId)
                      put("senderName", senderName)
                      put("senderAvatar", senderAvatar)
                      put("text", item.text)
                      put("imageB64", item.imageB64)
                      put("voiceB64", item.voiceB64)
                      put("voiceSec", item.voiceSec)
                      put("waveformCsv", item.waveformCsv)
                      put("replyToId", item.replyToId)
                      put("replyToSender", item.replyToSender)
                      put("replyToText", item.replyToText)
                      put("reactionsCsv", item.reactionsCsv)
                      put("ts", item.ts)
                  }
                  return transmitRawJson(ip, pkt)
              }

              private fun transmitRawJson(ip: String, pkt: JSONObject): Boolean {
                  return try {
                      Socket().use { s ->
                          s.connect(InetSocketAddress(ip, TCP_PORT), 4000)
                          s.soTimeout = 5000
                          val out = PrintWriter(OutputStreamWriter(s.getOutputStream(), Charsets.UTF_8), true)
                          val inp = BufferedReader(InputStreamReader(s.getInputStream(), Charsets.UTF_8))
                          out.println(pkt.toString())
                          inp.readLine() == "ACK"
                      }
                  } catch (e: Throwable) {
                      false
                  }
              }

              private fun sendRawUdpJson(targetAddr: InetAddress, obj: JSONObject) {
                  try {
                      val data = obj.toString().toByteArray(Charsets.UTF_8)
                      DatagramSocket().use { ds ->
                          ds.broadcast = true
                          ds.send(DatagramPacket(data, data.size, targetAddr, UDP_PORT))
                      }
                  } catch (e: Throwable) {}
              }

              private fun sendDiscoveryBeacon(targetAddr: InetAddress, myIp: String) {
                  val me = account.value
                  // If Private, do NOT broadcast personal identity on UDP discovery
                  if (!me.isPrivate && me.loggedIn) {
                      sendRawUdpJson(targetAddr, JSONObject().apply {
                          put("pktType", "BEACON")
                          put("uid", me.uid.lowercase())
                          put("name", me.displayName)
                          put("ip", myIp)
                          put("avatar", me.avatarB64)
                          put("webHost", webChatEnabled.value)
                      })
                  }
                  // Also advertise any active Public Web Users hosted on this device
                  if (webChatEnabled.value) {
                      val now = System.currentTimeMillis()
                      activeWebSessions.forEach { (wUid, seen) ->
                          if (now - seen < 25000) {
                              val v = webVaults[wUid]
                              if (v != null && !v.isPrivate && v.displayName.isNotBlank()) {
                                  sendRawUdpJson(targetAddr, JSONObject().apply {
                                      put("pktType", "BEACON")
                                      put("uid", v.uid.lowercase())
                                      put("name", "${v.displayName} (Web)")
                                      put("ip", myIp)
                                      put("avatar", v.avatarB64)
                                      put("webHost", true)
                                  })
                              }
                          }
                      }
                  }
              }

              private fun startNetworking(ctx: Context) {
                  try {
                      val wm = ctx.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      wm?.createMulticastLock("bgram_lock")?.apply {
                          setReferenceCounted(true)
                          acquire()
                      }
                  } catch (e: Throwable) {}

                  // Periodic UDP discovery + active web session keep-alive monitor
                  scope.launch {
                      while (isActive) {
                          val ip = resolveLanIp()
                          localIp.value = ip
                          val now = System.currentTimeMillis()
                          activeWebSessions.entries.removeIf { now - it.value > 25000L }
                          activeWebCount.value = activeWebSessions.size
                          updateKeepAliveLocks(ctx)

                          if (ip != "0.0.0.0" && (account.value.loggedIn || webChatEnabled.value)) {
                              val targets = resolveDiscoveryTargets(ip)
                              targets.forEach { addr ->
                                  sendDiscoveryBeacon(addr, ip)
                              }
                          }
                          delay(3500)
                      }
                  }

                  // UDP Listener
                  scope.launch {
                      try {
                          val ms = MulticastSocket(UDP_PORT).apply {
                              reuseAddress = true
                              broadcast = true
                              try {
                                  joinGroup(InetAddress.getByName(MCAST))
                              } catch (e: Throwable) {}
                          }
                          val buf = ByteArray(32768)
                          while (isActive) {
                              val dp = DatagramPacket(buf, buf.size)
                              ms.receive(dp)
                              val j = JSONObject(String(dp.data, 0, dp.length, Charsets.UTF_8))
                              val pktType = j.optString("pktType", "BEACON")
                              val uid = j.optString("uid", "").lowercase()
                              if (pktType == "HIDE") {
                                  if (uid.isNotBlank()) {
                                      peerCache.remove(uid)
                                      peers.value = peerCache.values.sortedBy { it.name.lowercase() }
                                  }
                                  continue
                              }
                              val remoteIp = dp.address.hostAddress ?: j.optString("ip", "")
                              if (uid.isNotBlank() && uid != account.value.uid.lowercase() && !webVaults.containsKey(uid) && remoteIp.isNotBlank()) {
                                  val isNewPeer = !peerCache.containsKey(uid)
                                  val node = PeerNode(
                                      uid = uid,
                                      name = j.optString("name", uid),
                                      ip = remoteIp,
                                      avatarB64 = j.optString("avatar", ""),
                                      webHost = j.optBoolean("webHost", false)
                                  )
                                  peerCache[uid] = node
                                  peers.value = peerCache.values.sortedBy { it.name.lowercase() }
                                  syncPeerMetadata(node)

                                  if (isNewPeer && account.value.loggedIn && !account.value.isPrivate) {
                                      val myIp = localIp.value
                                      if (myIp != "0.0.0.0") {
                                          launch {
                                              try {
                                                  sendDiscoveryBeacon(InetAddress.getByName(remoteIp), myIp)
                                              } catch (e: Throwable) {}
                                          }
                                      }
                                  }
                              }
                          }
                      } catch (e: Throwable) {}
                  }

                  // TCP Server (Port 45455)
                  scope.launch {
                      try {
                          val ss = ServerSocket().apply {
                              reuseAddress = true
                              bind(InetSocketAddress(TCP_PORT))
                          }
                          while (isActive) {
                              val client = ss.accept()
                              launch { handleClient(ctx, client) }
                          }
                      } catch (e: Throwable) {}
                  }

                  // HTTP Server (Port 8080: Web Chat Host + APK Download Server)
                  scope.launch {
                      try {
                          val httpServer = ServerSocket().apply {
                              reuseAddress = true
                              bind(InetSocketAddress(HTTP_PORT))
                          }
                          while (isActive) {
                              val client = httpServer.accept()
                              if (!webChatEnabled.value && !apkServerEnabled.value) {
                                  try { client.close() } catch (e: Throwable) {}
                              } else {
                                  launch { handleHttpClient(ctx, client) }
                              }
                          }
                      } catch (e: Throwable) {}
                  }
              }

              private fun handleHttpClient(ctx: Context, client: Socket) {
                  try {
                      client.use { sock ->
                          if (!webChatEnabled.value && !apkServerEnabled.value) return
                          sock.soTimeout = 12000
                          val inp = BufferedInputStream(sock.getInputStream())
                          val headerBuf = ByteArrayOutputStream()
                          var state = 0
                          while (true) {
                              val b = inp.read()
                              if (b == -1) break
                              headerBuf.write(b)
                              if (headerBuf.size() > 16384) break
                              if ((state == 0 && b == '\r'.code) ||
                                  (state == 1 && b == '\n'.code) ||
                                  (state == 2 && b == '\r'.code) ||
                                  (state == 3 && b == '\n'.code)) {
                                  state++
                                  if (state == 4) break
                              } else if (b == '\r'.code) {
                                  state = 1
                              } else {
                                  state = 0
                              }
                          }
                          val headerStr = String(headerBuf.toByteArray(), Charsets.UTF_8)
                          val lines = headerStr.split("\r\n")
                          val reqLine = lines.firstOrNull() ?: return
                          var contentLength = 0
                          for (line in lines.drop(1)) {
                              if (line.lowercase().startsWith("content-length:")) {
                                  contentLength = line.substringAfter(":").trim().toIntOrNull() ?: 0
                              }
                          }
                          val safeLen = contentLength.coerceIn(0, 8 * 1024 * 1024)
                          val bodyBytes = ByteArray(safeLen)
                          var totalRead = 0
                          while (totalRead < safeLen) {
                              val r = inp.read(bodyBytes, totalRead, safeLen - totalRead)
                              if (r <= 0) break
                              totalRead += r
                          }
                          val bodyStr = String(bodyBytes, 0, totalRead, Charsets.UTF_8)
                          val out = BufferedOutputStream(sock.getOutputStream())

                          if (reqLine.startsWith("OPTIONS ")) {
                              writeHttpJson(out, "{}")
                              return
                          }

                          val apkFile = File(ctx.applicationInfo.sourceDir)
                          if ((reqLine.startsWith("GET /chatblack.apk") || reqLine.startsWith("GET /bgram.apk")) && apkFile.exists()) {
                              val headers = "HTTP/1.1 200 OK\r\n" +
                                  "Content-Type: application/vnd.android.package-archive\r\n" +
                                  "Content-Disposition: attachment; filename=\"ChatBlack-v1.0-release.apk\"\r\n" +
                                  "Content-Length: ${apkFile.length()}\r\n" +
                                  "Connection: close\r\n\r\n"
                              out.write(headers.toByteArray(Charsets.UTF_8))
                              FileInputStream(apkFile).use { fis ->
                                  val buf = ByteArray(8192)
                                  while (true) {
                                      val read = fis.read(buf)
                                      if (read <= 0) break
                                      out.write(buf, 0, read)
                                  }
                              }
                              out.flush()
                              return
                          }

                          if (webChatEnabled.value && reqLine.startsWith("POST /api/sync")) {
                              val reqJson = JSONObject(bodyStr.ifBlank { "{}" })
                              val vault = mergeVaultJsonIntoMemory(reqJson, broadcastToLan = true)
                              if (vault != null) {
                                  activeWebSessions[vault.uid] = System.currentTimeMillis()
                                  activeWebCount.value = activeWebSessions.size
                                  updateKeepAliveLocks(ctx)
                              }
                              val resp = JSONObject().apply {
                                  put("ok", true)
                                  put("hostIp", localIp.value)
                                  put("peers", buildWebPeersJsonArray())
                                  if (vault != null) put("vault", vaultToJson(vault))
                              }
                              writeHttpJson(out, resp.toString())
                              return
                          }

                          if (webChatEnabled.value && reqLine.startsWith("POST /api/poll")) {
                              val reqJson = JSONObject(bodyStr.ifBlank { "{}" })
                              val uid = reqJson.optString("uid", "").trim().removePrefix("@").lowercase()
                              if (uid.isNotBlank()) {
                                  activeWebSessions[uid] = System.currentTimeMillis()
                                  activeWebCount.value = activeWebSessions.size
                                  updateKeepAliveLocks(ctx)
                                  val v = webVaults.getOrPut(uid) {
                                      WebUserVault(
                                          uid = uid,
                                          displayName = reqJson.optString("displayName", uid),
                                          avatarB64 = reqJson.optString("avatarB64", ""),
                                          isPrivate = reqJson.optBoolean("isPrivate", false)
                                      )
                                  }
                                  v.isPrivate = reqJson.optBoolean("isPrivate", v.isPrivate)
                                  val resp = JSONObject().apply {
                                      put("ok", true)
                                      put("hostIp", localIp.value)
                                      put("peers", buildWebPeersJsonArray())
                                      put("vault", vaultToJson(v))
                                  }
                                  writeHttpJson(out, resp.toString())
                              } else {
                                  writeHttpJson(out, JSONObject().put("ok", false).toString())
                              }
                              return
                          }

                          if (webChatEnabled.value && reqLine.startsWith("POST /api/action")) {
                              val reqJson = JSONObject(bodyStr.ifBlank { "{}" })
                              val resp = handleWebAction(ctx, reqJson)
                              writeHttpJson(out, resp.toString())
                              return
                          }

                          val assetName = if (webChatEnabled.value) "web_chat.html" else "apk_landing.html"
                          val htmlBytes = ctx.assets.open(assetName).use { it.readBytes() }
                          val headers = "HTTP/1.1 200 OK\r\n" +
                              "Content-Type: text/html; charset=utf-8\r\n" +
                              "Cache-Control: no-store\r\n" +
                              "Content-Length: ${htmlBytes.size}\r\n" +
                              "Connection: close\r\n\r\n"
                          out.write(headers.toByteArray(Charsets.UTF_8))
                          out.write(htmlBytes)
                          out.flush()
                      }
                  } catch (e: Throwable) {}
              }

              private fun writeHttpJson(out: BufferedOutputStream, jsonStr: String) {
                  val bytes = jsonStr.toByteArray(Charsets.UTF_8)
                  val headers = "HTTP/1.1 200 OK\r\n" +
                      "Content-Type: application/json; charset=utf-8\r\n" +
                      "Access-Control-Allow-Origin: *\r\n" +
                      "Access-Control-Allow-Methods: GET, POST, OPTIONS\r\n" +
                      "Access-Control-Allow-Headers: Content-Type\r\n" +
                      "Cache-Control: no-store\r\n" +
                      "Content-Length: ${bytes.size}\r\n" +
                      "Connection: close\r\n\r\n"
                  out.write(headers.toByteArray(Charsets.UTF_8))
                  out.write(bytes)
                  out.flush()
              }

              private fun buildWebPeersJsonArray(): JSONArray {
                  val arr = JSONArray()
                  val me = account.value
                  val myIp = localIp.value
                  if (me.loggedIn && !me.isPrivate) {
                      arr.put(JSONObject().apply {
                          put("uid", me.uid.lowercase())
                          put("name", "${me.displayName} (Host)")
                          put("ip", myIp)
                          put("avatarB64", me.avatarB64)
                      })
                  }
                  peerCache.values.sortedBy { it.name.lowercase() }.forEach { p ->
                      arr.put(JSONObject().apply {
                          put("uid", p.uid)
                          put("name", p.name)
                          put("ip", p.ip)
                          put("avatarB64", p.avatarB64)
                      })
                  }
                  return arr
              }

              private fun handleWebAction(ctx: Context, req: JSONObject): JSONObject {
                  val action = req.optString("action", "")
                  val uid = req.optString("uid", "").trim().removePrefix("@").lowercase()
                  if (uid.isNotBlank()) {
                      activeWebSessions[uid] = System.currentTimeMillis()
                      activeWebCount.value = activeWebSessions.size
                      updateKeepAliveLocks(ctx)
                  }

                  if (action == "WHOIS_IP") {
                      val targetIp = req.optString("targetIp", "").trim()
                      if (targetIp == localIp.value || targetIp == "127.0.0.1") {
                          return JSONObject().apply {
                              put("ok", true)
                              put("peerUid", account.value.uid.lowercase())
                              put("peerName", account.value.displayName)
                              put("peerAvatar", account.value.avatarB64)
                          }
                      }
                      val who = queryWhoisByIp(targetIp)
                      return if (who != null) {
                          val pUid = who.optString("uid", "").lowercase()
                          if (pUid.isNotBlank()) directIpMap[pUid] = targetIp
                          JSONObject().apply {
                              put("ok", true)
                              put("peerUid", pUid)
                              put("peerName", who.optString("name", pUid))
                              put("peerAvatar", who.optString("avatar", ""))
                          }
                      } else {
                          JSONObject().put("ok", false)
                      }
                  }

                  if (action == "SEND_CHAT") {
                      val senderName = req.optString("senderName", uid)
                      val senderAvatar = req.optString("senderAvatar", "")
                      val cid = req.optString("convId", "").lowercase()
                      val convTitle = req.optString("convTitle", cid)
                      val isGroup = req.optBoolean("isGroup", false)
                      val membersCsv = req.optString("membersCsv", cid)
                      val peerIp = req.optString("peerIp", "")
                      val msgObj = req.optJSONObject("msg") ?: return JSONObject().put("ok", false)
                      val msg = parseChatItemJson(msgObj).copy(
                          convId = cid,
                          senderId = uid,
                          senderName = senderName,
                          mine = true,
                          ack = true
                      )

                      val senderVault = webVaults.getOrPut(uid) { WebUserVault(uid, senderName, senderAvatar) }
                      appendToWebVault(senderVault, cid, convTitle, isGroup, membersCsv, "", msg, isIncoming = false)

                      val convMeta = ConversationMeta(
                          convId = cid,
                          title = convTitle,
                          isGroup = isGroup,
                          membersCsv = membersCsv,
                          peerIp = peerIp
                      )

                      // 1. Check if recipient includes the Android Host user
                      val hostUid = account.value.uid.lowercase()
                      val isForHost = if (isGroup) {
                          membersCsv.split(",").map { it.trim().lowercase() }.contains(hostUid)
                      } else {
                          cid == hostUid || (peerIp == localIp.value && !webVaults.containsKey(cid))
                      }
                      if (isForHost) {
                          val hostConvId = if (isGroup) cid else uid
                          val hostConvTitle = if (isGroup) convTitle else senderName
                          if (conversations.value.none { it.convId == hostConvId }) {
                              conversations.value = listOf(
                                  ConversationMeta(
                                      convId = hostConvId,
                                      title = hostConvTitle,
                                      isGroup = isGroup,
                                      membersCsv = membersCsv,
                                      peerIp = localIp.value,
                                      avatarB64 = if (isGroup) "" else senderAvatar
                                  )
                              ) + conversations.value
                          }
                          val hostIncoming = msg.copy(convId = hostConvId, mine = false, ack = true, readByPeer = true)
                          appendMessage(hostConvId, hostIncoming, isIncoming = true)
                          if (activeConvId.value != hostConvId) {
                              val bodyText = when {
                                  hostIncoming.voiceB64.isNotBlank() -> "Sent a voice message (${hostIncoming.voiceSec}s)"
                                  hostIncoming.imageB64.isNotBlank() -> "Sent a photo"
                                  else -> hostIncoming.text
                              }
                              postMsgNotification(ctx, hostConvId, if (isGroup) "$hostConvTitle ($senderName)" else senderName, bodyText)
                          }
                      }

                      // 2. Check if recipient includes other Web Users on this host
                      deliverToLocalWebVaults(convMeta, msg, uid, senderName, senderAvatar)

                      // 3. Forward over LAN TCP to any remote Android peers
                      scope.launch {
                          val myIp = localIp.value
                          val ips = resolveConversationTargetIps(convMeta, uid).filter { it != myIp }
                          ips.forEach { ip ->
                              transmitChatPacket(ip, convMeta, msg, uid, senderName, senderAvatar)
                          }
                          replicateVaultToLanPeers(senderVault)
                      }
                      persistWebVaults()
                      return JSONObject().put("ok", true)
                  }

                  if (action == "REACTION") {
                      val senderName = req.optString("senderName", uid)
                      val cid = req.optString("convId", "").lowercase()
                      val targetMsgId = req.optString("targetMsgId", "")
                      val emoji = req.optString("emoji", "")
                      val senderVault = webVaults[uid]
                      val isGroup = senderVault?.conversations?.firstOrNull { it.convId == cid }?.isGroup ?: cid.startsWith("grp_")
                      if (senderVault != null) {
                          applyReactionInVault(senderVault, cid, targetMsgId, senderName, emoji)
                      }
                      val peerCid = if (isGroup) cid else uid
                      if (cid == account.value.uid.lowercase() || isGroup) {
                          applyReactionLocal(peerCid, targetMsgId, senderName, emoji)
                      }
                      webVaults.values.filter { it.uid != uid }.forEach { v ->
                          applyReactionInVault(v, peerCid, targetMsgId, senderName, emoji)
                      }
                      persistWebVaults()
                      scope.launch {
                          val pkt = JSONObject().apply {
                              put("pktType", "REACTION")
                              put("convId", peerCid)
                              put("targetUid", cid)
                              put("isGroup", isGroup)
                              put("senderId", uid)
                              put("senderName", senderName)
                              put("targetMsgId", targetMsgId)
                              put("emoji", emoji)
                          }
                          val convMeta = ConversationMeta(convId = cid, title = cid, isGroup = isGroup)
                          resolveConversationTargetIps(convMeta, uid).forEach { ip ->
                              transmitRawJson(ip, pkt)
                          }
                      }
                      return JSONObject().put("ok", true)
                  }

                  if (action == "READ") {
                      val cid = req.optString("convId", "").lowercase()
                      val senderVault = webVaults[uid]
                      if (senderVault != null) {
                          synchronized(senderVault.conversations) {
                              for (i in senderVault.conversations.indices) {
                                  if (senderVault.conversations[i].convId == cid) {
                                      senderVault.conversations[i] = senderVault.conversations[i].copy(unread = 0)
                                  }
                              }
                          }
                      }
                      val isGroup = cid.startsWith("grp_")
                      val peerCid = if (isGroup) cid else uid
                      if (cid == account.value.uid.lowercase() || isGroup) {
                          markPeerReadLocal(peerCid)
                      }
                      webVaults[cid]?.let { targetVault ->
                          synchronized(targetVault.messages) {
                              for (i in targetVault.messages.indices) {
                                  val m = targetVault.messages[i]
                                  if (m.convId == peerCid && m.mine) {
                                      targetVault.messages[i] = m.copy(ack = true, readByPeer = true)
                                  }
                              }
                          }
                      }
                      persistWebVaults()
                      return JSONObject().put("ok", true)
                  }

                  return JSONObject().put("ok", false)
              }

              private fun syncPeerMetadata(node: PeerNode) {
                  val updated = conversations.value.map { c ->
                      if (!c.isGroup && c.convId == node.uid) {
                          c.copy(
                              title = node.name.ifBlank { c.title },
                              peerIp = node.ip,
                              avatarB64 = node.avatarB64.ifBlank { c.avatarB64 }
                          )
                      } else c
                  }
                  if (updated != conversations.value) {
                      conversations.value = updated
                      persistConvs()
                  }
              }

              private fun handleClient(ctx: Context, s: Socket) {
                  try {
                      s.use { sock ->
                          val remoteIp = sock.inetAddress.hostAddress ?: ""
                          val reader = BufferedReader(InputStreamReader(sock.getInputStream(), Charsets.UTF_8))
                          val line = reader.readLine()
                          if (line != null) {
                              val out = PrintWriter(OutputStreamWriter(sock.getOutputStream(), Charsets.UTF_8), true)
                              val j = JSONObject(line)
                              val pktType = j.optString("pktType", "CHAT")

                              // Direct IP WHOIS handshake (allows connecting to Private users by IP)
                              if (pktType == "WHOIS") {
                                  val me = account.value
                                  val resp = JSONObject().apply {
                                      put("ok", true)
                                      put("uid", me.uid.lowercase())
                                      put("name", me.displayName.ifBlank { me.uid })
                                      put("avatar", me.avatarB64)
                                  }
                                  out.println(resp.toString())
                                  return
                              }

                              // Cross-Host Web Vault Replication
                              if (pktType == "WEB_VAULT_SYNC") {
                                  val vObj = j.optJSONObject("vault")
                                  if (vObj != null) {
                                      mergeVaultJsonIntoMemory(vObj, broadcastToLan = false)
                                  }
                                  out.println("ACK")
                                  return
                              }

                              val isGroup = j.optBoolean("isGroup", false)
                              val senderId = j.optString("senderId", "").lowercase()
                              val senderName = j.optString("senderName", senderId)
                              val targetUid = j.optString("targetUid", "").lowercase()
                              val cid = if (isGroup) j.optString("convId", senderId) else senderId

                              if (pktType == "REACTION") {
                                  val targetMsgId = j.optString("targetMsgId", "")
                                  val emoji = j.optString("emoji", "")
                                  if (targetMsgId.isNotBlank() && emoji.isNotBlank()) {
                                      if (targetUid.isBlank() || targetUid == account.value.uid.lowercase() || isGroup) {
                                          applyReactionLocal(cid, targetMsgId, senderName.ifBlank { senderId }, emoji)
                                      }
                                      webVaults.values.forEach { v ->
                                          applyReactionInVault(v, cid, targetMsgId, senderName.ifBlank { senderId }, emoji)
                                      }
                                      persistWebVaults()
                                  }
                                  out.println("ACK")
                                  return
                              }

                              if (pktType == "READ") {
                                  if (targetUid.isBlank() || targetUid == account.value.uid.lowercase() || isGroup) {
                                      markPeerReadLocal(cid)
                                  }
                                  webVaults[targetUid]?.let { v ->
                                      synchronized(v.messages) {
                                          for (i in v.messages.indices) {
                                              val m = v.messages[i]
                                              if (m.convId == cid && m.mine) {
                                                  v.messages[i] = m.copy(ack = true, readByPeer = true)
                                              }
                                          }
                                      }
                                      persistWebVaults()
                                  }
                                  out.println("ACK")
                                  return
                              }

                              val senderAvatar = j.optString("senderAvatar", "")
                              val title = if (isGroup) j.optString("convTitle", "Group") else senderName
                              val members = j.optString("membersCsv", senderId)

                              directIpMap[senderId] = remoteIp

                              val msg = ChatItem(
                                  id = j.getString("id"),
                                  convId = cid,
                                  senderId = senderId,
                                  senderName = senderName,
                                  text = j.optString("text", ""),
                                  imageB64 = j.optString("imageB64", ""),
                                  voiceB64 = j.optString("voiceB64", ""),
                                  voiceSec = j.optInt("voiceSec", 0),
                                  waveformCsv = j.optString("waveformCsv", ""),
                                  replyToId = j.optString("replyToId", ""),
                                  replyToSender = j.optString("replyToSender", ""),
                                  replyToText = j.optString("replyToText", ""),
                                  reactionsCsv = j.optString("reactionsCsv", ""),
                                  ts = j.optLong("ts", System.currentTimeMillis()),
                                  mine = false,
                                  ack = true,
                                  readByPeer = true
                              )

                              // Deliver to hosted Web User if addressed to them
                              var deliveredToWebOnly = false
                              if (!isGroup && targetUid.isNotBlank() && webVaults.containsKey(targetUid) && targetUid != account.value.uid.lowercase()) {
                                  val v = webVaults[targetUid]!!
                                  appendToWebVault(v, cid, title, false, members, senderAvatar, msg, isIncoming = true)
                                  persistWebVaults()
                                  deliveredToWebOnly = true
                              } else if (isGroup) {
                                  val groupMembers = members.split(",").map { it.trim().lowercase() }
                                  groupMembers.filter { webVaults.containsKey(it) }.forEach { wUid ->
                                      val v = webVaults[wUid]!!
                                      appendToWebVault(v, cid, title, true, members, "", msg, isIncoming = true)
                                  }
                                  persistWebVaults()
                              }

                              if (!deliveredToWebOnly) {
                                  if (conversations.value.none { it.convId == cid }) {
                                      conversations.value = listOf(
                                          ConversationMeta(
                                              convId = cid,
                                              title = title,
                                              isGroup = isGroup,
                                              membersCsv = members,
                                              peerIp = remoteIp,
                                              avatarB64 = if (isGroup) "" else senderAvatar
                                          )
                                      ) + conversations.value
                                  }
                                  appendMessage(cid, msg, isIncoming = true)

                                  if (activeConvId.value == cid) {
                                      markConversationReadAndNotify(cid)
                                  } else {
                                      val bodyText = when {
                                          msg.voiceB64.isNotBlank() -> "Sent a voice message (${msg.voiceSec}s)"
                                          msg.imageB64.isNotBlank() -> "Sent a photo"
                                          else -> msg.text
                                      }
                                      postMsgNotification(ctx, cid, if (isGroup) "$title ($senderName)" else senderName, bodyText)
                                  }
                              }
                              out.println("ACK")
                          }
                      }
                  } catch (e: Throwable) {}
              }

              private fun postMsgNotification(ctx: Context, cid: String, senderTitle: String, body: String) {
                  try {
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val chId = "chatblack_alerts"
                      nm.createNotificationChannel(
                          NotificationChannel(chId, "ChatBlack Messages", NotificationManager.IMPORTANCE_HIGH)
                      )
                      val intent = Intent(ctx, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("open_conv_id", cid)
                      }
                      val pi = PendingIntent.getActivity(
                          ctx, cid.hashCode(), intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val notif = Notification.Builder(ctx, chId)
                          .setSmallIcon(android.R.drawable.sym_action_chat)
                          .setContentTitle(senderTitle)
                          .setContentText(body)
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .build()
                      nm.notify(cid.hashCode(), notif)
                  } catch (e: Throwable) {}
              }

              fun resolveLanIp(): String {
                  var fallbackIp = "0.0.0.0"
                  try {
                      for (nif in Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!nif.isUp || nif.isLoopback) continue
                          val nName = nif.name.lowercase()
                          for (ia in nif.interfaceAddresses) {
                              val a = ia.address
                              if (a is Inet4Address && !a.isLoopbackAddress && a.isSiteLocalAddress) {
                                  val host = a.hostAddress ?: continue
                                  if (nName.startsWith("wlan") || nName.startsWith("ap") || nName.startsWith("swlan") || nName.startsWith("rndis")) {
                                      return host
                                  }
                                  if (fallbackIp == "0.0.0.0") fallbackIp = host
                              }
                          }
                      }
                  } catch (e: Throwable) {}
                  return fallbackIp
              }

              private fun resolveDiscoveryTargets(myIp: String): List<InetAddress> {
                  val list = mutableListOf<InetAddress>()
                  try {
                      list.add(InetAddress.getByName("255.255.255.255"))
                      list.add(InetAddress.getByName(MCAST))
                      for (nif in Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!nif.isUp || nif.isLoopback) continue
                          for (ia in nif.interfaceAddresses) {
                              val a = ia.address
                              if (a is Inet4Address && !a.isLoopbackAddress) {
                                  ia.broadcast?.let { list.add(it) }
                                  val host = a.hostAddress ?: ""
                                  val parts = host.split(".")
                                  if (parts.size == 4) {
                                      val prefix = "${parts[0]}.${parts[1]}.${parts[2]}"
                                      list.add(InetAddress.getByName("$prefix.1"))
                                      list.add(InetAddress.getByName("$prefix.255"))
                                  }
                              }
                          }
                      }
                      val arp = File("/proc/net/arp")
                      if (arp.exists() && arp.canRead()) {
                          arp.readLines().drop(1).forEach { line ->
                              val cols = line.trim().split(Regex("\\s+"))
                              if (cols.isNotEmpty() && cols[0].contains(".")) {
                                  try {
                                      list.add(InetAddress.getByName(cols[0]))
                                  } catch (e: Throwable) {}
                              }
                          }
                      }
                      peerCache.values.forEach { p ->
                          if (p.ip.isNotBlank() && p.ip != myIp) {
                              try {
                                  list.add(InetAddress.getByName(p.ip))
                              } catch (e: Throwable) {}
                          }
                      }
                  } catch (e: Throwable) {}
                  return list.distinct()
              }
          }

