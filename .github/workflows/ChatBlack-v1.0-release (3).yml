          @Composable
          fun SettingsTabScreen() {
              val ctx = LocalContext.current
              val clip = LocalClipboardManager.current
              val acc by BgramHub.account.collectAsState()
              val ip by BgramHub.localIp.collectAsState()
              val peers by BgramHub.peers.collectAsState()
              val webEnabled by BgramHub.webChatEnabled.collectAsState()
              val apkEnabled by BgramHub.apkServerEnabled.collectAsState()
              val activeWebUsers by BgramHub.activeWebCount.collectAsState()

              var editName by remember(acc.displayName) { mutableStateOf(acc.displayName) }
              var editAvatar by remember(acc.avatarB64) { mutableStateOf(acc.avatarB64) }
              var showConnectIpModal by remember { mutableStateOf(false) }
              var showQrScannerFallback by remember { mutableStateOf(false) }
              var hostUrlInput by remember { mutableStateOf("") }

              val webUrl = "http://$ip:${BgramHub.HTTP_PORT}"

              val avatarPicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { u: Uri? ->
                  if (u != null) {
                      editAvatar = MediaHelper.encodeUriToAvatarB64(ctx, u)
                      BgramHub.login(editName.ifBlank { acc.displayName }, editAvatar, acc.isPrivate)
                  }
              }

              val qrScanLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                  if (res.resultCode == Activity.RESULT_OK) {
                      val scanned = res.data?.getStringExtra("SCAN_RESULT")?.trim() ?: ""
                      if (scanned.startsWith("http://") || scanned.startsWith("https://")) {
                          try {
                              ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(scanned)))
                          } catch (e: Throwable) {}
                      }
                  }
              }

              BackHandler {
                  BgramHub.currentTab.value = "INBOX"
              }

              Scaffold(
                  containerColor = Color.Black,
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color.Black)
                              .statusBarsPadding()
                              .padding(horizontal = 16.dp, vertical = 10.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier.clickable { BgramHub.currentTab.value = "INBOX" }
                              ) {
                                  Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Back", tint = Color(0xFF007AFF))
                                  Spacer(Modifier.width(4.dp))
                                  Text("Chats", color = Color(0xFF007AFF), fontWeight = FontWeight.Bold, fontSize = 15.sp)
                              }
                              Text("Settings & Web Status", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 17.sp)
                              Spacer(Modifier.width(48.dp))
                          }
                          Spacer(Modifier.height(10.dp))
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              Surface(
                                  color = Color(0xFF1C1C1E),
                                  shape = RoundedCornerShape(10.dp),
                                  modifier = Modifier
                                      .weight(1f)
                                      .clickable { BgramHub.currentTab.value = "INBOX" }
                              ) {
                                  Text(
                                      text = "Chats",
                                      color = Color.LightGray,
                                      fontWeight = FontWeight.SemiBold,
                                      fontSize = 12.sp,
                                      modifier = Modifier.padding(vertical = 7.dp).wrapContentWidth(Alignment.CenterHorizontally)
                                  )
                              }
                              Surface(
                                  color = Color(0xFF007AFF),
