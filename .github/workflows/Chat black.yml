                  var gName by remember { mutableStateOf("") }
                  var extraIds by remember { mutableStateOf("") }
                  var selectedSet by remember { mutableStateOf(setOf<String>()) }
                  AlertDialog(
                      onDismissRequest = { showNewGroup = false },
                      containerColor = Color(0xFF1C1C1E),
                      title = { Text("New Group Chat", color = Color.White, fontWeight = FontWeight.Bold) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(value = gName, onValueChange = { gName = it }, label = { Text("Group Name") }, singleLine = true)
                              OutlinedTextField(value = extraIds, onValueChange = { extraIds = it }, label = { Text("Member @IDs (comma-separated)") }, singleLine = true)
                              if (peers.isNotEmpty()) {
                                  Text("SELECT NEARBY CONTACTS", fontSize = 11.sp, color = Color.Gray)
                                  peers.forEach { p ->
                                      val checked = selectedSet.contains(p.uid)
                                      Row(
                                          verticalAlignment = Alignment.CenterVertically,
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clickable {
                                                  selectedSet = if (checked) selectedSet - p.uid else selectedSet + p.uid
                                              }
                                      ) {
                                          Checkbox(
                                              checked = checked,
                                              onCheckedChange = {
                                                  selectedSet = if (checked) selectedSet - p.uid else selectedSet + p.uid
                                              }
                                          )
                                          Text("${p.name} (@${p.uid})", color = Color.White, fontSize = 13.sp)
                                      }
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          Button(
                              onClick = {
                                  val manual = extraIds.split(",").map { it.trim() }.filter { it.isNotBlank() }
                                  BgramHub.createGroup(gName, selectedSet.toList() + manual)
                                  showNewGroup = false
                              },
                              enabled = gName.isNotBlank() && (selectedSet.isNotEmpty() || extraIds.isNotBlank())
                          ) { Text("Create Group") }
                      }
                  )
              }

              if (showProfileModal) {
                  var editName by remember { mutableStateOf(acc.displayName) }
                  var editAvatar by remember { mutableStateOf(acc.avatarB64) }
                  var editPass by remember { mutableStateOf("") }
                  val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { u: Uri? ->
                      if (u != null) editAvatar = MediaHelper.encodeUriToAvatarB64(ctx, u)
                  }
                  AlertDialog(
                      onDismissRequest = { showProfileModal = false },
                      containerColor = Color(0xFF1C1C1E),
                      title = { Text("Edit Profile & Photo", color = Color.White) },
                      text = {
                          Column(horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              AvatarCircle(
                                  name = editName,
                                  avatarB64 = editAvatar,
                                  sizeDp = 72.dp,
                                  onClick = { picker.launch("image/*") }
                              )
                              TextButton(onClick = { picker.launch("image/*") }) {
                                  Text("Change Profile Picture", color = Color(0xFF007AFF))
                              }
                              OutlinedTextField(value = editName, onValueChange = { editName = it }, label = { Text("Display Name") }, singleLine = true)
                              if (editName.trim().equals("BBVB", ignoreCase = true) && !acc.isAdmin) {
                                  OutlinedTextField(
                                      value = editPass,
                                      onValueChange = { editPass = it },
                                      label = { Text("Admin Password for BBVB") },
                                      singleLine = true,
                                      visualTransformation = PasswordVisualTransformation()
                                  )
                              }
                              Text("Your Permanent ID: @${acc.uid}", color = Color.Gray, fontSize = 12.sp, fontFamily = FontFamily.Monospace)
                          }
                      },
                      confirmButton = {
                          Button(onClick = {
                              val grantAdmin = acc.isAdmin || (editName.trim().equals("BBVB", ignoreCase = true) && editPass == "12211")
                              val finalName = if (editName.trim().equals("BBVB", ignoreCase = true) && !grantAdmin) acc.displayName else editName
                              BgramHub.saveProfile(finalName, editAvatar, isAdmin = grantAdmin)
                              showProfileModal = false
                          }) { Text("Save") }
                      }
                  )
              }
          }

          @Composable
          fun AdminMonitorView(logs: List<ChatItem>, modifier: Modifier = Modifier) {
              val ctx = LocalContext.current
              val tf = remember { SimpleDateFormat("MMM d, h:mm:ss a", Locale.getDefault()) }

              if (logs.isEmpty()) {
                  Box(modifier = modifier, contentAlignment = Alignment.Center) {
                      Text(
                          text = "Admin Monitor Active.\nAll messages sent between users on this LAN will appear here.",
                          color = Color.Gray,
                          fontSize = 14.sp
                      )
                  }
              } else {
                  LazyColumn(
                      modifier = modifier,
                      contentPadding = PaddingValues(14.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      items(logs.reversed(), key = { it.id }) { item ->
                          Surface(
                              color = Color(0xFF1C1C1E),
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(
                                          text = "${item.senderName} (@${item.senderId}) -> ${item.recipientLabel.ifBlank { item.convId }}",
                                          color = Color(0xFFFF9500),
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 12.sp
                                      )
                                      Text(
                                          text = tf.format(Date(item.ts)),
                                          color = Color.Gray,
                                          fontSize = 10.sp
                                      )
                                  }
                                  Spacer(Modifier.height(6.dp))
                                  if (item.voiceB64.isNotBlank()) {
                                      Row(
                                          modifier = Modifier
                                              .clip(RoundedCornerShape(10.dp))
                                              .background(Color(0xFF2C2C2E))
                                              .clickable { MediaHelper.playVoiceB64(ctx, item.voiceB64) }
                                              .padding(horizontal = 12.dp, vertical = 8.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Icon(Icons.Default.PlayArrow, contentDescription = "Play", tint = Color(0xFF007AFF))
                                          Spacer(Modifier.width(6.dp))
                                          Text("Play Voice Message (${item.voiceSec}s)", color = Color.White, fontSize = 13.sp)
                                      }
                                  } else {
                                      Text(
                                          text = item.text,
                                          color = Color.White,
                                          fontSize = 15.sp
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChatRoomScreen(cid: String) {
              val ctx = LocalContext.current
              val convs by BgramHub.conversations.collectAsState()
              val allMsgs by BgramHub.messages.collectAsState()
              val conv = convs.firstOrNull { it.convId == cid } ?: ConversationMeta(cid, cid)
              val list = allMsgs.filter { it.convId == cid }

              var textIn by remember { mutableStateOf("") }
              var isRecording by remember { mutableStateOf(false) }
              val listState = rememberLazyListState()

              BackHandler { BgramHub.activeConvId.value = null }

              LaunchedEffect(list.size) {
                  if (list.isNotEmpty()) listState.animateScrollToItem(list.size - 1)
              }

              Scaffold(
                  containerColor = Color.Black,
                  topBar = {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xFF161618))
                              .statusBarsPadding()
                              .padding(horizontal = 8.dp, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier
                                  .clickable { BgramHub.activeConvId.value = null }
                                  .padding(4.dp)
                          ) {
                              Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Back", tint = Color(0xFF007AFF))
                              Text("BGRAM", color = Color(0xFF007AFF), fontSize = 15.sp)
                          }
                          Column(modifier = Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally) {
                              AvatarCircle(conv.title, conv.avatarB64, 28.dp, isGroup = conv.isGroup)
                              Text(conv.title, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold, maxLines = 1)
                              Text(
                                  text = if (conv.isGroup) "Group (${conv.membersCsv})" else "@${conv.convId}",
                                  color = Color.Gray,
                                  fontSize = 10.sp,
                                  maxLines = 1
                              )
                          }
                          Spacer(Modifier.width(56.dp))
                      }
                  }
              ) { pad ->
                  Column(modifier = Modifier.fillMaxSize().padding(pad).background(Color.Black)) {
                      LazyColumn(
                          state = listState,
                          modifier = Modifier.weight(1f).fillMaxWidth(),
                          contentPadding = PaddingValues(14.dp),
                          verticalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          items(list, key = { it.id }) { m ->
                              Column(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalAlignment = if (m.mine) Alignment.End else Alignment.Start
                              ) {
                                  if (conv.isGroup && !m.mine) {
                                      Text(
                                          text = "${m.senderName} (@${m.senderId})",
                                          fontSize = 10.sp,
                                          color = Color.Gray,
                                          modifier = Modifier.padding(start = 6.dp, bottom = 2.dp)
                                      )
                                  }
                                  Surface(
                                      color = if (m.mine) Color(0xFF007AFF) else Color(0xFF26252A),
                                      shape = RoundedCornerShape(18.dp),
                                      modifier = Modifier.widthIn(max = 280.dp)
                                  ) {
                                      if (m.voiceB64.isNotBlank()) {
                                          Row(
                                              modifier = Modifier
                                                  .clickable { MediaHelper.playVoiceB64(ctx, m.voiceB64) }
                                                  .padding(horizontal = 14.dp, vertical = 10.dp),
                                              verticalAlignment = Alignment.CenterVertically,
                                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                                          ) {
                                              Icon(Icons.Default.PlayArrow, contentDescription = "Play Voice", tint = Color.White)
                                              Text("Voice Note (${m.voiceSec}s) - Tap to Play", color = Color.White, fontSize = 14.sp)
                                          }
                                      } else {
                                          Text(
                                              text = m.text,
                                              color = Color.White,
                                              fontSize = 15.sp,
                                              modifier = Modifier.padding(horizontal = 14.dp, vertical = 9.dp)
                                          )
                                      }
                                  }
                                  if (m.mine) {
                                      Text(
                                          text = if (m.ack) "Delivered" else "Sent",
                                          fontSize = 10.sp,
                                          color = Color.Gray,
                                          modifier = Modifier.padding(end = 4.dp, top = 2.dp)
                                      )
                                  }
                              }
                          }
                      }

                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xFF161618))
                              .navigationBarsPadding()
                              .imePadding()
                              .padding(8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          IconButton(
                              onClick = {
                                  if (!isRecording) {
                                      isRecording = MediaHelper.startRecording(ctx)
                                  } else {
                                      isRecording = false
                                      val clip = MediaHelper.stopRecording()
                                      if (clip != null) {
                                          BgramHub.sendChat(cid, "", voiceB64 = clip.b64, voiceSec = clip.sec)
                                      }
                                  }
                              },
                              modifier = Modifier
                                  .size(40.dp)
                                  .clip(CircleShape)
                                  .background(if (isRecording) Color(0xFFFF3B30) else Color(0xFF2C2C2E))
                          ) {
                              Icon(
                                  imageVector = if (isRecording) Icons.Default.Stop else Icons.Default.Mic,
                                  contentDescription = "Voice Note",
                                  tint = Color.White,
                                  modifier = Modifier.size(18.dp)
                              )
                          }

                          OutlinedTextField(
                              value = textIn,
                              onValueChange = { textIn = it },
                              placeholder = {
                                  Text(
                                      text = if (isRecording) "Recording voice... Tap stop to send" else "iMessage",
                                      color = if (isRecording) Color(0xFFFF453A) else Color.Gray,
                                      fontSize = 14.sp
                                  )
                              },
                              singleLine = true,
                              shape = RoundedCornerShape(22.dp),
                              modifier = Modifier.weight(1f)
                          )

                          Box(
                              modifier = Modifier
                                  .size(38.dp)
                                  .clip(CircleShape)
                                  .background(if (textIn.isNotBlank()) Color(0xFF007AFF) else Color(0xFF3A3A3C))
                                  .clickable(enabled = textIn.isNotBlank()) {
                                      BgramHub.sendChat(cid, textIn.trim())
                                      textIn = ""
                                  },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Default.ArrowUpward, contentDescription = "Send", tint = Color.White, modifier = Modifier.size(18.dp))
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile BGRAM Debug APK
        run: |
          gradle assembleDebug --no-daemon > build.log 2>&1 || (grep "^e: " build.log | head -n 20 && exit 1)
          cp app/build/outputs/apk/debug/app-debug.apk BGRAM-LAN.apk

      - name: Upload BGRAM APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BGRAM-APK
          path: BGRAM-LAN.apk
          if-no-files-found: error
