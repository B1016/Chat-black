                          )
                          Row(
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              UserIdentityRepository.AVATAR_PALETTE.forEach { colorHex ->
                                  val isChosen = selectedColor == colorHex
                                  Box(
                                      modifier = Modifier
                                          .size(28.dp)
                                          .clip(CircleShape)
                                          .background(Color(colorHex))
                                          .border(
                                              width = if (isChosen) 2.5.dp else 0.dp,
                                              color = if (isChosen) Color.White else Color.Transparent,
                                              shape = CircleShape
                                          )
                                          .clickable { selectedColor = colorHex }
                                  )
                              }
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          onClick = { onSave(customIdInput, displayNameInput, selectedColor) },
                          enabled = validationError == null
                      ) {
                          Text("Save & Broadcast ID")
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text("Cancel")
                      }
                  }
              )
          }

          @Composable
          private fun AddManualPeerDialog(
              onDismiss: () -> Unit,
              onAdd: (String, String) -> Unit
          ) {
              var peerCustomId by remember { mutableStateOf("") }
              var peerIpAddress by remember { mutableStateOf("") }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Text(text = "Add LAN Peer Manually", fontWeight = FontWeight.Bold)
                  },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Text(
                              text = "If your Wi-Fi router blocks UDP broadcast discovery, add a peer directly by their Custom ID and LAN IPv4 address.",
                              fontSize = 13.sp,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          OutlinedTextField(
                              value = peerCustomId,
                              onValueChange = { peerCustomId = it },
                              label = { Text("Peer Custom ID") },
                              prefix = { Text("@") },
                              singleLine = true
                          )
                          OutlinedTextField(
                              value = peerIpAddress,
                              onValueChange = { peerIpAddress = it },
                              label = { Text("Peer LAN IPv4 (e.g. 192.168.1.42)") },
                              singleLine = true
                          )
                      }
                  },
                  confirmButton = {
                      Button(
                          onClick = { onAdd(peerCustomId, peerIpAddress) },
                          enabled = peerCustomId.isNotBlank() && peerIpAddress.isNotBlank()
                      ) {
                          Text("Connect Peer")
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text("Cancel")
                      }
                  }
              )
          }
          EOF

      - name: Compile Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Chat-Black-LAN.apk

      - name: Upload Compiled Chat Black APK
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Black-APK
          path: Chat-Black-LAN.apk
          if-no-files-found: error
