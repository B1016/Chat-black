          class BgramDaemonService : Service() {
              override fun onCreate() {
                  super.onCreate()
                  BgramHub.init(applicationContext)
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val chId = "bgram_bg_service"
                  nm.createNotificationChannel(
                      NotificationChannel(chId, "BGRAM Background", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, chId)
                      .setSmallIcon(android.R.drawable.sym_action_chat)
                      .setContentTitle("BGRAM Active on LAN")
                      .setContentText("Listening for messages & voice notes in background")
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(101, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(101, notif)
                  }
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null
          }

          object MediaHelper {
              private var recorder: MediaRecorder? = null
              private var outFile: File? = null
              private var startMs: Long = 0L
              private var player: MediaPlayer? = null

              fun startRecording(ctx: Context): Boolean {
                  return try {
                      stopRecording()
                      val f = File(ctx.cacheDir, "voice_${System.currentTimeMillis()}.m4a")
                      outFile = f
                      val r = MediaRecorder()
                      r.setAudioSource(MediaRecorder.AudioSource.MIC)
                      r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      r.setAudioSamplingRate(16000)
                      r.setAudioEncodingBitRate(32000)
                      r.setOutputFile(f.absolutePath)
                      r.prepare()
                      r.start()
                      recorder = r
                      startMs = System.currentTimeMillis()
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              fun stopRecording(): VoiceClip? {
                  val r = recorder ?: return null
                  recorder = null
                  return try {
                      r.stop()
                      r.release()
                      val sec = ((System.currentTimeMillis() - startMs) / 1000L).toInt().coerceAtLeast(1)
                      val f = outFile
                      if (f != null && f.exists()) {
                          val bytes = f.readBytes()
                          f.delete()
                          VoiceClip(Base64.encodeToString(bytes, Base64.NO_WRAP), sec)
                      } else {
                          null
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              fun playVoiceB64(ctx: Context, b64: String) {
                  try {
                      player?.release()
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      val tmp = File(ctx.cacheDir, "play_${System.currentTimeMillis()}.m4a")
                      tmp.writeBytes(bytes)
                      player = MediaPlayer().apply {
                          setDataSource(tmp.absolutePath)
                          prepare()
                          start()
                          setOnCompletionListener {
                              it.release()
                              tmp.delete()
                          }
                      }
                  } catch (e: Exception) {}
              }

              fun encodeUriToAvatarB64(ctx: Context, uri: Uri): String {
                  return try {
                      val stream = ctx.contentResolver.openInputStream(uri)
                      if (stream != null) {
                          val orig = BitmapFactory.decodeStream(stream)
                          stream.close()
                          val scaled = Bitmap.createScaledBitmap(orig, 96, 96, true)
                          val bos = ByteArrayOutputStream()
                          scaled.compress(Bitmap.CompressFormat.JPEG, 75, bos)
                          Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)
                      } else {
                          ""
                      }
                  } catch (e: Exception) {
                      ""
                  }
              }

              fun decodeAvatar(b64: String): Bitmap? {
                  if (b64.isBlank()) return null
                  return try {
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  } catch (e: Exception) {
                      null
                  }
              }
          }

