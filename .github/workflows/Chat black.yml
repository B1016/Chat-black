name: Build Chat Black APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Generate & Compile Chat Black APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub Actions ubuntu-latest already has Android SDK pre-installed at $ANDROID_HOME.
      # Accepting licenses directly avoids third-party action crashes.
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Chat Black Android Project
        run: |
          mkdir -p app/src/main/java/com/chatblack/messenger
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ChatBlack"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.chatblack.messenger"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.chatblack.messenger"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"

                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
                  debug {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-debug"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Messages"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/chatblack/messenger/MainActivity.kt
          package com.chatblack.messenger

          import android.content.Context
          import android.net.wifi.WifiManager
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.animation.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.text.KeyboardActions
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.SolidColor
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.ViewModelProvider
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.io.PrintWriter
          import java.net.*
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.random.Random

          // ============================================================================
          // 1. CONFIGURATION & MODELS
          // ============================================================================

          object LanConfig {
              const val UDP_DISCOVERY_PORT = 45454
              const val TCP_MESSAGE_PORT = 45455
              const val MULTICAST_GROUP = "239.255.45.45"
              const val HEARTBEAT_INTERVAL_MS = 3_000L
              const val PEER_STALE_TIMEOUT_MS = 14_000L
              const val SOCKET_CONNECT_TIMEOUT_MS = 3_500
          }

          data class UserProfile(
              val customId: String,     // Unique generated permanent ID e.g. "cb_8392"
              val displayName: String,  // Friendly display name e.g. "Sarah"
              val avatarColorHex: Long = 0xFF007AFF,
              val isConfigured: Boolean = false
          )

          data class LanPeer(
              val customId: String,
              val displayName: String,
              val ipAddress: String,
              val tcpPort: Int = LanConfig.TCP_MESSAGE_PORT,
              val avatarColorHex: Long = 0xFF5856D6,
              val lastSeenMs: Long = System.currentTimeMillis()
          ) {
              val isOnline: Boolean
                  get() = (System.currentTimeMillis() - lastSeenMs) <= LanConfig.PEER_STALE_TIMEOUT_MS
          }

          enum class DeliveryStatus {
              SENDING, DELIVERED, FAILED
          }

          data class LanMessage(
              val messageId: String = UUID.randomUUID().toString(),
              val senderCustomId: String,
              val senderDisplayName: String,
              val recipientCustomId: String,
              val body: String,
              val timestampMs: Long = System.currentTimeMillis(),
              val isOutgoing: Boolean,
              val deliveryStatus: DeliveryStatus = DeliveryStatus.DELIVERED
          )

          data class ChatThread(
              val peerCustomId: String,
              val peerDisplayName: String,
              val peerIp: String = "",
              val lastMessageText: String = "",
              val lastMessageTimeMs: Long = System.currentTimeMillis(),
              val unreadCount: Int = 0,
              val avatarColorHex: Long = 0xFF007AFF
          )

          // ============================================================================
          // 2. PERSISTENCE (USER PROFILE & CHAT HISTORY)
          // ============================================================================

          class ChatHistoryRepository(context: Context) {
              private val prefs = context.getSharedPreferences("chatblack_imessage_prefs", Context.MODE_PRIVATE)

              companion object {
                  private const val KEY_CUSTOM_ID = "profile_custom_id"
                  private const val KEY_DISPLAY_NAME = "profile_display_name"
                  private const val KEY_CONFIGURED = "profile_is_configured"
                  private const val KEY_AVATAR_COLOR = "profile_avatar_color"
                  private const val KEY_THREADS_JSON = "threads_json"
                  private const val PREFIX_MESSAGES_JSON = "messages_"

                  val AVATAR_COLORS = listOf(
                      0xFF007AFF, // iOS Blue
                      0xFF34C759, // iOS Green
                      0xFF5856D6, // iOS Purple
                      0xFFFF9500, // iOS Orange
                      0xFFFF2D55, // iOS Pink
                      0xFF5AC8FA, // iOS Light Blue
                      0xFFAF52DE  // iOS Violet
                  )
              }

              fun loadProfile(): UserProfile {
                  val configured = prefs.getBoolean(KEY_CONFIGURED, false)
                  var customId = prefs.getString(KEY_CUSTOM_ID, null)
                  if (customId.isNullOrBlank()) {
                      val randomNum = Random.nextInt(1000, 9999)
                      customId = "cb_$randomNum"
                      prefs.edit().putString(KEY_CUSTOM_ID, customId).apply()
                  }
                  val displayName = prefs.getString(KEY_DISPLAY_NAME, "") ?: ""
                  val color = prefs.getLong(KEY_AVATAR_COLOR, AVATAR_COLORS.first())
                  return UserProfile(
                      customId = customId,
                      displayName = displayName,
                      avatarColorHex = color,
                      isConfigured = configured
                  )
              }

              fun saveProfile(profile: UserProfile) {
                  prefs.edit()
                      .putString(KEY_CUSTOM_ID, profile.customId)
                      .putString(KEY_DISPLAY_NAME, profile.displayName.trim())
                      .putLong(KEY_AVATAR_COLOR, profile.avatarColorHex)
                      .putBoolean(KEY_CONFIGURED, true)
                      .apply()
              }

              fun loadThreads(): List<ChatThread> {
                  val jsonStr = prefs.getString(KEY_THREADS_JSON, "[]") ?: "[]"
                  val result = mutableListOf<ChatThread>()
                  runCatching {
                      val arr = JSONArray(jsonStr)
                      for (i in 0 until arr.length()) {
                          val obj = arr.getJSONObject(i)
                          result.add(
                              ChatThread(
                                  peerCustomId = obj.getString("peerCustomId"),
                                  peerDisplayName = obj.optString("peerDisplayName", obj.getString("peerCustomId")),
                                  peerIp = obj.optString("peerIp", ""),
                                  lastMessageText = obj.optString("lastMessageText", ""),
                                  lastMessageTimeMs = obj.optLong("lastMessageTimeMs", System.currentTimeMillis()),
                                  unreadCount = obj.optInt("unreadCount", 0),
                                  avatarColorHex = obj.optLong("avatarColorHex", 0xFF007AFF)
                              )
                          )
                      }
                  }
                  return result.sortedByDescending { it.lastMessageTimeMs }
              }

              fun saveThreads(threads: List<ChatThread>) {
                  val arr = JSONArray()
                  threads.forEach { thread ->
                      val obj = JSONObject().apply {
                          put("peerCustomId", thread.peerCustomId)
                          put("peerDisplayName", thread.peerDisplayName)
                          put("peerIp", thread.peerIp)
                          put("lastMessageText", thread.lastMessageText)
                          put("lastMessageTimeMs", thread.lastMessageTimeMs)
                          put("unreadCount", thread.unreadCount)
                          put("avatarColorHex", thread.avatarColorHex)
                      }
                      arr.put(obj)
                  }
                  prefs.edit().putString(KEY_THREADS_JSON, arr.toString()).apply()
              }

              fun loadMessages(peerCustomId: String): List<LanMessage> {
                  val jsonStr = prefs.getString(PREFIX_MESSAGES_JSON + peerCustomId.lowercase(), "[]") ?: "[]"
                  val result = mutableListOf<LanMessage>()
                  runCatching {
                      val arr = JSONArray(jsonStr)
                      for (i in 0 until arr.length()) {
                          val obj = arr.getJSONObject(i)
                          result.add(
                              LanMessage(
                                  messageId = obj.getString("messageId"),
                                  senderCustomId = obj.getString("senderCustomId"),
                                  senderDisplayName = obj.optString("senderDisplayName", ""),
                                  recipientCustomId = obj.getString("recipientCustomId"),
                                  body = obj.getString("body"),
                                  timestampMs = obj.getLong("timestampMs"),
                                  isOutgoing = obj.getBoolean("isOutgoing"),
                                  deliveryStatus = DeliveryStatus.valueOf(obj.optString("status", "DELIVERED"))
                              )
                          )
                      }
                  }
                  return result
              }

              fun saveMessages(peerCustomId: String, messages: List<LanMessage>) {
                  val arr = JSONArray()
                  messages.takeLast(200).forEach { msg ->
                      val obj = JSONObject().apply {
                          put("messageId", msg.messageId)
                          put("senderCustomId", msg.senderCustomId)
                          put("senderDisplayName", msg.senderDisplayName)
                          put("recipientCustomId", msg.recipientCustomId)
                          put("body", msg.body)
                          put("timestampMs", msg.timestampMs)
                          put("isOutgoing", msg.isOutgoing)
                          put("status", msg.deliveryStatus.name)
                      }
                      arr.put(obj)
                  }
                  prefs.edit().putString(PREFIX_MESSAGES_JSON + peerCustomId.lowercase(), arr.toString()).apply()
              }
          }

          // ============================================================================
          // 3. LAN NETWORK ENGINE (UDP AUTO-DISCOVERY + TCP P2P SOCKS)
          // ============================================================================

          class LanNetworkEngine(
              private val appContext: Context,
              private val scope: CoroutineScope,
              private val onPeerUpdated: (LanPeer) -> Unit,
              private val onMessageReceived: (LanMessage, String) -> Unit,
              private val onDeliveryAck: (String) -> Unit
          ) {
              private var multicastLock: WifiManager.MulticastLock? = null
              private var multicastSocket: MulticastSocket? = null
              private var serverSocket: ServerSocket? = null

              private var heartbeatJob: Job? = null
              private var discoveryJob: Job? = null
              private var serverJob: Job? = null

              @Volatile
              var currentProfile: UserProfile = UserProfile("cb_init", "User")

              fun start(profile: UserProfile) {
                  currentProfile = profile
                  acquireMulticastLock()
                  startUdpListener()
                  startTcpServer()
                  startHeartbeat()
              }

              fun updateProfile(profile: UserProfile) {
                  currentProfile = profile
                  scope.launch(Dispatchers.IO) {
                      broadcastHeartbeat()
                  }
              }

              fun stop() {
                  heartbeatJob?.cancel()
                  discoveryJob?.cancel()
                  serverJob?.cancel()
                  runCatching { multicastSocket?.close() }
                  runCatching { serverSocket?.close() }
                  if (multicastLock?.isHeld == true) multicastLock?.release()
              }

              private fun acquireMulticastLock() {
                  runCatching {
                      val wifi = appContext.applicationContext.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      multicastLock = wifi?.createMulticastLock("ChatBlackMulticast")?.apply {
                          setReferenceCounted(true)
                          acquire()
                      }
                  }
              }

              fun getLocalIp(): String {
                  runCatching {
                      val interfaces = NetworkInterface.getNetworkInterfaces() ?: return "127.0.0.1"
                      for (nif in Collections.list(interfaces)) {
                          if (!nif.isUp || nif.isLoopback) continue
                          for (ia in nif.interfaceAddresses) {
                              val addr = ia.address
                              if (addr is Inet4Address && !addr.isLoopbackAddress && addr.isSiteLocalAddress) {
                                  return addr.hostAddress ?: "127.0.0.1"
                              }
                          }
                      }
                  }
                  return "127.0.0.1"
              }

              private fun startHeartbeat() {
                  heartbeatJob?.cancel()
                  heartbeatJob = scope.launch(Dispatchers.IO) {
                      while (isActive) {
                          broadcastHeartbeat()
                          delay(LanConfig.HEARTBEAT_INTERVAL_MS)
                      }
                  }
              }

              private fun broadcastHeartbeat() {
                  runCatching {
                      val localIp = getLocalIp()
                      if (localIp == "127.0.0.1") return

                      val payload = JSONObject().apply {
                          put("type", "HEARTBEAT")
                          put("customId", currentProfile.customId)
                          put("displayName", currentProfile.displayName)
                          put("ip", localIp)
                          put("tcpPort", LanConfig.TCP_MESSAGE_PORT)
                          put("avatarColor", currentProfile.avatarColorHex)
                      }.toString().toByteArray(Charsets.UTF_8)

                      DatagramSocket().use { socket ->
                          socket.broadcast = true
                          // Subnet broadcast
                          val bcastPacket = DatagramPacket(payload, payload.size, InetAddress.getByName("255.255.255.255"), LanConfig.UDP_DISCOVERY_PORT)
                          socket.send(bcastPacket)

                          // Multicast group
                          val multiPacket = DatagramPacket(payload, payload.size, InetAddress.getByName(LanConfig.MULTICAST_GROUP), LanConfig.UDP_DISCOVERY_PORT)
                          socket.send(multiPacket)
                      }
                  }
              }

              private fun startUdpListener() {
                  discoveryJob?.cancel()
                  discoveryJob = scope.launch(Dispatchers.IO) {
                      runCatching {
                          val socket = MulticastSocket(LanConfig.UDP_DISCOVERY_PORT).apply {
                              reuseAddress = true
                              broadcast = true
                              runCatching {
                                  @Suppress("DEPRECATION")
                                  joinGroup(InetAddress.getByName(LanConfig.MULTICAST_GROUP))
                              }
                          }
                          multicastSocket = socket
                          val buffer = ByteArray(4096)

                          while (isActive && !socket.isClosed) {
                              val packet = DatagramPacket(buffer, buffer.size)
                              socket.receive(packet)
                              val jsonStr = String(packet.data, 0, packet.length, Charsets.UTF_8)
                              handleUdpPacket(jsonStr, packet.address.hostAddress ?: "")
                          }
                      }
                  }
              }

              private fun handleUdpPacket(jsonStr: String, remoteIp: String) {
                  runCatching {
                      val json = JSONObject(jsonStr)
                      val peerId = json.optString("customId", "").trim()
                      val peerName = json.optString("displayName", peerId).ifBlank { peerId }
                      val ip = json.optString("ip", remoteIp).ifBlank { remoteIp }
                      val port = json.optInt("tcpPort", LanConfig.TCP_MESSAGE_PORT)
                      val color = json.optLong("avatarColor", 0xFF5856D6)

                      if (peerId.equals(currentProfile.customId, ignoreCase = true)) return

                      onPeerUpdated(
                          LanPeer(
                              customId = peerId,
                              displayName = peerName,
                              ipAddress = ip,
                              tcpPort = port,
                              avatarColorHex = color,
                              lastSeenMs = System.currentTimeMillis()
                          )
                      )
                  }
              }

              private fun startTcpServer() {
                  serverJob?.cancel()
                  serverJob = scope.launch(Dispatchers.IO) {
                      runCatching {
                          val server = ServerSocket().apply {
                              reuseAddress = true
                              bind(InetSocketAddress(LanConfig.TCP_MESSAGE_PORT))
                          }
                          serverSocket = server

                          while (isActive && !server.isClosed) {
                              val client = server.accept()
                              launch(Dispatchers.IO) {
                                  handleTcpClient(client)
                              }
                          }
                      }
                  }
              }

              private fun handleTcpClient(client: Socket) {
                  client.use { socket ->
                      runCatching {
                          socket.soTimeout = 4_000
                          val remoteIp = socket.inetAddress.hostAddress ?: ""
                          val reader = BufferedReader(InputStreamReader(socket.getInputStream(), Charsets.UTF_8))
                          val writer = PrintWriter(OutputStreamWriter(socket.getOutputStream(), Charsets.UTF_8), true)

                          val line = reader.readLine() ?: return
                          val json = JSONObject(line)
                          if (json.optString("packetType") == "CHAT_MESSAGE") {
                              val msgId = json.getString("messageId")
                              val senderId = json.getString("senderCustomId")
                              val senderName = json.optString("senderDisplayName", senderId)
                              val recipientId = json.getString("recipientCustomId")
                              val body = json.getString("body")
                              val time = json.optLong("timestampMs", System.currentTimeMillis())
                              val avatar = json.optLong("senderAvatarColor", 0xFF5856D6)

                              onPeerUpdated(
                                  LanPeer(
                                      customId = senderId,
                                      displayName = senderName,
                                      ipAddress = remoteIp,
                                      avatarColorHex = avatar,
                                      lastSeenMs = System.currentTimeMillis()
                                  )
                              )

                              val incoming = LanMessage(
                                  messageId = msgId,
                                  senderCustomId = senderId,
                                  senderDisplayName = senderName,
                                  recipientCustomId = recipientId,
                                  body = body,
                                  timestampMs = time,
                                  isOutgoing = false,
                                  deliveryStatus = DeliveryStatus.DELIVERED
                              )
                              onMessageReceived(incoming, remoteIp)

                              // Send ACK
                              val ack = JSONObject().apply {
                                  put("packetType", "DELIVERY_ACK")
                                  put("messageId", msgId)
                              }
                              writer.println(ack.toString())
                          }
                      }
                  }
              }

              suspend fun sendMessage(targetIp: String, targetPort: Int = LanConfig.TCP_MESSAGE_PORT, message: LanMessage): Boolean =
                  withContext(Dispatchers.IO) {
                      runCatching {
                          Socket().use { socket ->
                              socket.connect(InetSocketAddress(targetIp, targetPort), LanConfig.SOCKET_CONNECT_TIMEOUT_MS)
                              socket.soTimeout = LanConfig.SOCKET_CONNECT_TIMEOUT_MS

                              val writer = PrintWriter(OutputStreamWriter(socket.getOutputStream(), Charsets.UTF_8), true)
                              val reader = BufferedReader(InputStreamReader(socket.getInputStream(), Charsets.UTF_8))

                              val payload = JSONObject().apply {
                                  put("packetType", "CHAT_MESSAGE")
                                  put("messageId", message.messageId)
                                  put("senderCustomId", currentProfile.customId)
                                  put("senderDisplayName", currentProfile.displayName)
                                  put("senderAvatarColor", currentProfile.avatarColorHex)
                                  put("recipientCustomId", message.recipientCustomId)
                                  put("body", message.body)
                                  put("timestampMs", message.timestampMs)
                              }
                              writer.println(payload.toString())

                              val ackLine = reader.readLine()
                              if (ackLine != null) {
                                  val ackJson = JSONObject(ackLine)
                                  if (ackJson.optString("packetType") == "DELIVERY_ACK" &&
                                      ackJson.optString("messageId") == message.messageId) {
                                      onDeliveryAck(message.messageId)
                                      return@withContext true
                                  }
                              }
                              true
                          }
                      }.getOrDefault(false)
                  }
          }

          // ============================================================================
          // 4. VIEWMODEL
          // ============================================================================

          data class AppUiState(
              val profile: UserProfile,
              val localIp: String = "127.0.0.1",
              val threads: List<ChatThread> = emptyList(),
              val activePeerId: String? = null,
              val currentMessages: List<LanMessage> = emptyList(),
              val discoveredPeers: List<LanPeer> = emptyList()
          )

          class MainViewModel(applicationContext: Context) : ViewModel() {
              private val repo = ChatHistoryRepository(applicationContext)
              private val peerMap = ConcurrentHashMap<String, LanPeer>()

              private val _uiState: MutableStateFlow<AppUiState>
              val uiState: StateFlow<AppUiState>

              private val network: LanNetworkEngine

              init {
                  val initialProfile = repo.loadProfile()
                  val initialThreads = repo.loadThreads()

                  _uiState = MutableStateFlow(
                      AppUiState(
                          profile = initialProfile,
                          threads = initialThreads
                      )
                  )
                  uiState = _uiState.asStateFlow()

                  network = LanNetworkEngine(
                      appContext = applicationContext,
                      scope = viewModelScope,
                      onPeerUpdated = { peer -> handlePeerDiscovered(peer) },
                      onMessageReceived = { msg, senderIp -> handleIncomingMessage(msg, senderIp) },
                      onDeliveryAck = { msgId -> updateMessageStatus(msgId, DeliveryStatus.DELIVERED) }
                  )

                  _uiState.update { it.copy(localIp = network.getLocalIp()) }
                  network.start(initialProfile)

                  viewModelScope.launch {
                      while (isActive) {
                          delay(3_000L)
                          val currentIp = network.getLocalIp()
                          _uiState.update {
                              it.copy(
                                  localIp = currentIp,
                                  discoveredPeers = peerMap.values.sortedBy { p -> p.displayName.lowercase() }
                              )
                          }
                      }
                  }
              }

              fun completeOnboarding(name: String, selectedColor: Long) {
                  val updated = _uiState.value.profile.copy(
                      displayName = name.trim(),
                      avatarColorHex = selectedColor,
                      isConfigured = true
                  )
                  repo.saveProfile(updated)
                  network.updateProfile(updated)
                  _uiState.update { it.copy(profile = updated) }
              }

              private fun handlePeerDiscovered(peer: LanPeer) {
                  val key = peer.customId.lowercase()
                  peerMap[key] = peer
                  _uiState.update { state ->
                      val updatedThreads = state.threads.map { th ->
                          if (th.peerCustomId.equals(peer.customId, ignoreCase = true)) {
                              th.copy(
                                  peerDisplayName = peer.displayName,
                                  peerIp = peer.ipAddress,
                                  avatarColorHex = peer.avatarColorHex
                              )
                          } else th
                      }
                      if (updatedThreads != state.threads) repo.saveThreads(updatedThreads)

                      state.copy(
                          threads = updatedThreads,
                          discoveredPeers = peerMap.values.sortedBy { p -> p.displayName.lowercase() }
                      )
                  }
              }

              fun openChat(peerCustomId: String, peerDisplayName: String? = null, peerIp: String? = null) {
                  val cleanedId = peerCustomId.trim().removePrefix("@")
                  val knownPeer = peerMap[cleanedId.lowercase()]
                  val effectiveName = peerDisplayName ?: knownPeer?.displayName ?: cleanedId
                  val effectiveIp = peerIp ?: knownPeer?.ipAddress ?: ""
                  val effectiveColor = knownPeer?.avatarColorHex ?: ChatHistoryRepository.AVATAR_COLORS.random()

                  val existingThreads = _uiState.value.threads.toMutableList()
                  val existingIndex = existingThreads.indexOfFirst { it.peerCustomId.equals(cleanedId, ignoreCase = true) }
                  if (existingIndex == -1) {
                      val newThread = ChatThread(
                          peerCustomId = cleanedId,
                          peerDisplayName = effectiveName,
                          peerIp = effectiveIp,
                          avatarColorHex = effectiveColor
                      )
                      existingThreads.add(0, newThread)
                  } else {
                      val current = existingThreads[existingIndex]
                      existingThreads[existingIndex] = current.copy(
                          peerDisplayName = effectiveName,
                          peerIp = if (effectiveIp.isNotBlank()) effectiveIp else current.peerIp,
                          unreadCount = 0
                      )
                  }
                  repo.saveThreads(existingThreads)

                  val messages = repo.loadMessages(cleanedId)
                  _uiState.update {
                      it.copy(
                          threads = existingThreads,
                          activePeerId = cleanedId,
                          currentMessages = messages
                      )
                  }
              }

              fun closeChat() {
                  _uiState.update { it.copy(activePeerId = null, currentMessages = emptyList()) }
              }

              fun sendMessage(text: String) {
                  val activePeer = _uiState.value.activePeerId ?: return
                  val trimmed = text.trim()
                  if (trimmed.isEmpty()) return

                  val state = _uiState.value
                  val outgoing = LanMessage(
                      senderCustomId = state.profile.customId,
                      senderDisplayName = state.profile.displayName,
                      recipientCustomId = activePeer,
                      body = trimmed,
                      isOutgoing = true,
                      deliveryStatus = DeliveryStatus.SENDING
                  )

                  val updatedMessages = state.currentMessages + outgoing
                  repo.saveMessages(activePeer, updatedMessages)

                  val updatedThreads = state.threads.map { th ->
                      if (th.peerCustomId.equals(activePeer, ignoreCase = true)) {
                          th.copy(
                              lastMessageText = trimmed,
                              lastMessageTimeMs = outgoing.timestampMs
                          )
                      } else th
                  }.sortedByDescending { it.lastMessageTimeMs }
                  repo.saveThreads(updatedThreads)

                  _uiState.update {
                      it.copy(
                          currentMessages = updatedMessages,
                          threads = updatedThreads
                      )
                  }

                  val thread = updatedThreads.firstOrNull { it.peerCustomId.equals(activePeer, ignoreCase = true) }
                  val targetIp = peerMap[activePeer.lowercase()]?.ipAddress ?: thread?.peerIp.orEmpty()

                  if (targetIp.isBlank()) {
                      updateMessageStatus(outgoing.messageId, DeliveryStatus.FAILED)
                      return
                  }

                  viewModelScope.launch {
                      val delivered = network.sendMessage(targetIp, LanConfig.TCP_MESSAGE_PORT, outgoing)
                      val status = if (delivered) DeliveryStatus.DELIVERED else DeliveryStatus.FAILED
                      updateMessageStatus(outgoing.messageId, status)
                  }
              }

              private fun handleIncomingMessage(msg: LanMessage, senderIp: String) {
                  val peerId = msg.senderCustomId
                  val peerName = msg.senderDisplayName.ifBlank { peerId }

                  val currentActive = _uiState.value.activePeerId
                  val isCurrentlyOpen = currentActive != null && currentActive.equals(peerId, ignoreCase = true)

                  val history = repo.loadMessages(peerId).toMutableList()
                  if (history.none { it.messageId == msg.messageId }) {
                      history.add(msg)
                      repo.saveMessages(peerId, history)
                  }

                  val currentThreads = _uiState.value.threads.toMutableList()
                  val idx = currentThreads.indexOfFirst { it.peerCustomId.equals(peerId, ignoreCase = true) }
                  if (idx >= 0) {
                      val existing = currentThreads[idx]
                      currentThreads[idx] = existing.copy(
                          peerDisplayName = peerName,
                          peerIp = senderIp,
                          lastMessageText = msg.body,
                          lastMessageTimeMs = msg.timestampMs,
                          unreadCount = if (isCurrentlyOpen) 0 else existing.unreadCount + 1
                      )
                  } else {
                      currentThreads.add(
                          0,
                          ChatThread(
                              peerCustomId = peerId,
                              peerDisplayName = peerName,
                              peerIp = senderIp,
                              lastMessageText = msg.body,
                              lastMessageTimeMs = msg.timestampMs,
                              unreadCount = if (isCurrentlyOpen) 0 else 1
                          )
                      )
                  }
                  val sortedThreads = currentThreads.sortedByDescending { it.lastMessageTimeMs }
                  repo.saveThreads(sortedThreads)

                  _uiState.update { state ->
                      state.copy(
                          threads = sortedThreads,
                          currentMessages = if (isCurrentlyOpen) history else state.currentMessages
                      )
                  }
              }

              private fun updateMessageStatus(messageId: String, status: DeliveryStatus) {
                  val active = _uiState.value.activePeerId ?: return
                  val updated = _uiState.value.currentMessages.map { m ->
                      if (m.messageId == messageId) m.copy(deliveryStatus = status) else m
                  }
                  repo.saveMessages(active, updated)
                  _uiState.update { it.copy(currentMessages = updated) }
              }

              override fun onCleared() {
                  super.onCleared()
                  network.stop()
              }
          }

          class ViewModelFactory(private val context: Context) : ViewModelProvider.Factory {
              override fun <T : ViewModel> create(modelClass: Class<T>): T {
                  @Suppress("UNCHECKED_CAST")
                  return MainViewModel(context) as T
              }
          }

          // ============================================================================
          // 5. ACTIVITY & IMESSAGE UI
          // ============================================================================

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()

                  val vm = ViewModelProvider(this, ViewModelFactory(applicationContext))[MainViewModel::class.java]

                  setContent {
                      IMessageTheme {
                          val state by vm.uiState.collectAsState()

                          if (!state.profile.isConfigured) {
                              OnboardingScreen(
                                  generatedId = state.profile.customId,
                                  onComplete = vm::completeOnboarding
                              )
                          } else if (state.activePeerId != null) {
                              val activeThread = state.threads.firstOrNull { it.peerCustomId.equals(state.activePeerId, ignoreCase = true) }
                              ConversationScreen(
                                  myProfile = state.profile,
                                  thread = activeThread ?: ChatThread(state.activePeerId!!, state.activePeerId!!),
                                  messages = state.currentMessages,
                                  onBack = vm::closeChat,
                                  onSendMessage = vm::sendMessage
                              )
                          } else {
                              HomeScreen(
                                  state = state,
                                  onOpenChat = vm::openChat
                              )
                          }
                      }
                  }
              }
          }

