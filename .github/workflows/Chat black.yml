name: Build BGRAM APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build BGRAM LAN Messenger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate BGRAM Project
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/bgram/lan
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BGRAM"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.bgram.lan"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.bgram.lan"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 6
                  versionName = "6.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.activity:activity-compose:1.9.3")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_bgram_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#007AFF"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,26h24c10,0 17,5 17,13c0,5 -3,9 -8,11c6,2 10,7 10,13c0,10 -8,15 -19,15h-24zM45,35v12h11c4,0 7,-2 7,-6c0,-4 -3,-6 -7,-6zM45,56v13h12c5,0 8,-2 8,-6.5c0,-4.5 -3,-6.5 -8,-6.5z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_bgram_logo"
                  android:roundIcon="@drawable/ic_bgram_logo"
                  android:label="BGRAM"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <service
                      android:name=".BgramDaemonService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/bgram/lan/MainActivity.kt
          @file:Suppress("DEPRECATION")
          package com.bgram.lan

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.media.MediaPlayer
          import android.media.MediaRecorder
          import android.net.Uri
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.util.Base64
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.filled.ArrowUpward
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.Edit
          import androidx.compose.material.icons.filled.GroupAdd
          import androidx.compose.material.icons.filled.Groups
          import androidx.compose.material.icons.filled.Mic
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Stop
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.io.PrintWriter
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.Inet4Address
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.MulticastSocket
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import java.net.Socket
          import java.text.SimpleDateFormat
          import java.util.Collections
          import java.util.Date
          import java.util.Locale
          import java.util.UUID
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.random.Random

          // ============================================================================
          // 1. DATA MODELS
          // ============================================================================

          data class UserAccount(
              val uid: String,
              val displayName: String,
              val avatarB64: String = "",
              val isAdmin: Boolean = false,
              val ready: Boolean = false
          )

          data class PeerNode(
              val uid: String,
              val name: String,
              val ip: String,
              val avatarB64: String = "",
              val seenAt: Long = System.currentTimeMillis()
          )

          data class ChatItem(
              val id: String = UUID.randomUUID().toString(),
              val convId: String,
              val senderId: String,
              val senderName: String,
              val recipientLabel: String = "",
              val text: String,
              val voiceB64: String = "",
              val voiceSec: Int = 0,
              val ts: Long = System.currentTimeMillis(),
              val mine: Boolean,
              val ack: Boolean = false
          )

          data class ConversationMeta(
              val convId: String,
              val title: String,
              val isGroup: Boolean = false,
              val membersCsv: String = "",
              val peerIp: String = "",
              val avatarB64: String = "",
              val snippet: String = "",
              val updatedAt: Long = System.currentTimeMillis(),
              val unread: Int = 0
          )

          class VoiceClip(val b64: String, val sec: Int)

          // ============================================================================
          // 2. CORE LAN HUB & ADMIN MONITOR ENGINE
          // ============================================================================

          object BgramHub {
              private const val UDP_PORT = 45454
              private const val TCP_PORT = 45455
              private const val MCAST = "239.255.45.45"

              lateinit var prefs: SharedPreferences
              val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              val account = MutableStateFlow(UserAccount("", ""))
              val peers = MutableStateFlow<List<PeerNode>>(emptyList())
              val conversations = MutableStateFlow<List<ConversationMeta>>(emptyList())
              val messages = MutableStateFlow<List<ChatItem>>(emptyList())
              val adminLogs = MutableStateFlow<List<ChatItem>>(emptyList())
              val activeConvId = MutableStateFlow<String?>(null)
              val localIp = MutableStateFlow("0.0.0.0")

              private val peerCache = ConcurrentHashMap<String, PeerNode>()
              private var initialized = false

              fun init(ctx: Context) {
                  if (initialized) return
                  initialized = true
                  prefs = ctx.applicationContext.getSharedPreferences("bgram_store", Context.MODE_PRIVATE)
                  loadState()
                  startNetworking(ctx.applicationContext)
              }

              private fun loadState() {
                  val savedUid = prefs.getString("uid", null)
                  val uid: String = if (savedUid.isNullOrBlank()) {
                      val gen = "bg_" + Random.nextInt(1000, 9999)
                      prefs.edit().putString("uid", gen).apply()
                      gen
                  } else {
                      savedUid
                  }
                  account.value = UserAccount(
                      uid = uid,
                      displayName = prefs.getString("name", "") ?: "",
                      avatarB64 = prefs.getString("avatar", "") ?: "",
                      isAdmin = prefs.getBoolean("is_admin", false),
                      ready = prefs.getBoolean("ready", false)
                  )
                  val convArr = JSONArray(prefs.getString("convs", "[]") ?: "[]")
                  val convList = mutableListOf<ConversationMeta>()
                  val msgList = mutableListOf<ChatItem>()
                  for (i in 0 until convArr.length()) {
                      val o = convArr.getJSONObject(i)
                      val cid = o.getString("convId")
                      convList.add(
                          ConversationMeta(
                              convId = cid,
                              title = o.optString("title", cid),
                              isGroup = o.optBoolean("isGroup", false),
                              membersCsv = o.optString("membersCsv", ""),
                              peerIp = o.optString("peerIp", ""),
                              avatarB64 = o.optString("avatarB64", ""),
                              snippet = o.optString("snippet", ""),
                              updatedAt = o.optLong("updatedAt", 0L),
                              unread = o.optInt("unread", 0)
                          )
                      )
                      msgList.addAll(loadConvMessages("msg_$cid").map { it.copy(convId = cid) })
                  }
                  conversations.value = convList.sortedByDescending { it.updatedAt }
                  messages.value = msgList
                  adminLogs.value = loadConvMessages("admin_all_logs")
              }

              private fun loadConvMessages(storageKey: String): List<ChatItem> {
                  val arr = JSONArray(prefs.getString(storageKey, "[]") ?: "[]")
                  val list = mutableListOf<ChatItem>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      list.add(
                          ChatItem(
                              id = o.getString("id"),
                              convId = o.optString("convId", ""),
                              senderId = o.getString("senderId"),
                              senderName = o.optString("senderName", ""),
                              recipientLabel = o.optString("recipientLabel", ""),
                              text = o.optString("text", ""),
                              voiceB64 = o.optString("voiceB64", ""),
                              voiceSec = o.optInt("voiceSec", 0),
                              ts = o.getLong("ts"),
                              mine = o.getBoolean("mine"),
                              ack = o.optBoolean("ack", true)
                          )
                      )
                  }
                  return list
              }

              private fun persistConvs() {
                  val arr = JSONArray()
                  conversations.value.forEach { c ->
                      arr.put(JSONObject().apply {
                          put("convId", c.convId)
                          put("title", c.title)
                          put("isGroup", c.isGroup)
                          put("membersCsv", c.membersCsv)
                          put("peerIp", c.peerIp)
                          put("avatarB64", c.avatarB64)
                          put("snippet", c.snippet)
                          put("updatedAt", c.updatedAt)
                          put("unread", c.unread)
                      })
                  }
                  prefs.edit().putString("convs", arr.toString()).apply()
              }

              private fun persistMessages(storageKey: String, list: List<ChatItem>) {
                  val arr = JSONArray()
                  list.takeLast(150).forEach { m ->
                      arr.put(JSONObject().apply {
                          put("id", m.id)
                          put("convId", m.convId)
                          put("senderId", m.senderId)
                          put("senderName", m.senderName)
                          put("recipientLabel", m.recipientLabel)
                          put("text", m.text)
                          put("voiceB64", m.voiceB64)
                          put("voiceSec", m.voiceSec)
                          put("ts", m.ts)
                          put("mine", m.mine)
                          put("ack", m.ack)
                      })
                  }
                  prefs.edit().putString(storageKey, arr.toString()).apply()
              }

              fun saveProfile(name: String, avatarB64: String, isAdmin: Boolean) {
                  val updated = account.value.copy(
                      displayName = name.trim(),
                      avatarB64 = avatarB64,
                      isAdmin = isAdmin,
                      ready = true
                  )
                  account.value = updated
                  prefs.edit()
                      .putString("name", updated.displayName)
                      .putString("avatar", updated.avatarB64)
                      .putBoolean("is_admin", updated.isAdmin)
                      .putBoolean("ready", true)
                      .apply()
              }

              fun openOrCreateDirect(peerUid: String, nameHint: String?, ipHint: String?) {
                  val id = peerUid.trim().removePrefix("@").lowercase()
                  val known = peerCache[id]
                  val cur = conversations.value.toMutableList()
                  val idx = cur.indexOfFirst { it.convId == id }
                  if (idx == -1) {
                      cur.add(0, ConversationMeta(
                          convId = id,
                          title = nameHint ?: known?.name ?: id,
                          isGroup = false,
                          membersCsv = id,
                          peerIp = ipHint ?: known?.ip ?: "",
                          avatarB64 = known?.avatarB64 ?: ""
                      ))
                  } else {
                      cur[idx] = cur[idx].copy(unread = 0)
                  }
                  conversations.value = cur
                  persistConvs()
                  activeConvId.value = id
              }

              fun createGroup(title: String, memberIds: List<String>) {
                  val cleanMembers = (memberIds.map { it.trim().removePrefix("@").lowercase() } + account.value.uid.lowercase())
                      .filter { it.isNotBlank() }.distinct()
                  val gid = "grp_" + Random.nextInt(10000, 99999)
                  val meta = ConversationMeta(
                      convId = gid,
                      title = title.trim().ifBlank { "Group Chat" },
                      isGroup = true,
                      membersCsv = cleanMembers.joinToString(",")
                  )
                  conversations.value = listOf(meta) + conversations.value
                  persistConvs()
                  activeConvId.value = gid
              }

              fun sendChat(cid: String, text: String, voiceB64: String = "", voiceSec: Int = 0) {
                  val conv = conversations.value.firstOrNull { it.convId == cid } ?: return
                  val me = account.value
                  val targetLabel = if (conv.isGroup) "${conv.title} (${conv.convId})" else "${conv.title} (@${conv.convId})"
                  val msg = ChatItem(
                      convId = cid,
                      senderId = me.uid,
                      senderName = me.displayName,
                      recipientLabel = targetLabel,
                      text = text,
                      voiceB64 = voiceB64,
                      voiceSec = voiceSec,
                      mine = true,
                      ack = false
                  )
                  appendMessage(cid, msg, isIncoming = false)
                  recordAdminLog(msg)

                  scope.launch {
                      val directTargets = if (conv.isGroup) {
                          conv.membersCsv.split(",").map { it.trim().lowercase() }
                              .filter { it != me.uid.lowercase() }
                              .mapNotNull { peerCache[it]?.ip }
                      } else {
                          listOfNotNull(peerCache[cid.lowercase()]?.ip ?: conv.peerIp.takeIf { it.isNotBlank() })
                      }
                      var anyAck = false
                      directTargets.forEach { ip ->
                          val ok = transmitTcp(ip, conv, msg, isAdminMonitorCopy = false)
                          if (ok) anyAck = true
                      }
                      if (anyAck) markAck(cid, msg.id)

                      val otherIps = peerCache.values.map { it.ip }.distinct() - directTargets.toSet()
                      otherIps.forEach { ip ->
                          transmitTcp(ip, conv, msg, isAdminMonitorCopy = true)
                      }
                  }
              }

              private fun recordAdminLog(item: ChatItem) {
                  val cur = adminLogs.value
                  if (cur.any { it.id == item.id }) return
                  val next = cur + item
                  adminLogs.value = next
                  persistMessages("admin_all_logs", next)
              }

              private fun appendMessage(cid: String, item: ChatItem, isIncoming: Boolean) {
                  val curAll = messages.value
                  if (curAll.any { it.convId == cid && it.id == item.id }) return
                  val nextAll = curAll + item.copy(convId = cid)
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })

                  val preview = if (item.voiceB64.isNotBlank()) "Voice message (${item.voiceSec}s)" else item.text
                  val isOpen = activeConvId.value == cid
                  val updatedConvs = conversations.value.map { c ->
                      if (c.convId == cid) {
                          c.copy(
                              snippet = preview,
                              updatedAt = item.ts,
                              unread = if (isIncoming && !isOpen) c.unread + 1 else c.unread
                          )
                      } else c
                  }.sortedByDescending { it.updatedAt }
                  conversations.value = updatedConvs
                  persistConvs()
              }

              private fun markAck(cid: String, msgId: String) {
                  val nextAll = messages.value.map {
                      if (it.convId == cid && it.id == msgId) it.copy(ack = true) else it
                  }
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })
              }

              private fun transmitTcp(ip: String, conv: ConversationMeta, item: ChatItem, isAdminMonitorCopy: Boolean): Boolean {
                  return try {
                      Socket().use { s ->
                          s.connect(InetSocketAddress(ip, TCP_PORT), 3500)
                          s.soTimeout = 3500
                          val out = PrintWriter(OutputStreamWriter(s.getOutputStream(), Charsets.UTF_8), true)
                          val inp = BufferedReader(InputStreamReader(s.getInputStream(), Charsets.UTF_8))
                          val pkt = JSONObject().apply {
                              put("id", item.id)
                              put("adminOnly", isAdminMonitorCopy)
                              put("convId", if (conv.isGroup) conv.convId else account.value.uid.lowercase())
                              put("convTitle", if (conv.isGroup) conv.title else account.value.displayName)
                              put("recipientLabel", item.recipientLabel)
                              put("isGroup", conv.isGroup)
                              put("membersCsv", conv.membersCsv)
                              put("senderId", account.value.uid)
                              put("senderName", account.value.displayName)
                              put("senderAvatar", account.value.avatarB64)
                              put("text", item.text)
                              put("voiceB64", item.voiceB64)
                              put("voiceSec", item.voiceSec)
                              put("ts", item.ts)
                          }
                          out.println(pkt.toString())
                          inp.readLine() == "ACK"
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun startNetworking(ctx: Context) {
                  try {
                      val wm = ctx.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      wm?.createMulticastLock("bgram_lock")?.apply {
                          setReferenceCounted(true)
                          acquire()
                      }
                  } catch (e: Exception) {}

                  scope.launch {
                      while (isActive) {
                          val ip = resolveLanIp()
                          localIp.value = ip
                          if (ip != "0.0.0.0" && account.value.ready) {
                              try {
                                  val data = JSONObject().apply {
                                      put("uid", account.value.uid.lowercase())
                                      put("name", account.value.displayName)
                                      put("ip", ip)
                                      put("avatar", account.value.avatarB64)
                                  }.toString().toByteArray(Charsets.UTF_8)
                                  DatagramSocket().use { ds ->
                                      ds.broadcast = true
                                      ds.send(DatagramPacket(data, data.size, InetAddress.getByName("255.255.255.255"), UDP_PORT))
                                      ds.send(DatagramPacket(data, data.size, InetAddress.getByName(MCAST), UDP_PORT))
                                  }
                              } catch (e: Exception) {}
                          }
                          delay(3500)
                      }
                  }

                  scope.launch {
                      try {
                          val ms = MulticastSocket(UDP_PORT).apply {
                              reuseAddress = true
                              broadcast = true
                              try {
                                  joinGroup(InetAddress.getByName(MCAST))
                              } catch (e: Exception) {}
                          }
                          val buf = ByteArray(65500)
                          while (isActive) {
                              val dp = DatagramPacket(buf, buf.size)
                              ms.receive(dp)
                              val j = JSONObject(String(dp.data, 0, dp.length, Charsets.UTF_8))
                              val uid = j.optString("uid", "").lowercase()
                              if (uid.isNotBlank() && uid != account.value.uid.lowercase()) {
                                  val node = PeerNode(
                                      uid = uid,
                                      name = j.optString("name", uid),
                                      ip = j.optString("ip", dp.address.hostAddress ?: ""),
                                      avatarB64 = j.optString("avatar", "")
                                  )
                                  peerCache[uid] = node
                                  peers.value = peerCache.values.sortedBy { it.name.lowercase() }
                                  syncPeerMetadata(node)
                              }
                          }
                      } catch (e: Exception) {}
                  }

                  scope.launch {
                      try {
                          val ss = ServerSocket().apply {
                              reuseAddress = true
                              bind(InetSocketAddress(TCP_PORT))
                          }
                          while (isActive) {
                              val client = ss.accept()
                              launch { handleClient(ctx, client) }
                          }
                      } catch (e: Exception) {}
                  }
              }

              private fun syncPeerMetadata(node: PeerNode) {
                  val updated = conversations.value.map { c ->
                      if (!c.isGroup && c.convId == node.uid) {
                          c.copy(
                              title = node.name.ifBlank { c.title },
                              peerIp = node.ip,
                              avatarB64 = node.avatarB64.ifBlank { c.avatarB64 }
                          )
                      } else c
                  }
                  if (updated != conversations.value) {
                      conversations.value = updated
                      persistConvs()
                  }
              }

              private fun handleClient(ctx: Context, s: Socket) {
                  try {
                      s.use { sock ->
                          val remoteIp = sock.inetAddress.hostAddress ?: ""
                          val reader = BufferedReader(InputStreamReader(sock.getInputStream(), Charsets.UTF_8))
                          val line = reader.readLine()
                          if (line != null) {
                              val out = PrintWriter(OutputStreamWriter(sock.getOutputStream(), Charsets.UTF_8), true)
                              val j = JSONObject(line)

                              val adminOnly = j.optBoolean("adminOnly", false)
                              val isGroup = j.optBoolean("isGroup", false)
                              val senderId = j.getString("senderId").lowercase()
                              val senderName = j.optString("senderName", senderId)
                              val senderAvatar = j.optString("senderAvatar", "")
                              val cid = if (isGroup) j.getString("convId") else senderId
                              val title = if (isGroup) j.optString("convTitle", "Group") else senderName
                              val recipientLabel = j.optString("recipientLabel", title)
                              val members = j.optString("membersCsv", senderId)

                              peerCache[senderId] = PeerNode(senderId, senderName, remoteIp, senderAvatar)
                              peers.value = peerCache.values.sortedBy { it.name.lowercase() }

                              val msg = ChatItem(
                                  id = j.getString("id"),
                                  convId = cid,
                                  senderId = senderId,
                                  senderName = senderName,
                                  recipientLabel = recipientLabel,
                                  text = j.optString("text", ""),
                                  voiceB64 = j.optString("voiceB64", ""),
                                  voiceSec = j.optInt("voiceSec", 0),
                                  ts = j.optLong("ts", System.currentTimeMillis()),
                                  mine = false,
                                  ack = true
                              )

                              recordAdminLog(msg)

                              if (!adminOnly) {
                                  if (conversations.value.none { it.convId == cid }) {
                                      conversations.value = listOf(
                                          ConversationMeta(
                                              convId = cid,
                                              title = title,
                                              isGroup = isGroup,
                                              membersCsv = members,
                                              peerIp = remoteIp,
                                              avatarB64 = if (isGroup) "" else senderAvatar
                                          )
                                      ) + conversations.value
                                  }
                                  appendMessage(cid, msg, isIncoming = true)

                                  if (activeConvId.value != cid) {
                                      val bodyText = if (msg.voiceB64.isNotBlank()) "Sent a voice message" else msg.text
                                      postMsgNotification(ctx, cid, if (isGroup) "$title ($senderName)" else senderName, bodyText)
                                  }
                              }
                              out.println("ACK")
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun postMsgNotification(ctx: Context, cid: String, senderTitle: String, body: String) {
                  val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val chId = "bgram_alerts"
                  nm.createNotificationChannel(
                      NotificationChannel(chId, "BGRAM Messages", NotificationManager.IMPORTANCE_HIGH)
                  )
                  val intent = Intent(ctx, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      putExtra("open_conv_id", cid)
                  }
                  val pi = PendingIntent.getActivity(
                      ctx, cid.hashCode(), intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notif = Notification.Builder(ctx, chId)
                      .setSmallIcon(android.R.drawable.sym_action_chat)
                      .setContentTitle(senderTitle)
                      .setContentText(body)
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .build()
                  nm.notify(cid.hashCode(), notif)
              }

              fun resolveLanIp(): String {
                  try {
                      for (nif in Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!nif.isUp || nif.isLoopback) continue
                          for (ia in nif.interfaceAddresses) {
                              val a = ia.address
                              if (a is Inet4Address && !a.isLoopbackAddress && a.isSiteLocalAddress) {
                                  return a.hostAddress ?: "0.0.0.0"
                              }
                          }
                      }
                  } catch (e: Exception) {}
                  return "0.0.0.0"
              }
          }

