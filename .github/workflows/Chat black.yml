          @Composable
          private fun MessageBubble(message: LanMessage) {
              val timeFormatter = remember { SimpleDateFormat("HH:mm:ss", Locale.getDefault()) }
              val alignment = if (message.isOutgoing) Alignment.End else Alignment.Start
              val bubbleColor = if (message.isOutgoing) {
                  MaterialTheme.colorScheme.primaryContainer
              } else {
                  MaterialTheme.colorScheme.surfaceVariant
              }
              val textColor = if (message.isOutgoing) {
                  MaterialTheme.colorScheme.onPrimaryContainer
              } else {
                  MaterialTheme.colorScheme.onSurface
              }

              Column(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalAlignment = alignment
              ) {
                  Surface(
                      color = bubbleColor,
                      shape = RoundedCornerShape(
                          topStart = 16.dp,
                          topEnd = 16.dp,
                          bottomStart = if (message.isOutgoing) 16.dp else 4.dp,
                          bottomEnd = if (message.isOutgoing) 4.dp else 16.dp
                      ),
                      modifier = Modifier.widthIn(max = 310.dp)
                  ) {
                      Column(modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp)) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              Text(
                                  text = "@${message.senderCustomId}",
                                  fontSize = 11.sp,
                                  fontFamily = FontFamily.Monospace,
                                  fontWeight = FontWeight.Bold,
                                  color = if (message.isOutgoing) Color(0xFF6EE7B7) else Color(0xFF38BDF8)
                              )
                              Text(
                                  text = "(${message.senderIp})",
                                  fontSize = 10.sp,
                                  fontFamily = FontFamily.Monospace,
                                  color = textColor.copy(alpha = 0.65f),
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              text = message.body,
                              fontSize = 14.sp,
                              color = textColor
                          )
                          Spacer(modifier = Modifier.height(4.dp))
                          Row(
                              modifier = Modifier.align(Alignment.End),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(4.dp)
                          ) {
                              Text(
                                  text = timeFormatter.format(Date(message.timestampMs)),
                                  fontSize = 10.sp,
                                  color = textColor.copy(alpha = 0.7f)
                              )
                              if (message.isOutgoing) {
                                  val statusLabel = when (message.deliveryStatus) {
                                      DeliveryStatus.SENDING -> "•••"
                                      DeliveryStatus.DELIVERED -> "✓ ACK"
                                      DeliveryStatus.FAILED -> "! Offline"
                                  }
                                  Text(
                                      text = statusLabel,
                                      fontSize = 10.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      color = when (message.deliveryStatus) {
                                          DeliveryStatus.SENDING -> textColor.copy(alpha = 0.7f)
                                          DeliveryStatus.DELIVERED -> Color(0xFF6EE7B7)
                                          DeliveryStatus.FAILED -> Color(0xFFFCA5A5)
                                      }
                                  )
                              }
                          }
                      }
                  }
              }
          }

