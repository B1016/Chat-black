                                  )
                                  Text(
                                      text = "@${thread.peerCustomId}",
                                      fontSize = 10.sp,
                                      fontFamily = FontFamily.Monospace,
                                      color = Color(0xFF8E8E93)
                                  )
                              }

                              Spacer(modifier = Modifier.width(60.dp))
                          }
                          HorizontalDivider(color = Color(0xFF2C2C2E), thickness = 0.5.dp)
                      }
                  }
              ) { innerPadding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                          .background(Color.Black)
                  ) {
                      Box(modifier = Modifier.weight(1f).fillMaxWidth()) {
                          LazyColumn(
                              state = listState,
                              modifier = Modifier.fillMaxSize(),
                              contentPadding = PaddingValues(horizontal = 14.dp, vertical = 12.dp),
                              verticalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              items(messages, key = { it.messageId }) { msg ->
                                  AppleMessageBubble(msg = msg)
                              }
                          }
                      }

                      Surface(
                          color = Color(0xFF161618),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .navigationBarsPadding()
                                  .imePadding()
                                  .padding(horizontal = 10.dp, vertical = 8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Surface(
                                  color = Color(0xFF2C2C2E),
                                  shape = RoundedCornerShape(22.dp),
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(horizontal = 14.dp, vertical = 8.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      BasicTextField(
                                          value = inputDraft,
                                          onValueChange = { inputDraft = it },
                                          textStyle = TextStyle(color = Color.White, fontSize = 16.sp),
                                          cursorBrush = SolidColor(Color(0xFF007AFF)),
                                          modifier = Modifier.weight(1f),
                                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Send),
                                          keyboardActions = KeyboardActions(
                                              onSend = {
                                                  if (inputDraft.isNotBlank()) {
                                                      onSendMessage(inputDraft)
                                                      inputDraft = ""
                                                  }
                                              }
                                          ),
                                          decorationBox = { innerTextField ->
                                              if (inputDraft.isEmpty()) {
                                                  Text(
                                                      text = "iMessage",
                                                      color = Color(0xFF8E8E93),
                                                      fontSize = 16.sp
                                                  )
                                              }
                                              innerTextField()
                                          }
                                      )
                                  }
                              }

                              Spacer(modifier = Modifier.width(8.dp))

                              Box(
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(CircleShape)
                                      .background(if (inputDraft.isNotBlank()) Color(0xFF007AFF) else Color(0xFF3A3A3C))
                                      .clickable(enabled = inputDraft.isNotBlank()) {
                                          if (inputDraft.isNotBlank()) {
                                              onSendMessage(inputDraft)
                                              inputDraft = ""
                                          }
                                      },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.ArrowUpward,
                                      contentDescription = "Send",
                                      tint = Color.White,
                                      modifier = Modifier.size(18.dp)
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AppleMessageBubble(msg: LanMessage) {
              val alignment = if (msg.isOutgoing) Alignment.End else Alignment.Start
              val bubbleColor = if (msg.isOutgoing) Color(0xFF007AFF) else Color(0xFF26252A)
              val textColor = Color.White

              Column(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalAlignment = alignment
              ) {
                  Surface(
                      color = bubbleColor,
                      shape = RoundedCornerShape(
                          topStart = 18.dp,
                          topEnd = 18.dp,
                          bottomStart = if (msg.isOutgoing) 18.dp else 4.dp,
                          bottomEnd = if (msg.isOutgoing) 4.dp else 18.dp
                      ),
                      modifier = Modifier.widthIn(max = 280.dp)
                  ) {
                      Text(
                          text = msg.body,
                          color = textColor,
                          fontSize = 15.sp,
                          modifier = Modifier.padding(horizontal = 14.dp, vertical = 9.dp)
                      )
                  }

                  if (msg.isOutgoing) {
                      Spacer(modifier = Modifier.height(2.dp))
                      val label = when (msg.deliveryStatus) {
                          DeliveryStatus.SENDING -> "Sending..."
                          DeliveryStatus.DELIVERED -> "Delivered"
                          DeliveryStatus.FAILED -> "Not Delivered"
                      }
                      Text(
                          text = label,
                          fontSize = 10.sp,
                          color = if (msg.deliveryStatus == DeliveryStatus.FAILED) Color(0xFFFF453A) else Color(0xFF8E8E93),
                          modifier = Modifier.padding(end = 4.dp)
                      )
                  }
              }
          }

          // ============================================================================
          // NEW CHAT MODAL (Enter ID or Select from Nearby LAN Peers)
          // ============================================================================

          @Composable
          fun NewChatDialog(
              nearbyPeers: List<LanPeer>,
              onDismiss: () -> Unit,
              onSelect: (String, String?, String?) -> Unit
          ) {
              var targetIdInput by remember { mutableStateOf("") }
              var optionalIpInput by remember { mutableStateOf("") }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = Color(0xFF1C1C1E),
                  title = {
                      Text(
                          text = "New Message",
                          fontWeight = FontWeight.Bold,
                          color = Color.White
                      )
                  },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Text(
                              text = "To: Enter contact's LAN User ID",
                              fontSize = 12.sp,
                              color = Color(0xFF8E8E93)
                          )
                          OutlinedTextField(
                              value = targetIdInput,
                              onValueChange = { targetIdInput = it },
                              label = { Text("Contact User ID (e.g. cb_1234)") },
                              prefix = { Text("@", color = Color(0xFF007AFF)) },
                              singleLine = true,
                              colors = OutlinedTextFieldDefaults.colors(
                                  focusedBorderColor = Color(0xFF007AFF),
                                  unfocusedBorderColor = Color(0xFF38383A)
                              )
                          )
                          OutlinedTextField(
                              value = optionalIpInput,
                              onValueChange = { optionalIpInput = it },
                              label = { Text("LAN IP (Optional if on same Wi-Fi)") },
                              singleLine = true,
                              colors = OutlinedTextFieldDefaults.colors(
                                  focusedBorderColor = Color(0xFF007AFF),
                                  unfocusedBorderColor = Color(0xFF38383A)
                              )
                          )

                          if (nearbyPeers.isNotEmpty()) {
                              Spacer(modifier = Modifier.height(4.dp))
                              Text(
                                  text = "DISCOVERED NEARBY ON WI-FI",
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = Color(0xFF8E8E93)
                              )
                              nearbyPeers.forEach { peer ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clip(RoundedCornerShape(8.dp))
                                          .clickable {
                                              onSelect(peer.customId, peer.displayName, peer.ipAddress)
                                          }
                                          .padding(vertical = 6.dp, horizontal = 4.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Box(
                                          modifier = Modifier
                                              .size(26.dp)
                                              .clip(CircleShape)
                                              .background(Color(peer.avatarColorHex)),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text(
                                              text = peer.displayName.take(1).uppercase(),
                                              color = Color.White,
                                              fontSize = 11.sp
                                          )
                                      }
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Column {
                                          Text(
                                              text = peer.displayName,
                                              fontSize = 13.sp,
                                              color = Color.White,
                                              fontWeight = FontWeight.SemiBold
                                          )
                                          Text(
                                              text = "@${peer.customId} (${peer.ipAddress})",
                                              fontSize = 11.sp,
                                              fontFamily = FontFamily.Monospace,
                                              color = Color(0xFF8E8E93)
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          onClick = {
                              onSelect(targetIdInput.trim(), null, optionalIpInput.trim().ifBlank { null })
                          },
                          enabled = targetIdInput.isNotBlank(),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF007AFF))
                      ) {
                          Text("Chat", color = Color.White)
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text("Cancel", color = Color(0xFF8E8E93))
                      }
                  }
              )
          }
          EOF

      - name: Compile Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Chat-Black-LAN.apk

      - name: Upload Compiled Chat Black APK
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Black-APK
          path: Chat-Black-LAN.apk
          if-no-files-found: error
