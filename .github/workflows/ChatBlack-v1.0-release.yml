          class BgramDaemonService : Service() {
              override fun onCreate() {
                  super.onCreate()
                  BgramHub.init(applicationContext)
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val chId = "chatblack_bg_service"
                  nm.createNotificationChannel(
                      NotificationChannel(chId, "ChatBlack Background", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, chId)
                      .setSmallIcon(android.R.drawable.sym_action_chat)
                      .setContentTitle("ChatBlack Active ($APP_VERSION_LABEL)")
                      .setContentText("Listening for messages, files, photos & voice notes")
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(101, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(101, notif)
                  }
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null
          }

          object MediaHelper {
              private var recorder: MediaRecorder? = null
              private var outFile: File? = null
              private var startMs: Long = 0L
              private var player: MediaPlayer? = null
              private val rawAmps = mutableListOf<Int>()

              val isCurrentlyRecording = MutableStateFlow(false)
              val recordingSec = MutableStateFlow(0)
              val liveRecordingAmps = MutableStateFlow<List<Int>>(emptyList())

              val playingMsgId = MutableStateFlow<String?>(null)
              val voicePlaying = MutableStateFlow(false)
              val progressFraction = MutableStateFlow(0f)
              val currentSec = MutableStateFlow(0)

              fun startRecording(ctx: Context): Boolean {
                  return try {
                      cancelRecording()
                      val f = File(ctx.cacheDir, "voice_${System.currentTimeMillis()}.m4a")
                      outFile = f
                      val r = MediaRecorder()
                      r.setAudioSource(MediaRecorder.AudioSource.MIC)
                      r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      r.setAudioSamplingRate(16000)
                      r.setAudioEncodingBitRate(32000)
                      r.setOutputFile(f.absolutePath)
                      r.prepare()
                      r.start()
                      recorder = r
                      startMs = System.currentTimeMillis()
                      rawAmps.clear()
                      liveRecordingAmps.value = List(28) { 12 }
                      recordingSec.value = 0
                      isCurrentlyRecording.value = true
                      startAmplitudeSampler()
                      true
                  } catch (e: Exception) {
                      isCurrentlyRecording.value = false
                      false
                  }
              }

              private fun startAmplitudeSampler() {
                  BgramHub.scope.launch {
                      while (isActive && isCurrentlyRecording.value) {
                          try {
                              val r = recorder
                              if (r != null) {
                                  val amp = r.maxAmplitude
                                  val norm = ((amp.toFloat() / 16000f).coerceIn(0.08f, 1f) * 100f).toInt()
                                  synchronized(rawAmps) {
                                      rawAmps.add(norm)
                                      val tail = rawAmps.takeLast(28)
                                      val padded = if (tail.size < 28) List(28 - tail.size) { 10 } + tail else tail
                                      liveRecordingAmps.value = padded
                                  }
                                  recordingSec.value = ((System.currentTimeMillis() - startMs) / 1000L).toInt()
                              }
                          } catch (e: Exception) {}
                          delay(90)
                      }
                  }
              }

              fun cancelRecording() {
                  isCurrentlyRecording.value = false
                  val r = recorder
                  recorder = null
                  try {
                      r?.stop()
                  } catch (e: Exception) {}
                  try {
                      r?.release()
                  } catch (e: Exception) {}
                  try {
                      outFile?.delete()
                  } catch (e: Exception) {}
                  outFile = null
              }

              fun stopRecording(): VoiceClip? {
                  isCurrentlyRecording.value = false
                  val r = recorder ?: return null
                  recorder = null
                  return try {
                      r.stop()
                      r.release()
                      val sec = ((System.currentTimeMillis() - startMs) / 1000L).toInt().coerceAtLeast(1)
                      val f = outFile
                      outFile = null
                      val waveCsv = buildNormalizedWaveformCsv()
                      if (f != null && f.exists()) {
                          val bytes = f.readBytes()
                          f.delete()
                          VoiceClip(Base64.encodeToString(bytes, Base64.NO_WRAP), sec, waveCsv)
                      } else {
                          null
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun buildNormalizedWaveformCsv(): String {
                  val snapshot = synchronized(rawAmps) { rawAmps.toList() }
                  if (snapshot.isEmpty()) {
                      return List(28) { 25 }.joinToString(",")
                  }
                  val targetCount = 28
                  val bars = mutableListOf<Int>()
                  for (i in 0 until targetCount) {
                      val idx = ((i.toFloat() / targetCount.toFloat()) * snapshot.size).toInt().coerceIn(0, snapshot.size - 1)
                      bars.add(snapshot[idx].coerceIn(10, 100))
                  }
                  return bars.joinToString(",")
              }

              fun parseWaveformBars(csv: String): List<Int> {
                  val parsed = csv.split(",").mapNotNull { it.trim().toIntOrNull()?.coerceIn(10, 100) }
                  if (parsed.size >= 8) return parsed
                  return listOf(22, 40, 68, 35, 85, 54, 30, 75, 92, 48, 25, 62, 80, 44, 32, 70, 88, 52, 28, 60, 45, 76, 38, 64, 50, 30, 42, 24)
              }

              fun toggleVoicePlayback(ctx: Context, msgId: String, b64: String) {
                  try {
                      if (playingMsgId.value == msgId && player != null) {
                          val p = player!!
                          if (p.isPlaying) {
                              p.pause()
                              MediaHelper.voicePlaying.value = false
                          } else {
                              p.start()
                              MediaHelper.voicePlaying.value = true
                              startProgressTracker(msgId)
                          }
                          return
                      }

                      player?.release()
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      val tmp = File(ctx.cacheDir, "play_${System.currentTimeMillis()}.m4a")
                      tmp.writeBytes(bytes)
                      val mp = MediaPlayer().apply {
                          setDataSource(tmp.absolutePath)
                          prepare()
                          start()
                          setOnCompletionListener {
                              it.release()
                              tmp.delete()
                              if (playingMsgId.value == msgId) {
                                  MediaHelper.voicePlaying.value = false
                                  progressFraction.value = 0f
                                  currentSec.value = 0
                                  playingMsgId.value = null
                              }
                          }
                      }
                      player = mp
                      playingMsgId.value = msgId
                      MediaHelper.voicePlaying.value = true
                      progressFraction.value = 0f
                      currentSec.value = 0
                      startProgressTracker(msgId)
                  } catch (e: Exception) {}
              }

              fun seekVoice(msgId: String, fraction: Float) {
                  val clamped = fraction.coerceIn(0f, 1f)
                  if (playingMsgId.value == msgId && player != null) {
                      try {
                          val p = player!!
                          val dur = p.duration.coerceAtLeast(1)
                          val targetMs = (dur * clamped).toInt()
                          p.seekTo(targetMs)
                          progressFraction.value = clamped
                          currentSec.value = targetMs / 1000
                      } catch (e: Exception) {}
                  }
              }

              private fun startProgressTracker(msgId: String) {
                  BgramHub.scope.launch {
                      while (isActive && playingMsgId.value == msgId && MediaHelper.voicePlaying.value) {
                          try {
                              val p = player
                              if (p != null && p.isPlaying) {
                                  val dur = p.duration.coerceAtLeast(1)
                                  val pos = p.currentPosition.coerceAtLeast(0)
                                  progressFraction.value = (pos.toFloat() / dur.toFloat()).coerceIn(0f, 1f)
                                  currentSec.value = pos / 1000
                              }
                          } catch (e: Exception) {}
                          delay(80)
                      }
                  }
              }

              fun encodeUriToFilePayload(ctx: Context, uri: Uri): FilePayload? {
                  return try {
                      var displayName = "file_${System.currentTimeMillis()}"
                      ctx.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                          val nameIdx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (nameIdx >= 0 && cursor.moveToFirst()) {
                              val raw = cursor.getString(nameIdx)
                              if (!raw.isNullOrBlank()) displayName = raw
                          }
                      }
                      val mime = ctx.contentResolver.getType(uri) ?: guessMimeFromName(displayName)
                      val bytes = ctx.contentResolver.openInputStream(uri)?.use { it.readBytes() } ?: return null
                      if (bytes.size > 15 * 1024 * 1024) {
                          return null
                      }
                      val b64 = Base64.encodeToString(bytes, Base64.NO_WRAP)
                      saveFileToChatBlackFolder(ctx, displayName, mime, b64)
                      FilePayload(displayName, mime, b64, bytes.size.toLong())
                  } catch (e: Exception) {
                      null
                  }
              }

              fun saveFileToChatBlackFolder(ctx: Context, fileName: String, mime: String, fileB64: String): File? {
                  return try {
                      val cleanName = fileName.filter { it.isLetterOrDigit() || it == '.' || it == '_' || it == '-' || it == ' ' }.trim().ifBlank { "file.bin" }
                      val bytes = Base64.decode(fileB64, Base64.DEFAULT)

                      val baseDir = ctx.getExternalFilesDir(null) ?: ctx.filesDir
                      val appChatBlackDir = File(baseDir, "chat black")
                      if (!appChatBlackDir.exists()) appChatBlackDir.mkdirs()
                      val localFile = File(appChatBlackDir, cleanName)
                      localFile.writeBytes(bytes)

                      try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              val resolver = ctx.contentResolver
                              val cv = ContentValues().apply {
                                  put(MediaStore.MediaColumns.DISPLAY_NAME, cleanName)
                                  put(MediaStore.MediaColumns.MIME_TYPE, mime.ifBlank { "application/octet-stream" })
                                  put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/chat black")
                              }
                              val destUri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)
                              if (destUri != null) {
                                  resolver.openOutputStream(destUri)?.use { out ->
                                      out.write(bytes)
                                  }
                              }
                          } else {
                              val pubDir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "chat black")
                              if (!pubDir.exists()) pubDir.mkdirs()
                              File(pubDir, cleanName).writeBytes(bytes)
                          }
                      } catch (e: Exception) {}

                      localFile
                  } catch (e: Exception) {
                      null
                  }
              }

              fun openChatFile(ctx: Context, item: ChatItem) {
                  try {
                      val cleanName = item.fileName.filter { it.isLetterOrDigit() || it == '.' || it == '_' || it == '-' || it == ' ' }.trim().ifBlank { "file.bin" }
                      val baseDir = ctx.getExternalFilesDir(null) ?: ctx.filesDir
                      val folder = File(baseDir, "chat black")
                      if (!folder.exists()) folder.mkdirs()
                      var target = File(folder, cleanName)
                      if (!target.exists() && item.fileB64.isNotBlank()) {
                          target = saveFileToChatBlackFolder(ctx, item.fileName, item.fileMime, item.fileB64) ?: target
                      }
                      if (!target.exists()) {
                          Toast.makeText(ctx, "File not found in chat black folder", Toast.LENGTH_SHORT).show()
                          return
                      }
                      val uri = FileProvider.getUriForFile(ctx, "${ctx.packageName}.provider", target)
                      val mime = item.fileMime.ifBlank { guessMimeFromName(cleanName) }
                      val viewIntent = Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, mime)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      ctx.startActivity(Intent.createChooser(viewIntent, "Open ${item.fileName}").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                      Toast.makeText(ctx, "Saved in Downloads/chat black/${item.fileName}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun guessMimeFromName(name: String): String {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  if (ext.isNotBlank()) {
                      MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext)?.let { return it }
                  }
                  return "*/*"
              }

              fun formatFileSize(bytes: Long): String {
                  if (bytes <= 0L) return ""
                  if (bytes < 1024L) return "$bytes B"
                  val kb = bytes / 1024.0
                  if (kb < 1024.0) return String.format(Locale.US, "%.1f KB", kb)
                  val mb = kb / 1024.0
                  return String.format(Locale.US, "%.1f MB", mb)
              }

              fun encodeUriToAvatarB64(ctx: Context, uri: Uri): String {
                  return encodeScaledImageB64(ctx, uri, maxDim = 96, quality = 75)
              }

              fun encodeUriToChatImageB64(ctx: Context, uri: Uri): String {
                  return encodeScaledImageB64(ctx, uri, maxDim = 720, quality = 78)
              }

              private fun encodeScaledImageB64(ctx: Context, uri: Uri, maxDim: Int, quality: Int): String {
                  return try {
                      val stream = ctx.contentResolver.openInputStream(uri)
                      if (stream != null) {
                          val orig = BitmapFactory.decodeStream(stream)
                          stream.close()
                          if (orig == null) return ""
                          val w = orig.width.coerceAtLeast(1)
                          val h = orig.height.coerceAtLeast(1)
                          val scale = (maxDim.toFloat() / maxOf(w, h).toFloat()).coerceAtMost(1f)
                          val nw = (w * scale).toInt().coerceAtLeast(1)
                          val nh = (h * scale).toInt().coerceAtLeast(1)
                          val scaled = Bitmap.createScaledBitmap(orig, nw, nh, true)
                          val bos = ByteArrayOutputStream()
                          scaled.compress(Bitmap.CompressFormat.JPEG, quality, bos)
                          Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)
                      } else {
                          ""
                      }
                  } catch (e: Exception) {
                      ""
                  }
              }

              fun decodeBitmap(b64: String): Bitmap? {
                  if (b64.isBlank()) return null
                  return try {
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  } catch (e: Exception) {
                      null
                  }
              }
          }

