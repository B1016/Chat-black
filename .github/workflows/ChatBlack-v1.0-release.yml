          // ============================================================================
          // 2. CORE LAN HUB, HOTSPOT DISCOVERY & SWITCHABLE APK HTTP SERVER
          // ============================================================================

          object BgramHub {
              private const val UDP_PORT = 45454
              private const val TCP_PORT = 45455
              const val HTTP_PORT = 8080
              private const val MCAST = "239.255.45.45"

              lateinit var prefs: SharedPreferences
              val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              val account = MutableStateFlow(UserAccount("", ""))
              val peers = MutableStateFlow<List<PeerNode>>(emptyList())
              val conversations = MutableStateFlow<List<ConversationMeta>>(emptyList())
              val messages = MutableStateFlow<List<ChatItem>>(emptyList())
              val activeConvId = MutableStateFlow<String?>(null)
              val localIp = MutableStateFlow("0.0.0.0")
              val apkServerEnabled = MutableStateFlow(true)

              private val peerCache = ConcurrentHashMap<String, PeerNode>()
              private var initialized = false

              fun init(ctx: Context) {
                  if (initialized) return
                  initialized = true
                  prefs = ctx.applicationContext.getSharedPreferences("bgram_store", Context.MODE_PRIVATE)
                  loadState(ctx.applicationContext)
                  startNetworking(ctx.applicationContext)
              }

              private fun resolveDeviceBoundId(ctx: Context): String {
                  val saved = prefs.getString("device_uid", null)
                  if (!saved.isNullOrBlank()) return saved
                  val androidId = try {
                      Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ANDROID_ID) ?: ""
                  } catch (e: Exception) {
                      ""
                  }
                  val clean = androidId.filter { it.isLetterOrDigit() }.lowercase()
                  val bound = if (clean.length >= 6) {
                      "bg_" + clean.takeLast(6)
                  } else {
                      "bg_" + Random.nextInt(100000, 999999)
                  }
                  prefs.edit().putString("device_uid", bound).apply()
                  return bound
              }

              private fun loadState(ctx: Context) {
                  val uid = resolveDeviceBoundId(ctx)
                  account.value = UserAccount(
                      uid = uid,
                      displayName = prefs.getString("name", "") ?: "",
                      avatarB64 = prefs.getString("avatar", "") ?: "",
                      loggedIn = prefs.getBoolean("logged_in", false)
                  )
                  apkServerEnabled.value = prefs.getBoolean("apk_server_enabled", true)
                  val convArr = JSONArray(prefs.getString("convs", "[]") ?: "[]")
                  val convList = mutableListOf<ConversationMeta>()
                  val msgList = mutableListOf<ChatItem>()
                  for (i in 0 until convArr.length()) {
                      val o = convArr.getJSONObject(i)
                      val cid = o.getString("convId")
                      convList.add(
                          ConversationMeta(
                              convId = cid,
                              title = o.optString("title", cid),
                              isGroup = o.optBoolean("isGroup", false),
                              membersCsv = o.optString("membersCsv", ""),
                              peerIp = o.optString("peerIp", ""),
                              avatarB64 = o.optString("avatarB64", ""),
                              snippet = o.optString("snippet", ""),
                              updatedAt = o.optLong("updatedAt", 0L),
                              unread = o.optInt("unread", 0)
                          )
                      )
                      msgList.addAll(loadConvMessages("msg_$cid").map { it.copy(convId = cid) })
                  }
                  conversations.value = convList.sortedByDescending { it.updatedAt }
                  messages.value = msgList
              }

              fun setApkServerEnabled(enabled: Boolean) {
                  apkServerEnabled.value = enabled
                  prefs.edit().putBoolean("apk_server_enabled", enabled).apply()
              }

              private fun loadConvMessages(storageKey: String): List<ChatItem> {
                  val arr = JSONArray(prefs.getString(storageKey, "[]") ?: "[]")
                  val list = mutableListOf<ChatItem>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      list.add(
                          ChatItem(
                              id = o.getString("id"),
                              convId = o.optString("convId", ""),
                              senderId = o.getString("senderId"),
                              senderName = o.optString("senderName", ""),
                              text = o.optString("text", ""),
                              imageB64 = o.optString("imageB64", ""),
                              voiceB64 = o.optString("voiceB64", ""),
                              voiceSec = o.optInt("voiceSec", 0),
                              waveformCsv = o.optString("waveformCsv", ""),
                              fileName = o.optString("fileName", ""),
                              fileMime = o.optString("fileMime", ""),
                              fileB64 = o.optString("fileB64", ""),
                              fileSize = o.optLong("fileSize", 0L),
                              replyToId = o.optString("replyToId", ""),
                              replyToSender = o.optString("replyToSender", ""),
                              replyToText = o.optString("replyToText", ""),
                              reactionsCsv = o.optString("reactionsCsv", ""),
                              ts = o.getLong("ts"),
                              mine = o.getBoolean("mine"),
                              ack = o.optBoolean("ack", true),
                              readByPeer = o.optBoolean("readByPeer", false)
                          )
                      )
                  }
                  return list
              }

              private fun persistConvs() {
                  val arr = JSONArray()
                  conversations.value.forEach { c ->
                      arr.put(JSONObject().apply {
                          put("convId", c.convId)
                          put("title", c.title)
                          put("isGroup", c.isGroup)
                          put("membersCsv", c.membersCsv)
                          put("peerIp", c.peerIp)
                          put("avatarB64", c.avatarB64)
                          put("snippet", c.snippet)
                          put("updatedAt", c.updatedAt)
                          put("unread", c.unread)
                      })
                  }
                  prefs.edit().putString("convs", arr.toString()).apply()
              }

              private fun persistMessages(storageKey: String, list: List<ChatItem>) {
                  val arr = JSONArray()
                  list.takeLast(120).forEach { m ->
                      arr.put(JSONObject().apply {
                          put("id", m.id)
                          put("convId", m.convId)
                          put("senderId", m.senderId)
                          put("senderName", m.senderName)
                          put("text", m.text)
                          put("imageB64", m.imageB64)
                          put("voiceB64", m.voiceB64)
                          put("voiceSec", m.voiceSec)
                          put("waveformCsv", m.waveformCsv)
                          put("fileName", m.fileName)
                          put("fileMime", m.fileMime)
                          put("fileB64", m.fileB64)
                          put("fileSize", m.fileSize)
                          put("replyToId", m.replyToId)
                          put("replyToSender", m.replyToSender)
                          put("replyToText", m.replyToText)
                          put("reactionsCsv", m.reactionsCsv)
                          put("ts", m.ts)
                          put("mine", m.mine)
                          put("ack", m.ack)
                          put("readByPeer", m.readByPeer)
                      })
                  }
                  prefs.edit().putString(storageKey, arr.toString()).apply()
              }

              fun login(name: String, avatarB64: String) {
                  val updated = account.value.copy(
                      displayName = name.trim(),
                      avatarB64 = avatarB64,
                      loggedIn = true
                  )
                  account.value = updated
                  prefs.edit()
                      .putString("name", updated.displayName)
                      .putString("avatar", updated.avatarB64)
                      .putBoolean("logged_in", true)
                      .apply()
              }

              fun logout() {
                  activeConvId.value = null
                  val updated = account.value.copy(loggedIn = false)
                  account.value = updated
                  prefs.edit().putBoolean("logged_in", false).apply()
              }

              fun openOrCreateDirect(peerUid: String, nameHint: String?, ipHint: String?) {
                  val id = peerUid.trim().removePrefix("@").lowercase()
                  val known = peerCache[id]
                  val cur = conversations.value.toMutableList()
                  val idx = cur.indexOfFirst { it.convId == id }
                  if (idx == -1) {
                      cur.add(0, ConversationMeta(
                          convId = id,
                          title = nameHint ?: known?.name ?: id,
                          isGroup = false,
                          membersCsv = id,
                          peerIp = ipHint ?: known?.ip ?: "",
                          avatarB64 = known?.avatarB64 ?: ""
                      ))
                  } else {
                      cur[idx] = cur[idx].copy(unread = 0)
                  }
                  conversations.value = cur
                  persistConvs()
                  activeConvId.value = id
                  markConversationReadAndNotify(id)
              }

              fun createGroup(title: String, memberIds: List<String>) {
                  val cleanMembers = (memberIds.map { it.trim().removePrefix("@").lowercase() } + account.value.uid.lowercase())
                      .filter { it.isNotBlank() }.distinct()
                  val gid = "grp_" + Random.nextInt(10000, 99999)
                  val meta = ConversationMeta(
                      convId = gid,
                      title = title.trim().ifBlank { "Group Chat" },
                      isGroup = true,
                      membersCsv = cleanMembers.joinToString(",")
                  )
                  conversations.value = listOf(meta) + conversations.value
                  persistConvs()
                  activeConvId.value = gid
              }

              private fun resolveConversationTargetIps(conv: ConversationMeta): List<String> {
                  val meUid = account.value.uid.lowercase()
                  return if (conv.isGroup) {
                      conv.membersCsv.split(",").map { it.trim().lowercase() }
                          .filter { it != meUid }
                          .mapNotNull { peerCache[it]?.ip }
                          .distinct()
                  } else {
                      listOfNotNull(peerCache[conv.convId.lowercase()]?.ip ?: conv.peerIp.takeIf { it.isNotBlank() }).distinct()
                  }
              }

              fun sendChat(
                  cid: String,
                  text: String,
                  imageB64: String = "",
                  voiceB64: String = "",
                  voiceSec: Int = 0,
                  waveformCsv: String = "",
                  filePayload: FilePayload? = null,
                  replyTo: ChatItem? = null
              ) {
                  val conv = conversations.value.firstOrNull { it.convId == cid } ?: return
                  val me = account.value
                  val rPreview = when {
                      replyTo == null -> ""
                      replyTo.voiceB64.isNotBlank() -> "Voice Note (${replyTo.voiceSec}s)"
                      replyTo.fileName.isNotBlank() -> "File: ${replyTo.fileName}"
                      replyTo.imageB64.isNotBlank() -> "Photo"
                      else -> replyTo.text.take(60)
                  }
                  val msg = ChatItem(
                      convId = cid,
                      senderId = me.uid,
                      senderName = me.displayName,
                      text = text,
                      imageB64 = imageB64,
                      voiceB64 = voiceB64,
                      voiceSec = voiceSec,
                      waveformCsv = waveformCsv,
                      fileName = filePayload?.name ?: "",
                      fileMime = filePayload?.mime ?: "",
                      fileB64 = filePayload?.b64 ?: "",
                      fileSize = filePayload?.size ?: 0L,
                      replyToId = replyTo?.id ?: "",
                      replyToSender = replyTo?.senderName ?: "",
                      replyToText = rPreview,
                      mine = true,
                      ack = false,
                      readByPeer = false
                  )
                  appendMessage(cid, msg, isIncoming = false)

                  scope.launch {
                      val targets = resolveConversationTargetIps(conv)
                      var anyAck = false
                      targets.forEach { ip ->
                          val ok = transmitChatPacket(ip, conv, msg)
                          if (ok) anyAck = true
                      }
                      if (anyAck) markAck(cid, msg.id)
                  }
              }

              fun sendReaction(cid: String, targetMsgId: String, emoji: String) {
                  val conv = conversations.value.firstOrNull { it.convId == cid } ?: return
                  val me = account.value
                  applyReactionLocal(cid, targetMsgId, me.displayName.ifBlank { me.uid }, emoji)

                  scope.launch {
                      val pkt = JSONObject().apply {
                          put("pktType", "REACTION")
                          put("convId", if (conv.isGroup) conv.convId else me.uid.lowercase())
                          put("isGroup", conv.isGroup)
                          put("senderId", me.uid)
                          put("senderName", me.displayName)
                          put("targetMsgId", targetMsgId)
                          put("emoji", emoji)
                      }
                      resolveConversationTargetIps(conv).forEach { ip ->
                          transmitRawJson(ip, pkt)
                      }
                  }
              }

              fun markConversationReadAndNotify(cid: String) {
                  val conv = conversations.value.firstOrNull { it.convId == cid } ?: return
                  val updatedConvs = conversations.value.map {
                      if (it.convId == cid && it.unread > 0) it.copy(unread = 0) else it
                  }
                  if (updatedConvs != conversations.value) {
                      conversations.value = updatedConvs
                      persistConvs()
                  }
                  val me = account.value
                  scope.launch {
                      val pkt = JSONObject().apply {
                          put("pktType", "READ")
                          put("convId", if (conv.isGroup) conv.convId else me.uid.lowercase())
                          put("isGroup", conv.isGroup)
                          put("senderId", me.uid)
                      }
                      resolveConversationTargetIps(conv).forEach { ip ->
                          transmitRawJson(ip, pkt)
                      }
                  }
              }

              private fun applyReactionLocal(cid: String, targetMsgId: String, actor: String, emoji: String) {
                  val entry = "$emoji $actor"
                  val nextAll = messages.value.map { m ->
                      if (m.convId == cid && m.id == targetMsgId) {
                          val existing = m.reactionsCsv.split("|").filter { it.isNotBlank() }.toMutableList()
                          if (existing.contains(entry)) {
                              existing.remove(entry)
                          } else {
                              existing.add(entry)
                          }
                          m.copy(reactionsCsv = existing.joinToString("|"))
                      } else m
                  }
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })
              }

              private fun markPeerReadLocal(cid: String) {
                  val nextAll = messages.value.map { m ->
                      if (m.convId == cid && m.mine && !m.readByPeer) {
                          m.copy(ack = true, readByPeer = true)
                      } else m
                  }
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })
              }

              private fun appendMessage(cid: String, item: ChatItem, isIncoming: Boolean) {
                  val curAll = messages.value
                  if (curAll.any { it.convId == cid && it.id == item.id }) return
                  val nextAll = curAll + item.copy(convId = cid)
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })

                  val preview = when {
                      item.voiceB64.isNotBlank() -> "Voice message (${item.voiceSec}s)"
                      item.fileName.isNotBlank() -> "File: ${item.fileName}"
                      item.imageB64.isNotBlank() -> if (item.text.isNotBlank()) "Photo: ${item.text}" else "Sent a photo"
                      else -> item.text
                  }
                  val isOpen = activeConvId.value == cid
                  val updatedConvs = conversations.value.map { c ->
                      if (c.convId == cid) {
                          c.copy(
                              snippet = preview,
                              updatedAt = item.ts,
                              unread = if (isIncoming && !isOpen) c.unread + 1 else 0
                          )
                      } else c
                  }.sortedByDescending { it.updatedAt }
                  conversations.value = updatedConvs
                  persistConvs()
              }

              private fun markAck(cid: String, msgId: String) {
                  val nextAll = messages.value.map {
                      if (it.convId == cid && it.id == msgId) it.copy(ack = true) else it
                  }
                  messages.value = nextAll
                  persistMessages("msg_$cid", nextAll.filter { it.convId == cid })
              }

              private fun transmitChatPacket(ip: String, conv: ConversationMeta, item: ChatItem): Boolean {
                  val pkt = JSONObject().apply {
                      put("pktType", "CHAT")
                      put("id", item.id)
                      put("convId", if (conv.isGroup) conv.convId else account.value.uid.lowercase())
                      put("convTitle", if (conv.isGroup) conv.title else account.value.displayName)
                      put("isGroup", conv.isGroup)
                      put("membersCsv", conv.membersCsv)
                      put("senderId", account.value.uid)
                      put("senderName", account.value.displayName)
                      put("senderAvatar", account.value.avatarB64)
                      put("text", item.text)
                      put("imageB64", item.imageB64)
                      put("voiceB64", item.voiceB64)
                      put("voiceSec", item.voiceSec)
                      put("waveformCsv", item.waveformCsv)
                      put("fileName", item.fileName)
                      put("fileMime", item.fileMime)
                      put("fileB64", item.fileB64)
                      put("fileSize", item.fileSize)
                      put("replyToId", item.replyToId)
                      put("replyToSender", item.replyToSender)
                      put("replyToText", item.replyToText)
                      put("reactionsCsv", item.reactionsCsv)
                      put("ts", item.ts)
                  }
                  return transmitRawJson(ip, pkt)
              }

              private fun transmitRawJson(ip: String, pkt: JSONObject): Boolean {
                  return try {
                      Socket().use { s ->
                          s.connect(InetSocketAddress(ip, TCP_PORT), 5000)
                          s.soTimeout = 8000
                          val out = PrintWriter(OutputStreamWriter(s.getOutputStream(), Charsets.UTF_8), true)
                          val inp = BufferedReader(InputStreamReader(s.getInputStream(), Charsets.UTF_8))
                          out.println(pkt.toString())
                          inp.readLine() == "ACK"
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun sendDiscoveryBeacon(targetAddr: InetAddress, myIp: String) {
                  try {
                      val data = JSONObject().apply {
                          put("uid", account.value.uid.lowercase())
                          put("name", account.value.displayName)
                          put("ip", myIp)
                          put("avatar", account.value.avatarB64)
                      }.toString().toByteArray(Charsets.UTF_8)
                      DatagramSocket().use { ds ->
                          ds.broadcast = true
                          ds.send(DatagramPacket(data, data.size, targetAddr, UDP_PORT))
                      }
                  } catch (e: Exception) {}
              }

              private fun startNetworking(ctx: Context) {
                  try {
                      val wm = ctx.getSystemService(Context.WIFI_SERVICE) as? WifiManager
                      wm?.createMulticastLock("bgram_lock")?.apply {
                          setReferenceCounted(true)
                          acquire()
                      }
                  } catch (e: Exception) {}

                  scope.launch {
                      while (isActive) {
                          val ip = resolveLanIp()
                          localIp.value = ip
                          if (ip != "0.0.0.0" && account.value.loggedIn) {
                              val targets = resolveDiscoveryTargets(ip)
                              targets.forEach { addr ->
                                  sendDiscoveryBeacon(addr, ip)
                              }
                          }
                          delay(3000)
                      }
                  }

                  scope.launch {
                      try {
                          val ms = MulticastSocket(UDP_PORT).apply {
                              reuseAddress = true
                              broadcast = true
                              try {
                                  joinGroup(InetAddress.getByName(MCAST))
                              } catch (e: Exception) {}
                          }
                          val buf = ByteArray(65500)
                          while (isActive) {
                              val dp = DatagramPacket(buf, buf.size)
                              ms.receive(dp)
                              val j = JSONObject(String(dp.data, 0, dp.length, Charsets.UTF_8))
                              val uid = j.optString("uid", "").lowercase()
                              val remoteIp = dp.address.hostAddress ?: j.optString("ip", "")
                              if (uid.isNotBlank() && uid != account.value.uid.lowercase() && remoteIp.isNotBlank()) {
                                  val isNewPeer = !peerCache.containsKey(uid)
                                  val node = PeerNode(
                                      uid = uid,
                                      name = j.optString("name", uid),
                                      ip = remoteIp,
                                      avatarB64 = j.optString("avatar", "")
                                  )
                                  peerCache[uid] = node
                                  peers.value = peerCache.values.sortedBy { it.name.lowercase() }
                                  syncPeerMetadata(node)

                                  if (isNewPeer && account.value.loggedIn) {
                                      val myIp = localIp.value
                                      if (myIp != "0.0.0.0") {
                                          launch {
                                              try {
                                                  sendDiscoveryBeacon(InetAddress.getByName(remoteIp), myIp)
                                              } catch (e: Exception) {}
                                          }
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                  }

                  scope.launch {
                      try {
                          val ss = ServerSocket().apply {
                              reuseAddress = true
                              bind(InetSocketAddress(TCP_PORT))
                          }
                          while (isActive) {
                              val client = ss.accept()
                              launch { handleClient(ctx, client) }
                          }
                      } catch (e: Exception) {}
                  }

                  scope.launch {
                      try {
                          val httpServer = ServerSocket().apply {
                              reuseAddress = true
                              bind(InetSocketAddress(HTTP_PORT))
                          }
                          while (isActive) {
                              val client = httpServer.accept()
                              if (!apkServerEnabled.value) {
                                  try { client.close() } catch (e: Exception) {}
                              } else {
                                  launch { handleHttpClient(ctx, client) }
                              }
                          }
                      } catch (e: Exception) {}
                  }
              }

              private fun handleHttpClient(ctx: Context, client: Socket) {
                  try {
                      client.use { sock ->
                          if (!apkServerEnabled.value) return
                          sock.soTimeout = 10000
                          val reader = BufferedReader(InputStreamReader(sock.getInputStream(), Charsets.UTF_8))
                          val reqLine = reader.readLine() ?: return
                          while (true) {
                              val hdr = reader.readLine()
                              if (hdr.isNullOrEmpty()) break
                          }
                          val out = BufferedOutputStream(sock.getOutputStream())
                          val apkFile = File(ctx.applicationInfo.sourceDir)

                          if ((reqLine.startsWith("GET /chatblack.apk") || reqLine.startsWith("GET /bgram.apk")) && apkFile.exists()) {
                              val headers = "HTTP/1.1 200 OK\r\n" +
                                  "Content-Type: application/vnd.android.package-archive\r\n" +
                                  "Content-Disposition: attachment; filename=\"ChatBlack-v1.0-release.apk\"\r\n" +
                                  "Content-Length: ${apkFile.length()}\r\n" +
                                  "Connection: close\r\n\r\n"
                              out.write(headers.toByteArray(Charsets.UTF_8))
                              FileInputStream(apkFile).use { fis ->
                                  val buf = ByteArray(16384)
                                  while (true) {
                                      val read = fis.read(buf)
                                      if (read <= 0) break
                                      out.write(buf, 0, read)
                                  }
                              }
                              out.flush()
                          } else {
                              val ip = localIp.value
                              val sizeMb = String.format(Locale.US, "%.1f MB", apkFile.length() / (1024.0 * 1024.0))
                              val html = "\u003c!DOCTYPE html\u003e\u003chtml\u003e\u003chead\u003e" +
                                  "\u003cmeta charset='utf-8'\u003e\u003cmeta name='viewport' content='width=device-width,initial-scale=1'\u003e" +
                                  "\u003ctitle\u003eChatBlack APK Download\u003c/title\u003e\u003c/head\u003e" +
                                  "\u003cbody style='background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:40px 20px;'\u003e" +
                                  "\u003cdiv style='max-width:380px;margin:0 auto;background:#1C1C1E;padding:28px;border-radius:22px;'\u003e" +
                                  "\u003cdiv style='width:76px;height:76px;background:#0C0C10;border:2px solid #222;border-radius:20px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#0B289E;font-weight:bold;'\u003e\u25CF\u003c/div\u003e" +
                                  "\u003ch2 style='margin:0 0 4px;'\u003eChatBlack\u003c/h2\u003e" +
                                  "\u003cp style='color:#007AFF;font-size:12px;margin:0 0 12px;font-weight:bold;'\u003ev1.0-release by ACE\u003c/p\u003e" +
                                  "\u003cp style='color:#999;font-size:14px;margin:0 0 24px;'\u003eHosted by ${account.value.displayName.ifBlank { account.value.uid }} ($ip)\u003cbr\u003eSize: $sizeMb\u003c/p\u003e" +
                                  "\u003ca href='/chatblack.apk' style='display:block;background:#007AFF;color:#fff;text-decoration:none;padding:15px;border-radius:14px;font-weight:bold;font-size:16px;'\u003eDownload ChatBlack.apk\u003c/a\u003e" +
                                  "\u003c/div\u003e\u003c/body\u003e\u003c/html\u003e"
                              val bodyBytes = html.toByteArray(Charsets.UTF_8)
                              val headers = "HTTP/1.1 200 OK\r\n" +
                                  "Content-Type: text/html; charset=utf-8\r\n" +
                                  "Content-Length: ${bodyBytes.size}\r\n" +
                                  "Connection: close\r\n\r\n"
                              out.write(headers.toByteArray(Charsets.UTF_8))
                              out.write(bodyBytes)
                              out.flush()
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun syncPeerMetadata(node: PeerNode) {
                  val updated = conversations.value.map { c ->
                      if (!c.isGroup && c.convId == node.uid) {
                          c.copy(
                              title = node.name.ifBlank { c.title },
                              peerIp = node.ip,
                              avatarB64 = node.avatarB64.ifBlank { c.avatarB64 }
                          )
                      } else c
                  }
                  if (updated != conversations.value) {
                      conversations.value = updated
                      persistConvs()
                  }
              }

              private fun handleClient(ctx: Context, s: Socket) {
                  try {
                      s.use { sock ->
                          val remoteIp = sock.inetAddress.hostAddress ?: ""
                          val reader = BufferedReader(InputStreamReader(sock.getInputStream(), Charsets.UTF_8))
                          val line = reader.readLine()
                          if (line != null) {
                              val out = PrintWriter(OutputStreamWriter(sock.getOutputStream(), Charsets.UTF_8), true)
                              val j = JSONObject(line)
                              val pktType = j.optString("pktType", "CHAT")
                              val isGroup = j.optBoolean("isGroup", false)
                              val senderId = j.optString("senderId", "").lowercase()
                              val senderName = j.optString("senderName", senderId)
                              val cid = if (isGroup) j.optString("convId", senderId) else senderId

                              if (pktType == "REACTION") {
                                  val targetMsgId = j.optString("targetMsgId", "")
                                  val emoji = j.optString("emoji", "")
                                  if (targetMsgId.isNotBlank() && emoji.isNotBlank()) {
                                      applyReactionLocal(cid, targetMsgId, senderName.ifBlank { senderId }, emoji)
                                  }
                                  out.println("ACK")
                                  return
                              }

                              if (pktType == "READ") {
                                  markPeerReadLocal(cid)
                                  out.println("ACK")
                                  return
                              }

                              val senderAvatar = j.optString("senderAvatar", "")
                              val title = if (isGroup) j.optString("convTitle", "Group") else senderName
                              val members = j.optString("membersCsv", senderId)

                              peerCache[senderId] = PeerNode(senderId, senderName, remoteIp, senderAvatar)
                              peers.value = peerCache.values.sortedBy { it.name.lowercase() }

                              val fName = j.optString("fileName", "")
                              val fMime = j.optString("fileMime", "")
                              val fB64 = j.optString("fileB64", "")
                              val fSize = j.optLong("fileSize", 0L)

                              if (fName.isNotBlank() && fB64.isNotBlank()) {
                                  MediaHelper.saveFileToChatBlackFolder(ctx, fName, fMime, fB64)
                              }

                              val msg = ChatItem(
                                  id = j.getString("id"),
                                  convId = cid,
                                  senderId = senderId,
                                  senderName = senderName,
                                  text = j.optString("text", ""),
                                  imageB64 = j.optString("imageB64", ""),
                                  voiceB64 = j.optString("voiceB64", ""),
                                  voiceSec = j.optInt("voiceSec", 0),
                                  waveformCsv = j.optString("waveformCsv", ""),
                                  fileName = fName,
                                  fileMime = fMime,
                                  fileB64 = fB64,
                                  fileSize = fSize,
                                  replyToId = j.optString("replyToId", ""),
                                  replyToSender = j.optString("replyToSender", ""),
                                  replyToText = j.optString("replyToText", ""),
                                  reactionsCsv = j.optString("reactionsCsv", ""),
                                  ts = j.optLong("ts", System.currentTimeMillis()),
                                  mine = false,
                                  ack = true,
                                  readByPeer = true
                              )

                              if (conversations.value.none { it.convId == cid }) {
                                  conversations.value = listOf(
                                      ConversationMeta(
                                          convId = cid,
                                          title = title,
                                          isGroup = isGroup,
                                          membersCsv = members,
                                          peerIp = remoteIp,
                                          avatarB64 = if (isGroup) "" else senderAvatar
                                      )
                                  ) + conversations.value
                              }
                              appendMessage(cid, msg, isIncoming = true)

                              if (activeConvId.value == cid) {
                                  markConversationReadAndNotify(cid)
                              } else {
                                  val bodyText = when {
                                      msg.voiceB64.isNotBlank() -> "Sent a voice message (${msg.voiceSec}s)"
                                      msg.fileName.isNotBlank() -> "Sent a file: ${msg.fileName}"
                                      msg.imageB64.isNotBlank() -> "Sent a photo"
                                      else -> msg.text
                                  }
                                  postMsgNotification(ctx, cid, if (isGroup) "$title ($senderName)" else senderName, bodyText)
                              }
                              out.println("ACK")
                          }
                      }
                  } catch (e: Exception) {}
              }

              private fun postMsgNotification(ctx: Context, cid: String, senderTitle: String, body: String) {
                  val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val chId = "chatblack_alerts"
                  nm.createNotificationChannel(
                      NotificationChannel(chId, "ChatBlack Messages", NotificationManager.IMPORTANCE_HIGH)
                  )
                  val intent = Intent(ctx, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      putExtra("open_conv_id", cid)
                  }
                  val pi = PendingIntent.getActivity(
                      ctx, cid.hashCode(), intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notif = Notification.Builder(ctx, chId)
                      .setSmallIcon(android.R.drawable.sym_action_chat)
                      .setContentTitle(senderTitle)
                      .setContentText(body)
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .build()
                  nm.notify(cid.hashCode(), notif)
              }

              fun resolveLanIp(): String {
                  var fallbackIp = "0.0.0.0"
                  try {
                      for (nif in Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!nif.isUp || nif.isLoopback) continue
                          val nName = nif.name.lowercase()
                          for (ia in nif.interfaceAddresses) {
                              val a = ia.address
                              if (a is Inet4Address && !a.isLoopbackAddress && a.isSiteLocalAddress) {
                                  val host = a.hostAddress ?: continue
                                  if (nName.startsWith("wlan") || nName.startsWith("ap") || nName.startsWith("swlan") || nName.startsWith("rndis")) {
                                      return host
                                  }
                                  if (fallbackIp == "0.0.0.0") fallbackIp = host
                              }
                          }
                      }
                  } catch (e: Exception) {}
                  return fallbackIp
              }

              private fun resolveDiscoveryTargets(myIp: String): List<InetAddress> {
                  val list = mutableListOf<InetAddress>()
                  try {
                      list.add(InetAddress.getByName("255.255.255.255"))
                      list.add(InetAddress.getByName(MCAST))
                      for (nif in Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!nif.isUp || nif.isLoopback) continue
                          for (ia in nif.interfaceAddresses) {
                              val a = ia.address
                              if (a is Inet4Address && !a.isLoopbackAddress) {
                                  ia.broadcast?.let { list.add(it) }
                                  val host = a.hostAddress ?: ""
                                  val parts = host.split(".")
                                  if (parts.size == 4) {
                                      val prefix = "${parts[0]}.${parts[1]}.${parts[2]}"
                                      list.add(InetAddress.getByName("$prefix.1"))
                                      list.add(InetAddress.getByName("$prefix.255"))
                                  }
                              }
                          }
                      }
                      val arp = File("/proc/net/arp")
                      if (arp.exists() && arp.canRead()) {
                          arp.readLines().drop(1).forEach { line ->
                              val cols = line.trim().split(Regex("\\s+"))
                              if (cols.isNotEmpty() && cols[0].contains(".")) {
                                  try {
                                      list.add(InetAddress.getByName(cols[0]))
                                  } catch (e: Exception) {}
                              }
                          }
                      }
                      peerCache.values.forEach { p ->
                          if (p.ip.isNotBlank() && p.ip != myIp) {
                              try {
                                  list.add(InetAddress.getByName(p.ip))
                              } catch (e: Exception) {}
                          }
                      }
                  } catch (e: Exception) {}
                  return list.distinct()
              }
          }

